<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#3d1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda+">
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#555555;
    --paper:#f5f5f5;
    --card:#ffffff;
    --line:#e0e0e0;
    --accent:#1a1a1a;
    --danger:#a3423a;
    --ok:#3f6b4f;
    --radius:14px;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Nunito',sans-serif;font-weight:700;letter-spacing:-0.02em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:14px 26px;border-radius:999px;
    font-size:15px;font-weight:600;letter-spacing:.02em;transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(0.88);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line);filter:none;}
  .btn.ghost:hover{border-color:var(--accent);filter:none;}
  .btn.danger{background:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  input,select,textarea{
    font-family:'Nunito',sans-serif;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;width:100%;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:#1a1a1a;}
  label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
  .field{margin-bottom:18px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;}
  .container{max-width:520px;margin:0 auto;padding:32px 20px 80px;}
  .container.wide{max-width:960px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a;font-weight:700;margin-bottom:8px;}
  .top-plum{background:var(--accent);color:#fff;}
  .top-plum .eyebrow{color:rgba(255,255,255,0.7);}
  .muted{color:var(--ink-soft);}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
  }
  .chip.ok{background:#e3ede6;color:var(--ok);}
  .chip.blocked{background:#f3e2e0;color:var(--danger);}
  .service-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;transition:.15s;
  }
  .service-opt:hover{border-color:#1a1a1a;}
  .service-opt.selected{border-color:var(--accent);background:#f5f5f5;box-shadow:inset 0 0 0 1px var(--accent);}
  .slot{
    padding:10px 6px;text-align:center;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;
  }
  .slot.free{cursor:pointer;}
  .slot.free:hover{border-color:#1a1a1a;}
  .slot.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .slot.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed;}
  .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
  .hero{
    position:relative;min-height:100vh;display:flex;align-items:flex-end;background-size:cover;background-position:center;
  }
  .hero::before{
    content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 90%);
  }
  .hero-content{position:relative;z-index:1;padding:48px 28px 64px;color:#fff;width:100%;max-width:640px;margin:0 auto;text-align:center;}
  .hero-content h1{font-size:clamp(32px,7vw,52px);margin:0 0 10px;}
  .hero-content p{font-size:16px;opacity:.9;margin:0 0 28px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;}
  .topbar .brand{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-toggle{
    padding:10px;border-radius:10px;border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:13px;cursor:pointer;background:#fff;
  }
  .day-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:24px;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;text-decoration:underline;padding:0;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);}

  /* ── SPINNER ────────────────────────────────────────────── */
  @keyframes _spin{to{transform:rotate(360deg);}}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:_spin .7s linear infinite;vertical-align:middle;}
  .spinner-dark{border-color:rgba(0,0,0,0.12);border-top-color:#1a1a1a;}
  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--ink-soft);}

  /* ── TOAST ──────────────────────────────────────────────── */
  #toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(340px,90vw);}
  .toast{background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:auto;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.25);}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.ok{background:#2d5a3d;}
  .toast.err{background:#a3423a;}

  /* ── MOBILE FOUNDATION ─────────────────────────────────── */
  html { -webkit-text-size-adjust:100%; }
  body { -webkit-font-smoothing:antialiased; }

  /* Inputs com 16px evitam zoom automático no iOS */
  input,select,textarea { font-size:16px !important; min-height:48px; }

  /* Botões com área de toque mínima */
  .btn { min-height:48px; display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

  /* Slots maiores para toque */
  .slot { min-height:52px; display:flex; align-items:center; justify-content:center; }

  /* Serviço com área maior */
  .service-opt { min-height:56px; }

  /* Tabs com scroll horizontal sem barra */
  .tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:6px;
          scrollbar-width:none; -ms-overflow-style:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { white-space:nowrap; flex-shrink:0; min-height:40px;
         display:inline-flex; align-items:center; justify-content:center; }

  @media (max-width:600px){
    /* Containers com safe-area para notch e barra do iOS */
    .container {
      padding: 20px 16px calc(80px + env(safe-area-inset-bottom, 0px));
    }
    .container.wide {
      padding: 24px 16px calc(80px + env(safe-area-inset-bottom, 0px));
      max-width: 100%;
    }

    /* Cards com menos padding lateral */
    .card { padding:20px 16px; border-radius:12px; }

    /* Topbar compacta */
    .topbar { padding:12px 16px; }
    .topbar .brand { font-size:17px; }

    /* Botões menores lateralmente mas mantendo altura */
    .btn { padding:12px 18px; font-size:14px; }

    /* Slots grid com colunas menores */
    .slots-grid { grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; }

    /* Hero com safe-area no fundo */
    .hero-content {
      padding: 32px 20px calc(56px + env(safe-area-inset-bottom, 0px));
    }
    .hero-content h1 { font-size:clamp(28px,8vw,42px); }

    /* Rows empilham no mobile */
    .row { flex-direction:column; gap:10px; }

    /* List-item com wrap para ações */
    .list-item { padding:14px 0; align-items:flex-start; flex-wrap:wrap; gap:8px; }
    .list-item > div:first-child { flex:1 1 100%; }

    /* Chip menor */
    .chip { font-size:11px; padding:4px 10px; }

    /* Topbar top-plum com safe-area no topo */
    .top-plum { padding-top:env(safe-area-inset-top, 0px); }

    /* Barra de aviso master */
    div[style*="background:#f0f0f0"] { padding:10px 16px; font-size:12px; }

    /* Eyebrow menor */
    .eyebrow { font-size:11px; }

    /* Field sem margin extra quando dentro de row — gap cuida do espaço */
    .row .field { margin-bottom:0; }

    /* Botão de dias de agendamento */
    .dias-scroll {
      display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;
      scrollbar-width:none; -ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;
    }
    .dias-scroll::-webkit-scrollbar { display:none; }
    .dias-scroll .btn { flex-shrink:0; min-width:56px; padding:10px 8px; font-size:13px; }
  }

  @media (min-width:601px){
    .dias-scroll { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .dias-scroll .btn { flex:1; padding:10px 8px; font-size:13px; min-width:0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Modal de recorte de imagem (fora do #root para não ser destruído na navegação) -->
<div id="cropModal" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;overflow:hidden;max-width:480px;width:100%;display:flex;flex-direction:column;max-height:90vh;">
    <div style="padding:14px 20px;border-bottom:1px solid #e6e1ea;font-weight:700;font-size:16px;flex-shrink:0;">Ajuste a imagem</div>
    <div style="background:#111;overflow:hidden;flex:1;min-height:260px;"><img id="cropImg" src="" style="display:block;max-width:100%;"/></div>
    <div style="padding:14px 16px;display:flex;gap:12px;flex-shrink:0;">
      <button onclick="cancelarCrop()" style="flex:1;background:transparent;color:#1a1a1a;border:1.5px solid #e0e0e0;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Cancelar</button>
      <button id="btnConfirmarCrop" onclick="confirmarCrop()" style="flex:1;background:#1a1a1a;color:#fff;border:none;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Confirmar recorte</button>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script>
let currentUser      = null;
let currentProfile   = null;
let modoRecuperacao  = false;   // true quando o usuário chega pelo link de redefinir senha

// Ícones padrão por tipo de botão
const ICONE_POR_TIPO = {
  whatsapp: '', instagram: '', telefone: '',
  maps: '', site: '', link: ''
};
const LABEL_POR_TIPO = {
  whatsapp: 'WhatsApp', instagram: 'Instagram',
  maps: 'Google Maps', site: 'Site'
};

let empresas = [];
let agendamentos = [];
let loaded = false;

// ── PWA ──────────────────────────────────────────────────────
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
function mostrarBannerPWA(){
  if(document.getElementById('pwa-banner')) return;
  if(!_pwaPrompt || sessionStorage.getItem('pwa-banner-dismissed')) return;
  const banner = document.createElement('div');
  banner.id = 'pwa-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9998;background:#1a1a1a;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.2);';
  banner.innerHTML = `
    <div style="flex:1;font-size:14px;font-weight:600;line-height:1.3;">Instale o Agenda+ no seu aparelho para acesso rápido</div>
    <button onclick="instalarPWA()" style="background:#fff;color:#1a1a1a;border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;">Instalar</button>
    <button onclick="dispensarPWA()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:0 4px;line-height:1;">×</button>
  `;
  document.body.appendChild(banner);
}
window.instalarPWA = async ()=>{
  if(!_pwaPrompt) return;
  _pwaPrompt.prompt();
  const { outcome } = await _pwaPrompt.userChoice;
  if(outcome === 'accepted') _pwaPrompt = null;
  dispensarPWA();
};
window.dispensarPWA = ()=>{
  sessionStorage.setItem('pwa-banner-dismissed','1');
  const b = document.getElementById('pwa-banner');
  if(b) b.remove();
};
// ─────────────────────────────────────────────────────────────

async function loadData(){
  try{
    const { data, error } = await supabaseClient.from('empresas').select('*');
    if(error) throw error;
    empresas = (data || []).map(e => ({
      id:                   e.id,
      slug:                 e.slug,
      nome:                 e.nome,
      fotoUrl:              e.foto_url              || '',
      whatsapp:             e.whatsapp              || '',

      bloqueada:            e.bloqueada,
      // Campos de personalização (Fase 2)
      descricao:            e.descricao             || '',
      logo:                 e.logo                  || '',
      corPrincipal:         sanitizeCor(e.cor_principal || '#3d1f3a'),
      textoDestaque:        e.texto_destaque        || '',
      // Mensagens de lembrete
      msgConfirmacao:       e.msg_confirmacao       || '',
      msgLembrete:          e.msg_lembrete          || '',
      // Relações
      servicos:             [],
      horariosPorMes:       {},
      bloqueios:            [],
      botoes:               []
    }));
  }catch(e){ console.error('Erro ao carregar empresas:', e); empresas = []; }

  if(empresas.length > 0){
    const ids = empresas.map(e => e.id);
    const podeVerDadosPessoais = currentProfile?.role === 'master'
                              || currentProfile?.role === 'owner_empresa';

    const queries = [
      supabaseClient.from('servicos').select('*').in('empresa_id', ids),
      supabaseClient.from('horarios_disponiveis').select('*').in('empresa_id', ids),
      supabaseClient.from('bloqueios').select('*').in('empresa_id', ids),
      supabaseClient.from('botoes_empresa').select('*').in('empresa_id', ids),
      podeVerDadosPessoais
        ? supabaseClient.from('agendamentos').select('*').in('empresa_id', ids)
        : supabaseClient.from('horarios_ocupados').select('*').in('empresa_id', ids),
      currentProfile?.role === 'master'
        ? supabaseClient.from('profiles').select('empresa_id, email, status').eq('role','owner_empresa')
        : Promise.resolve({ data: null })
    ];

    let rServicos, rHorarios, rBloqueios, rBotoes, rAg, rProfiles;
    try{
      [rServicos, rHorarios, rBloqueios, rBotoes, rAg, rProfiles] = await Promise.all(queries);
    }catch(e){
      console.error('Erro ao carregar dados:', e);
      agendamentos = []; loaded = true; return;
    }

    (rServicos.data || []).forEach(s => {
      const emp = empresas.find(e => e.id === s.empresa_id);
      if(emp) emp.servicos.push({ id: s.id, nome: s.nome, duracao: s.duracao, preco: Number(s.preco) });
    });

    (rHorarios.data || []).forEach(h => {
      const emp = empresas.find(e => e.id === h.empresa_id);
      if(!emp) return;
      emp.horariosPorMes[h.mes] = emp.horariosPorMes[h.mes] || [];
      if(!emp.horariosPorMes[h.mes].includes(h.hora)) emp.horariosPorMes[h.mes].push(h.hora);
    });

    (rBloqueios.data || []).forEach(b => {
      const emp = empresas.find(e => e.id === b.empresa_id);
      if(emp) emp.bloqueios.push({ id: b.id, data: b.data, hora: b.hora });
    });

    (rBotoes.data || []).forEach(b => {
      const emp = empresas.find(e => e.id === b.empresa_id);
      if(emp) emp.botoes.push({
        id: b.id, nome: b.nome, tipo: b.tipo, link: b.link,
        icone: b.icone || '', ordem: b.ordem, ativo: b.ativo,
        abrirNovaAba: b.abrir_nova_aba
      });
    });
    empresas.forEach(e => e.botoes.sort((a, b) => a.ordem - b.ordem));

    if(podeVerDadosPessoais){
      agendamentos = (rAg.data || []).map(a => {
        const emp = empresas.find(e => e.id === a.empresa_id);
        return {
          id:                  a.id,
          slug:                emp ? emp.slug : '',
          servicoId:           a.servico_id,
          servicoNome:         a.servico_nome,
          data:                a.data,
          hora:                a.hora,
          nome:                a.nome_cliente,
          telefone:            a.telefone,
          criadoEm:            a.criado_em,
          confirmacaoEnviada:  a.confirmacao_enviada || false,
          lembreteEnviado:     a.lembrete_enviado    || false
        };
      });
    } else {
      agendamentos = (rAg.data || []).map(a => {
        const emp = empresas.find(e => e.id === a.empresa_id);
        return { slug: emp ? emp.slug : '', data: a.data, hora: a.hora };
      });
    }

    (rProfiles.data || []).forEach(p => {
      const emp = empresas.find(e => e.id === p.empresa_id);
      if(emp){ emp.gestorEmail = p.email; emp.gestorStatus = p.status; }
    });
  } else {
    agendamentos = [];
  }

  loaded = true;
}

async function saveEmpresas(){
  const toRow = e => ({
    slug:                  e.slug,
    nome:                  e.nome,
    foto_url:              e.fotoUrl              || null,
    whatsapp:              e.whatsapp              || null,

    bloqueada:             e.bloqueada,
    // Campos de personalização (Fase 2)
    descricao:             e.descricao             || null,
    logo:                  e.logo                  || null,
    cor_principal:         e.corPrincipal          || '#3d1f3a',
    texto_destaque:        e.textoDestaque         || null,
  });

  const novas     = empresas.filter(e => !e.id);
  const existentes = empresas.filter(e =>  e.id);

  if(novas.length > 0){
    const { data, error } = await supabaseClient
      .from('empresas').insert(novas.map(toRow)).select();
    if(error){ console.error('Erro ao criar empresa:', error); return; }
    (data || []).forEach(row => {
      const emp = empresas.find(e => e.slug === row.slug);
      if(emp) emp.id = row.id;
    });
  }

  if(existentes.length > 0){
    const { error } = await supabaseClient
      .from('empresas')
      .upsert(existentes.map(e => ({ id: e.id, ...toRow(e) })), { onConflict: 'id' });
    if(error) console.error('Erro ao atualizar empresa:', error);
  }
}
function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

let currentRoute = { master:null, empresa:null, page:"" };

function getParams(){
  return currentRoute;
}
function slugDoSubdominio(){
  const parts = location.hostname.split('.');
  // helloah.agenplus.com.br → 4 partes, agenplus.com.br → 3 partes
  if(parts.length >= 4 && parts[0] !== 'www') return parts[0];
  // suporte a localhost (ex: helloah.localhost para testes)
  if(parts.length === 2 && parts[1] === 'localhost') return parts[0];
  return null;
}

function goto(params){
  pararPolling();
  currentRoute = { master:null, empresa:null, page:"", ...params };
  const subSlug = slugDoSubdominio();

  if(params.master){
    if(subSlug){
      location.href = 'https://agenplus.com.br/master';
      return;
    }
    history.pushState(currentRoute, '', '/master');
  } else if(params.empresa){
    const slug = params.empresa;
    const path = params.page ? `/${params.page}` : '/';
    if(subSlug !== slug){
      // Usuarios autenticados ficam em agenplus.com.br para preservar sessao
      if(currentProfile?.role === 'master' || currentProfile?.role === 'owner_empresa'){
        const qs = params.page ? `/app.html?empresa=${slug}&page=${params.page}` : `/app.html?empresa=${slug}`;
        history.pushState(currentRoute, '', qs);
      } else {
        location.href = `https://${slug}.agenplus.com.br${path}`;
        return;
      }
    } else {
      history.pushState(currentRoute, '', path);
    }
  } else {
    history.pushState(currentRoute, '', '/');
  }
  route();
}
window.addEventListener('popstate', e => {
  if(e.state){ pararPolling(); currentRoute = e.state; route(); }
});

function defaultEmpresa(){

// IMPORTANTE: usa a data LOCAL, não UTC.
// toISOString() converteria para UTC e, no Brasil (UTC-3), a partir
// das 21h o sistema passaria a considerar que já é o dia seguinte.
function mesKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function horariosDoMes(emp, key){
  const uni  = (emp.horariosPorMes && emp.horariosPorMes['_uni_']) || [];
  const mes  = (key && key !== '_uni_' && emp.horariosPorMes && emp.horariosPorMes[key]) || [];
  return [...new Set([...uni, ...mes])].sort();
}
function isoData(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const root = document.getElementById('root');
function render(html){ root.innerHTML = html; }

function toast(msg, type='info', ms=3200){
  let c = document.getElementById('toast-root');
  if(!c){ c = document.createElement('div'); c.id='toast-root'; document.body.appendChild(c); }
  const el = document.createElement('div');
  el.className = `toast${type==='ok'?' ok':type==='err'?' err':''}`;
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); el.addEventListener('transitionend',()=>el.remove(),{once:true}); }, ms);
}
function friendlyError(err, fallback='Algo deu errado. Tente novamente.'){
  if(!err) return fallback;
  if(err.code==='23505') return 'Esse horário já está reservado. Escolha outro.';
  if(err.code==='42501'||err.code==='PGRST301') return 'Sem permissão para esta ação.';
  if(err.message && err.message.toLowerCase().includes('network')) return 'Sem conexão. Verifique sua internet.';
  return fallback;
}
function fmtTelStr(val){
  if(!val) return '';
  let d = String(val).replace(/\D/g,'');
  if(d.startsWith('55') && d.length > 11) d = d.slice(2);
  if(d.startsWith('0')) d = d.slice(1);
  d = d.slice(0,11);
  if(d.length > 7) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length > 2) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  return d;
}
window.maskTel = (input)=>{
  input.value = fmtTelStr(input.value);
};

let _pollInterval = null;
let _pollFn = null;
function iniciarPolling(fn){
  pararPolling();
  _pollFn = fn;
  _pollInterval = setInterval(async ()=>{
    if(document.hidden) return;
    await loadData();
    if(_pollFn) _pollFn();
  }, 30000);
}
function pararPolling(){
  if(_pollInterval){ clearInterval(_pollInterval); _pollInterval = null; _pollFn = null; }
}

// ---------- INIT ----------
async function init(){
  render(`<div class="loading-wrap"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div><div>Carregando…</div></div>`);

  // Estabelece sessao a partir de tokens no hash (redirect cross-domain)
  const _hp = new URLSearchParams(location.hash.slice(1));
  const _at = _hp.get('access_token'), _rt = _hp.get('refresh_token');
  if(_at && _rt){
    await supabaseClient.auth.setSession({ access_token: _at, refresh_token: _rt });
    history.replaceState(null, '', location.pathname + location.search);
  }

  // Escuta mudanças de auth (inclui PASSWORD_RECOVERY vindo do e-mail)
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Trava a navegação: sem isso, o route() no fim do init()
      // apagaria a tela de redefinição assim que ela aparecesse.
      modoRecuperacao = true;
      currentUser = session?.user || null;
      renderRedefinirSenha();
      return;
    }
    currentUser = session?.user || null;
    if (currentUser) {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      currentProfile = data || null;
    } else {
      currentProfile = null;
    }

    if (event === 'SIGNED_IN' && currentUser && currentProfile && location.pathname !== '/cadastro') {
      await loadData();
      const _goto = localStorage.getItem('ob_goto');
      if (_goto) {
        localStorage.removeItem('ob_goto');
        try {
          goto(JSON.parse(_goto)); return;
        } catch(e){}
      }
      if (currentProfile.role === 'master') {
        goto({ master: 1 });
      } else if (currentProfile.role === 'owner_empresa') {
        const emp = empresas.find(e => e.id === currentProfile.empresa_id);
        if (emp) goto({ empresa: emp.slug, page: 'gestao' });
      }
    }
  });

  // Sessão existente (ex: ao recarregar a página)
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  if (currentUser) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = data || null;
  }

  await loadData();
  if(modoRecuperacao) return;   // não sobrepõe a tela de redefinir senha

  const _obGoto = localStorage.getItem('ob_goto');
  if(_obGoto && currentUser){
    localStorage.removeItem('ob_goto');
    try {
      const t = JSON.parse(_obGoto);
      currentRoute = { master: null, empresa: null, page: '', ...t };
      route(); return;
    } catch(e){}
  }

  const subSlug = slugDoSubdominio();
  const path = location.pathname.replace(/^\/+|\/+$/g, ''); // ex: 'gestao', 'master', 'login', ''

  if(subSlug){
    // Subdomínio: helloah.agenplus.com.br
    currentRoute.empresa = subSlug;
    // _p vem do redirect do index.html quando o rewrite do Vercel não pega
    const _pParam = new URLSearchParams(location.search).get('_p') || '';
    const subPage = _pParam || (path === 'app.html' ? '' : path);
    if(subPage === 'gestao')      currentRoute.page = 'gestao';
    else if(subPage === 'agendar')     currentRoute.page = 'agendar';
    else if(subPage === 'confirmacao') currentRoute.page = 'confirmacao';
    // Limpa /app.html da URL para ficar estetico
    if(path === 'app.html' || _pParam){
      const cleanPath = currentRoute.page ? '/' + currentRoute.page : '/';
      history.replaceState(currentRoute, '', cleanPath);
    }
  } else if(path === 'cadastro'){
    renderCadastro(); return;
  } else if(path === 'master'){
    currentRoute.master = 1;
  } else if(path === 'login'){
    renderLoginUnificado(); return;
  } else {
    const qp = new URLSearchParams(location.search);
    const qEmpresa = qp.get('empresa');
    const qPage = qp.get('page');
    if(qEmpresa && currentUser){
      currentRoute.empresa = qEmpresa;
      if(qPage) currentRoute.page = qPage;
    } else if(currentProfile?.role === 'master'){
      currentRoute.master = 1;
    } else if(currentProfile?.role === 'owner_empresa'){
      const emp = empresas.find(e => e.id === currentProfile.empresa_id);
      if(emp){ goto({ empresa: emp.slug, page: 'gestao' }); return; }
    } else {
      renderLoginUnificado(); return;
    }
  }
  route();
}

function route(){
  const {master, empresa, page} = getParams();
  if(master){
    renderMaster();
  } else if(empresa){
    const emp = empresas.find(e=>e.slug===empresa);
    if(!emp){ renderNotFound(); return; }
    if(page==="agendar") renderAgendar(emp);
    else if(page==="confirmacao") renderConfirmacao(emp);
    else if(page==="gestao"){
      const isMaster = currentProfile?.role === 'master';
      const isOwner  = currentProfile?.role === 'owner_empresa'
                    && currentProfile?.empresa_id === emp.id
                    && currentProfile?.status === 'ativo';
      if(isMaster || isOwner){
        if(emp.bloqueada && !isMaster){
          render(`${barraVoltarMaster()}<div class="container"><div class="empty"><h2 class="display">Empresa bloqueada</h2><p>Esta empresa está bloqueada pelo administrador. Entre em contato para mais informações.</p></div></div>`);
        } else { renderGestao(emp); }
      } else {
        localStorage.setItem('ob_goto', JSON.stringify({ empresa: emp.slug, page: 'gestao' }));
        renderLoginUnificado();
      }
    }
    else renderHome(emp);
  } else {
    renderMaster();
  }
}

function barraVoltarMaster(){
  if(currentProfile?.role !== 'master') return "";
  return `<div style="background:#f0f0f0;color:#1a1a1a;padding:10px 20px;text-align:center;font-size:13px;font-weight:700;">
    Modo visualização (via painel master) — <span style="text-decoration:underline;cursor:pointer;" onclick="goto({master:1})">Voltar ao painel master</span>
  </div>`;
}

function renderNotFound(){
  render(`<div class="container"><div class="empty"><h2 class="display">Empresa não encontrada</h2><p>Verifique o link e tente novamente.</p></div></div>`);
}

function setPageMeta(title, description, imageUrl){
  document.title = title;
  const setMeta = (sel, attr, val) => {
    let el = document.querySelector(sel);
    if(!el){ el = document.createElement('meta'); document.head.appendChild(el); }
    el.setAttribute(attr, val);
  };
  setMeta('meta[name="description"]', 'content', description || '');
  setMeta('meta[property="og:title"]', 'content', title);
  setMeta('meta[property="og:description"]', 'content', description || '');
  if(imageUrl) setMeta('meta[property="og:image"]', 'content', imageUrl);
}

// ---------- AGENDAMENTO (WIZARD) ----------
let bookingState = {};
function renderAgendar(emp){
  applyAccent(emp.corPrincipal);
  if(bookingState._slug !== emp.slug) bookingState = {
    _slug:emp.slug, _step:1, _done:false,
    servicos:[], data:null, hora:null,
    nome:"", telefone:"", telefoneDisplay:"", _telErr:false,
    _calMes: mesKey(new Date())
  };

  function calCells(){
    const [ano,mes] = bookingState._calMes.split('-').map(Number);
    const primeiro  = new Date(ano,mes-1,1);
    const ultimo    = new Date(ano,mes,0);
    const hojeIso   = isoData(new Date());
    const cells     = [];
    for(let i=0;i<primeiro.getDay();i++) cells.push(null);
    const slots = horariosDoMes(emp, bookingState._calMes);
    const temH  = slots.length > 0;
    for(let d=1;d<=ultimo.getDate();d++){
      const dt  = new Date(ano,mes-1,d);
      const iso = isoData(dt);
      const past= iso < hojeIso;
      let livre = false;
      if(temH && !past){
        const agora = new Date();
        livre = slots.some(h=>{
          const taken   = agendamentos.some(a=>a.slug===emp.slug && a.data===iso && a.hora===h);
          const bloq    = (emp.bloqueios||[]).some(b=>b.data===iso && b.hora===h);
          const [hh,mm] = h.split(':').map(Number);
          const passado = iso===hojeIso && (hh*60+mm <= agora.getHours()*60+agora.getMinutes());
          return !taken && !bloq && !passado;
        });
      }
      cells.push({d, iso, past, livre});
    }
    return cells;
  }

  function slotsParaDia(iso){
    const agora   = new Date();
    const hojeIso = isoData(agora);
    return horariosDoMes(emp, iso.slice(0,7)).map(h=>{
      const taken   = agendamentos.some(a=>a.slug===emp.slug && a.data===iso && a.hora===h);
      const bloq    = (emp.bloqueios||[]).some(b=>b.data===iso && b.hora===h);
      const [hh,mm] = h.split(':').map(Number);
      const passado = iso===hojeIso && (hh*60+mm <= agora.getHours()*60+agora.getMinutes());
      return {h, livre: !taken && !bloq && !passado};
    });
  }

  function wizHeader(){
    const acc    = emp.corPrincipal || '#3d1f3a';
    const letras = emp.nome.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const avatarHtml = emp.logo
      ? `<img src="${escapeAttr(emp.logo)}" style="width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="${escapeAttr(emp.nome)}">`
      : `<div style="width:46px;height:46px;border-radius:50%;background:${acc};display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0;">${letras}</div>`;
    const dots = [1,2,3,4].map(i=>{
      const cor = (bookingState._done || i < bookingState._step) ? acc
                : i === bookingState._step ? acc+'80'
                : '#e5e7eb';
      return `<div style="flex:1;height:3px;border-radius:2px;background:${cor};"></div>`;
    }).join('');
    const label = bookingState._done ? '' : `Passo ${bookingState._step} de 3`;
    return `
      ${barraVoltarMaster()}
      <div style="padding:20px 20px 0;background:#fff;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
          ${avatarHtml}
          <div>
            <div style="font-size:16px;font-weight:700;color:#111;">${escapeHtml(emp.nome)}</div>
            <div style="font-size:13px;color:#888;">Agendar horário</div>
          </div>
        </div>
        <div style="display:flex;gap:4px;margin-bottom:6px;">${dots}</div>
        ${label ? `<div style="font-size:12px;color:#888;margin-bottom:20px;">${label}</div>` : '<div style="margin-bottom:20px;"></div>'}
      </div>`;
  }

  function draw(){
    const acc = emp.corPrincipal || '#3d1f3a';
    const hdr = wizHeader();
    if(bookingState._done){ drawDone(hdr, acc); return; }
    if(bookingState._step === 1) drawStep1(hdr, acc);
    else if(bookingState._step === 2) drawStep2(hdr, acc);
    else drawStep3(hdr, acc);
  }

  function drawStep1(hdr, acc){
    const srvHtml = emp.servicos.length
      ? emp.servicos.map(s=>{
          const sel = bookingState.servicos.includes(s.id);
          const check = sel
            ? `<svg width="12" height="12" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 2.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
            : '';
          return `<div onclick="wizToggleSrv('${s.id}')" style="border:1.5px solid ${sel?acc:'#e5e7eb'};border-radius:14px;padding:15px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;background:${sel?acc+'15':'#fff'};">
            <div style="width:24px;height:24px;border-radius:50%;border:1.5px solid ${sel?acc:'#d1d5db'};flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${sel?acc:'transparent'};">${check}</div>
            <div style="font-size:16px;font-weight:600;color:#111;">${escapeHtml(s.nome)}</div>
          </div>`;
        }).join('')
      : `<p style="color:#888;font-size:15px;padding:8px 0;">Em breve — serviços sendo configurados.</p>`;
    const qtd = bookingState.servicos.length;
    render(`<div style="display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;background:#fff;">
      ${hdr}
      <div style="flex:1;padding:0 22px 20px;">
        <div style="font-size:21px;font-weight:700;color:#111;margin-bottom:6px;">Escolha os serviços</div>
        <div style="font-size:15px;color:#888;margin-bottom:18px;">Selecione um ou mais</div>
        ${srvHtml}
      </div>
      <div style="padding:16px 22px 34px;border-top:1px solid #f3f4f6;background:#fff;position:sticky;bottom:0;">
        ${qtd>0?`<div style="font-size:13px;color:#888;margin-bottom:10px;">${qtd} serviço${qtd>1?'s':''} selecionado${qtd>1?'s':''}</div>`:''}
        <button onclick="wizNext()" ${qtd===0?'disabled':''} style="width:100%;height:52px;border-radius:14px;border:none;background:${qtd>0?acc:'#e5e7eb'};color:${qtd>0?'#fff':'#aaa'};font-size:16px;font-weight:600;cursor:${qtd>0?'pointer':'not-allowed'};font-family:inherit;">Continuar</button>
      </div>
    </div>`);
  }

  function drawStep2(hdr, acc){
    const [ano,mes] = bookingState._calMes.split('-').map(Number);
    const nomeMes   = new Date(ano,mes-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const cells     = calCells();
    const CAB       = ['D','S','T','Q','Q','S','S'];
    const cabHtml   = CAB.map(d=>`<div style="text-align:center;font-size:11px;color:#9ca3af;font-weight:600;padding:5px 0;">${d}</div>`).join('');
    const hojeIso   = isoData(new Date());
    const cellsHtml = cells.map(c=>{
      if(!c) return '<div></div>';
      const sel  = bookingState.data===c.iso;
      const hoje = hojeIso===c.iso;
      if(!c.livre) return `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:${hoje?'700':'500'};color:#d1d5db;">${c.d}</div>`;
      return `<div onclick="wizSelDia('${c.iso}')" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:${sel?'#fff':hoje?acc:'#374151'};background:${sel?acc:'transparent'};border-radius:50%;cursor:pointer;">${c.d}</div>`;
    }).join('');
    const prevDate = new Date(ano,mes-2,1);
    const nextDate = new Date(ano,mes,1);
    const prevKey  = mesKey(prevDate);
    const nextKey  = mesKey(nextDate);
    const canPrev  = prevKey >= mesKey(new Date());
    let slotsHtml = '', diaLabel = '';
    if(bookingState.data){
      const dt = new Date(bookingState.data+"T00:00:00");
      diaLabel = dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
      const sl = slotsParaDia(bookingState.data);
      slotsHtml = sl.length

    render(`<div style="display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;background:#fff;">
      ${hdr}

        <div style="width:72px;height:72px;border-radius:50%;background:#f0fdf4;border:2px solid #bbf7d0;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px;color:#22c55e;">&#10003;</div>
        <div style="font-size:23px;font-weight:700;color:#111;margin-bottom:8px;">Agendamento confirmado</div>
        <div style="font-size:15px;color:#888;line-height:1.6;margin-bottom:26px;max-width:260px;">Seu horário foi reservado com sucesso! Clique em enviar confirmação.</div>
        <div style="background:${acc}12;border:1px solid ${acc}40;border-radius:14px;padding:18px;width:100%;text-align:left;margin-bottom:20px;">
          <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;"><span style="font-size:13px;color:#9ca3af;width:68px;flex-shrink:0;">Serviços</span><span style="font-size:15px;font-weight:600;color:#111;">${escapeHtml(srvNomes.join(', '))}</span></div>
          <div style="display:flex;gap:10px;margin-bottom:10px;"><span style="font-size:13px;color:#9ca3af;width:68px;flex-shrink:0;">Data</span><span style="font-size:15px;font-weight:600;color:#111;text-transform:capitalize;">${dataFmt}</span></div>
          <div style="display:flex;gap:10px;"><span style="font-size:13px;color:#9ca3af;width:68px;flex-shrink:0;">Horário</span><span style="font-size:15px;font-weight:600;color:#111;">${b.hora}</span></div>
        </div>
        ${emp.whatsapp ? `<a href="${waLink}" target="_blank" rel="noopener noreferrer" style="display:block;width:100%;margin-bottom:14px;text-decoration:none;"><button style="width:100%;height:52px;border-radius:14px;border:1.5px solid #25d366;background:#fff;color:#1a7d40;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;">${waIcon}Enviar confirmação</button></a>` : ''}

  window.wizToggleSrv = (id)=>{
    const i = bookingState.servicos.indexOf(id);
    if(i>=0) bookingState.servicos.splice(i,1);
    else bookingState.servicos.push(id);
    draw();
  };
  window.wizNext    = ()=>{ bookingState._step = Math.min(3, bookingState._step+1); draw(); };
  window.wizBack    = ()=>{ bookingState._step = Math.max(1, bookingState._step-1); draw(); };
  window.wizSelDia  = (iso)=>{ bookingState.data=iso; bookingState.hora=null; draw(); };
  window.wizSelHora = (h)=>{ bookingState.hora=h; draw(); };
  window.wizCalMes  = (key)=>{ bookingState._calMes=key; draw(); };
  window.wizAtualizaBtn = ()=>{
    const btn = document.getElementById('btnAgendar');
    if(!btn) return;
    const digits = bookingState.telefone.replace(/\D/g,'');
    const telOk  = digits.length===12 && digits[0]==='0' && digits[3]==='9';
    const nomeOk = (document.getElementById('inpNome')?.value||'').trim().length>0;
    const ok = nomeOk && telOk;
    btn.disabled = !ok;
    btn.style.background = ok ? (emp.corPrincipal||'#3d1f3a') : '#e5e7eb';
    btn.style.color      = ok ? '#fff' : '#aaa';
    btn.style.cursor     = ok ? 'pointer' : 'not-allowed';
  };
  window.wizFormatTel = (input)=>{
    let d = input.value.replace(/\D/g,'');
    if(d.startsWith('55') && d.length>11) d=d.slice(2);
    if(d.startsWith('0')) d=d.slice(1);
    d = d.slice(0,11);
    let display = d;
    if(d.length>7) display=`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    else if(d.length>2) display=`(${d.slice(0,2)}) ${d.slice(2)}`;
    input.value = display;
    const norm = d.length>0 ? '0'+d : '';
    bookingState.telefone        = norm;
    bookingState.telefoneDisplay = display;
    const valido = norm.length===12 && norm[0]==='0' && norm[3]==='9';
    const erro   = d.length>0 && !valido;
    bookingState._telErr = erro;
    const errEl = document.getElementById('telError');
    if(errEl) errEl.style.display = erro?'flex':'none';
    window.wizAtualizaBtn();
  };
  window.wizSubmit = async (slug)=>{
    const btn = document.getElementById('btnAgendar');
    if(btn && btn.disabled) return;
    if(btn){ btn.disabled=true; btn.innerHTML='<span style="opacity:.6">Agendando…</span>'; }
    const nomeInp = document.getElementById('inpNome');
    const telInp  = document.getElementById('inpTel');
    bookingState.nome = nomeInp ? nomeInp.value : bookingState.nome;
    if(telInp){
      let _d = telInp.value.replace(/\D/g,'');
      if(_d.startsWith('55')&&_d.length>11) _d=_d.slice(2);
      if(_d.startsWith('0')) _d=_d.slice(1);
      bookingState.telefone = _d.length?'0'+_d:'';
    }
    const _digits = bookingState.telefone.replace(/\D/g,'');
    const _telOk  = _digits.length===12 && _digits[0]==='0' && _digits[3]==='9';
    if(!bookingState.servicos.length || !bookingState.data || !bookingState.hora || !bookingState.nome.trim() || !_telOk){
      if(btn){ btn.disabled=false; btn.innerHTML='Confirmar'; } return;
    }
    const emp2 = empresas.find(e=>e.slug===slug);
    const jaOcupado = agendamentos.some(a=>a.slug===slug && a.data===bookingState.data && a.hora===bookingState.hora)
      || (emp2?.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===bookingState.hora);
    if(jaOcupado){
      toast('Esse horário foi reservado ou bloqueado. Escolha outro.','err');
      if(btn){ btn.disabled=false; btn.innerHTML='Confirmar'; }
      bookingState._step=2; draw(); return;
    }
    const primeiroServico = emp2.servicos.find(s=>s.id===bookingState.servicos[0]);
    const { error } = await supabaseClient.from('agendamentos').insert({
      empresa_id:    emp2.id,
      servico_id:    primeiroServico ? primeiroServico.id   : null,
      servico_nome:  primeiroServico ? primeiroServico.nome : '',
      servicos_json: JSON.stringify(bookingState.servicos),
      data:          bookingState.data,
      hora:          bookingState.hora,
      nome_cliente:  bookingState.nome.trim(),
      telefone:      bookingState.telefone.trim()
    });
    if(error){
      if(btn){ btn.disabled=false; btn.innerHTML='Confirmar'; }
      toast(friendlyError(error,'Erro ao realizar agendamento. Tente novamente.'),'err');
      if(error.code==='23505') draw();
      return;
    }
    const srvNomes = bookingState.servicos.map(id=>{ const s=emp2.servicos.find(x=>x.id===id); return s?s.nome:''; }).filter(Boolean);
    const novo = {
      slug,
      servicoId:    primeiroServico?.id   || null,
      servicoNome:  primeiroServico?.nome || '',
      servicosNomes: srvNomes,
      data:         bookingState.data,
      hora:         bookingState.hora,
      nome:         bookingState.nome.trim(),
      telefone:     bookingState.telefone.trim()
    };
    agendamentos.push({...novo});
    lastBooking = novo;
    bookingState._done = true;
    draw();
  };
  draw();
}

window.recuperarSenha = async (slug)=>{
  const email = prompt("Digite seu e-mail para receber o link de redefinição de senha:");
  if(!email) return;
  const base = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? location.origin
    : 'https://saas-agendamento-seven.vercel.app';

  let _waMenuId = null; // id do agendamento com dropdown WA aberto
  let personalizarDirty = false;
  let mesHorario = mesKey(new Date());
  let novoBotaoState = null;
  let editandoBotaoId = null;
  let _removendoServicoIdx = null;
  let _linkMenuAberto = false;
  let _editandoServicoIdx = null;
  let _novoServicoForm = false;

  // Estado do financeiro (gestão)
  let _gFinPeriodo = 'dia'; // 'dia' | 'mes'
