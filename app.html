<body>
<main id="root"></main>

<!-- Modal de recorte de imagem (fora do #root para não ser destruído na navegação) -->
<div id="cropModal" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;overflow:hidden;max-width:480px;width:100%;display:flex;flex-direction:column;max-height:90vh;">
    <div style="padding:14px 20px;border-bottom:1px solid #e6e1ea;font-weight:700;font-size:16px;flex-shrink:0;">Ajuste a imagem</div>
    <div style="background:#111;overflow:hidden;flex:1;min-height:260px;"><img id="cropImg" src="" alt="" style="display:block;max-width:100%;"/></div>
    <div style="padding:14px 16px;display:flex;gap:12px;flex-shrink:0;">
      <button onclick="cancelarCrop()" style="flex:1;background:transparent;color:#1a1a1a;border:1.5px solid #e0e0e0;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Cancelar</button>
      <button id="btnConfirmarCrop" onclick="confirmarCrop()" style="flex:1;background:#1a1a1a;color:#fff;border:none;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Confirmar recorte</button>
    </div>
  </div>
</div>
