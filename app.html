        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
          <button class="btn ghost" onclick="masterSalvarEdicao()">Salvar</button>
          <button class="btn ghost" onclick="masterToggleBloqueio()">${editing.bloqueada?'Desbloquear':'Bloquear'}</button>
          <button class="btn ghost" onclick="masterRedefinirSenha()">Redefinir senha</button>
          <button class="btn danger" onclick="masterExcluir('${editing.slug}')">Excluir empresa</button>
        </div>
      </div>
    ` : masterShowForm ? `
      <div class="card" style="margin-bottom:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <h3 class="display" style="margin:0;">Nova empresa</h3>
          <button class="icon-btn" style="font-size:22px;color:var(--ink-soft);" onclick="masterShowForm=false; drawMaster();">×</button>
        </div>
        <div class="field"><label>Nome da empresa</label><input id="novoNome" placeholder="Ex: Studio Bella"/></div>
        <div class="field"><label>WhatsApp</label><input id="novoWhats" type="tel" inputmode="numeric" maxlength="16" placeholder="(xx) xxxxx-xxxx" oninput="maskTel(this)"/></div>
        <div class="field"><label>E-mail do gestor</label><input type="email" id="novoEmail" placeholder="gestor@email.com"/></div>
        <div class="field"><label>Senha temporária</label><input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres"/></div>
        <button class="btn" style="width:100%;" onclick="masterCriar()">Criar empresa</button>
      </div>
    ` : '';

    const listaFiltrada = masterSearch
      ? empresas.filter(e => e.nome.toLowerCase().includes(masterSearch.toLowerCase()))
      : empresas;

    const lista = listaFiltrada.length ? `<div style="display:flex;flex-direction:column;gap:10px;">${listaFiltrada.map(e=>{
      const link = location.origin + '/' + e.slug;
      return `
      <div style="background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;">
          <div style="min-width:0;flex:1;">
            <div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;">${escapeHtml(e.nome)}</div>
            <div style="font-size:12px;color:var(--ink-soft);word-break:break-all;">${escapeHtml(link)}</div>
          </div>
          <span class="chip ${e.bloqueada?'blocked':'ok'}" style="flex-shrink:0;">${e.bloqueada?'Bloqueada':'Ativa'}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="goto({empresa:'${e.slug}'})">Visualizar</button>
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="goto({empresa:'${e.slug}', page:'gestao'})">Ver gestão</button>
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="navigator.clipboard.writeText('${escapeAttr(link)}').then(()=>toast('Link copiado!','ok'))">Copiar link</button>
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="masterEditarEmpresa('${e.slug}')">Editar</button>
        </div>
      </div>`;
    }).join('')}</div>` : `<p class="muted">${masterSearch ? 'Nenhuma empresa encontrada.' : 'Nenhuma empresa cadastrada ainda.'}</p>`;

    drawMasterShell(`
      ${form}
      <div class="card">
        ${!editing ? `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
            <div>
              <h3 class="display" style="margin:0;">Empresas cadastradas</h3>
              <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">${empresas.length} ${empresas.length === 1 ? 'empresa' : 'empresas'}</div>
            </div>
            ${!masterShowForm ? `<button class="btn" style="white-space:nowrap;" onclick="masterShowForm=true; drawMaster();">+ Cadastrar nova empresa</button>` : ''}
          </div>
          <div class="field" style="margin-bottom:20px;">
            <input placeholder="Buscar empresa..." value="${escapeAttr(masterSearch)}" oninput="masterSearch=this.value; drawMaster()" style="background:#f5f5f5;border-color:#e0e0e0;"/>
          </div>
          ${lista}
        ` : lista}
      </div>
    `);
  }

  function drawFinanceiro(){
    const hoje = new Date();
    const mesAtual = hoje.toLocaleString('pt-BR',{month:'long', year:'numeric'}).replace(' De ', ' de ');

    const formFin = _finForm ? `
      <div class="card" style="margin-bottom:20px;">
        <h3 class="display" style="margin:0 0 16px;">${_finForm.mode==='configurar'?'Configurar plano':'Editar plano'}</h3>
        <div class="field"><label>Valor mensal (R$)</label><input type="number" id="finFormValor" value="${_finForm.valor||''}" min="0" step="0.01" placeholder="Ex: 99.90"/></div>
        <div class="field"><label>Dia de vencimento (1 a 28)</label><input type="number" id="finFormDia" value="${_finForm.dia||''}" min="1" max="28" placeholder="Ex: 10"/></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
          <button class="btn ghost" onclick="finCancelarForm()">Cancelar</button>
          <button class="btn" onclick="finSalvarForm()">Salvar</button>
        </div>
      </div>
    ` : '';

    const rows = empresas.map(e => {
      const reg = financeiroData.find(f=>f.empresa_id===e.id);
      return { e, reg };
    });

    const filtroFin = _filtroFin;
    const filtrados = rows.filter(({reg}) => {
      if(filtroFin === 'todos') return true;
      if(!reg) return filtroFin === 'sem-dados';
      const info = finStatusInfo(reg);
      if(filtroFin === 'pagos') return info.label === 'Pago';
      if(filtroFin === 'vencidos') return info.label === 'Vencido';
      if(filtroFin === 'a-vencer') return info.label.startsWith('Vence');
      return true;
    });

    const tabBtns = ['todos','pagos','vencidos','a-vencer'].map(f => `
      <button onclick="_filtroFin='${f}'; drawMaster();"
        style="padding:6px 14px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;cursor:pointer;
        background:${filtroFin===f?'#1c1917':'var(--paper)'};color:${filtroFin===f?'#fff':'var(--ink)'};">
        ${{todos:'Todos',pagos:'Pagos',vencidos:'Vencidos','a-vencer':'A vencer'}[f]}
      </button>
    `).join('');

    const listaFin = filtrados.length ? filtrados.map(({e, reg}) => {
      const info = finStatusInfo(reg);
      const valor = reg ? parseFloat(reg.valor||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '—';
      const diaVenc = reg ? `Dia ${reg.dia_vencimento}` : '—';
      const pagoEm = reg?.pago_em ? new Date(reg.pago_em).toLocaleDateString('pt-BR') : null;
      const podeMarcar = reg && info.label !== 'Pago';
      return `
        <div style="background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
            <div>
              <div style="font-size:15px;font-weight:700;color:var(--ink);">${escapeHtml(e.nome)}</div>
              <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">Vencimento: ${diaVenc} · ${valor}/mês</div>
              ${pagoEm ? `<div style="font-size:12px;color:#2e7d32;margin-top:2px;">Pago em ${pagoEm}</div>` : ''}
            </div>
            <span class="fin-status" style="color:${info.cor};background:${info.bg};flex-shrink:0;">${info.label}</span>
          </div>
          <div style="display:grid;grid-template-columns:${reg?'1fr 1fr':'1fr'};gap:8px;">
            ${!reg ? `<button class="btn" style="font-size:13px;height:40px;" onclick="finConfigurar('${e.id}')">Configurar plano</button>` : `
              ${podeMarcar ? `<button class="btn" style="font-size:13px;height:40px;background:#2e7d32;border-color:#2e7d32;" onclick="finMarcarPago('${reg.id}')">✓ Marcar como pago</button>` : `<button class="btn ghost" style="font-size:13px;height:40px;" disabled>Pago ✓</button>`}
              <button class="btn ghost" style="font-size:13px;height:40px;" onclick="finEditar('${e.id}','${reg.id}',${reg.valor},${reg.dia_vencimento})">Editar plano</button>
            `}
          </div>
        </div>
      `;
    }).join('') : `<p class="muted">Nenhuma empresa nesta categoria.</p>`;

    drawMasterShell(`
      ${formFin}
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div>
          <h2 class="display" style="margin:0;">Financeiro</h2>
          <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;text-transform:capitalize;">${mesAtual}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">${tabBtns}</div>
      <div style="display:flex;flex-direction:column;gap:10px;">${listaFin}</div>
    `);
  }

  window.drawMaster = draw;
  window.masterIrAba = (aba) => { masterAba = aba; draw(); };

  window.finConfigurar = (empresaId) => {
    _finForm = { mode:'configurar', empresaId, regId:null, valor:'', dia:'' };
    draw();
  };

  window.finEditar = (empresaId, regId, valorAtual, diaAtual) => {
    _finForm = { mode:'editar', empresaId, regId, valor:valorAtual, dia:diaAtual };
    draw();
  };

  window.finCancelarForm = () => { _finForm = null; draw(); };

  window.finSalvarForm = async () => {
    const valorEl = document.getElementById('finFormValor');
    const diaEl   = document.getElementById('finFormDia');
    const valor = parseFloat(valorEl?.value) || 0;
    const diaNum = parseInt(diaEl?.value);
    if(isNaN(diaNum) || diaNum < 1 || diaNum > 28){ toast('Dia inválido. Use um número entre 1 e 28.','err'); return; }
    const form = _finForm;
    _finForm = null;
    if(form.mode === 'configurar'){
      const { error } = await supabaseClient.from('financeiro').insert({ empresa_id: form.empresaId, valor, dia_vencimento: diaNum });
      if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    } else {
      const { error } = await supabaseClient.from('financeiro').update({ valor, dia_vencimento: diaNum, updated_at: new Date().toISOString() }).eq('id', form.regId);
      if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    }
    await carregarFinanceiro();
    draw();
  };

  window.finMarcarPago = (regId) => {
    if(!confirm("Confirmar pagamento recebido?")) return;
    const _d = new Date();
    const hoje = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
    supabaseClient.from('financeiro').update({ pago_em: hoje, updated_at: new Date().toISOString() }).eq('id', regId)
      .then(async ({ error }) => {
        if(error){ toast('Erro ao registrar pagamento.','err'); return; }
        await carregarFinanceiro();
        draw();
      });
  };

  window.masterCriar = async ()=>{
    const nome  = document.getElementById('novoNome').value.trim();
    const email = document.getElementById('novoEmail').value.trim();
    const senha = document.getElementById('novaSenha').value;
    if(!nome){ toast('Digite o nome da empresa.','err'); return; }
    if(!email){ toast('Digite o e-mail do gestor.','err'); return; }
    if(senha.length < 6){ toast('A senha deve ter pelo menos 6 caracteres.','err'); return; }

    // 1. Cria a empresa no banco
    const SLUGS_RESERVADOS = ['api','app','admin','master','login','logout','static','assets','sw','manifest','index','null','undefined','favicon'];
    let slug = slugify(nome);
    if(SLUGS_RESERVADOS.includes(slug)){ toast(`O nome "${nome}" é reservado pelo sistema. Use um nome diferente.`,'err'); return; }
    let s2 = slug, n=1;
    while(empresas.some(e=>e.slug===s2)){ s2 = slug+"-"+(++n); }
    const nova = defaultEmpresa();
    nova.slug = s2; nova.nome = nome;
    nova.whatsapp = document.getElementById('novoWhats').value.trim();
    empresas.push(nova);
    await saveEmpresas();

    const empCriada = empresas.find(e=>e.slug===s2);
    if(!empCriada?.id){
      empresas = empresas.filter(e=>e.slug!==s2);
      toast('Não foi possível criar a empresa. Verifique sua conexão e tente novamente.','err',6000);
      masterShowForm = false; draw(); return;
    }

    // 2. Cria o usuário gestor via API segura
    const { data: { session } } = await supabaseClient.auth.getSession();
    let apiOk = false;
    try {
      const resp = await fetch('/api/create-user', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token
        },
        body: JSON.stringify({ email, password: senha, nome, empresa_id: empCriada.id })
      });
      if(!resp.ok){
        const err = await resp.json();
        toast('Empresa criada, mas erro ao criar usuário: ' + (err.error || 'Erro desconhecido') + '. Crie manualmente no Supabase.','err',8000);
      } else {
        apiOk = true;
      }
    } catch(e) {
      toast('Empresa criada, mas não foi possível contatar a API. Crie o usuário manualmente no Supabase.','err',8000);
    }

    masterShowForm = false;
    if(apiOk){
      toast(`"${nome}" criada! Gestor: ${email}. Compartilhe a senha por canal seguro.`,'ok',8000);
    }
    draw();
  };
  window.masterEditarEmpresa = async (slug) => {
    editingSlug = slug;
    draw();
    const emp = empresas.find(e => e.slug === slug);
    if(emp && !emp.gestorEmail){
      const { data } = await supabaseClient.from('profiles').select('email').eq('empresa_id', emp.id).eq('role','owner_empresa').single();
      if(data?.email){ emp.gestorEmail = data.email; draw(); }
    }
  };
  window.masterSalvarEdicao = ()=>{
    editingSlug = null; draw();
  };
  window.masterUpd = async (field,val)=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e[field] = val; await saveEmpresas();
  };
  window.masterToggleBloqueio = async ()=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e.bloqueada = !e.bloqueada; await saveEmpresas(); draw();
  };
  window.masterExcluir = async (slug)=>{
    const e = empresas.find(x=>x.slug===slug);
    if(!confirm(`Excluir "${e.nome}" definitivamente? Isso também apaga os agendamentos dela. Essa ação não pode ser desfeita.`)) return;
    if(e.id){
      // Remove o auth user do gestor via API (service role)
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        await fetch('/api/delete-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session?.access_token },
          body: JSON.stringify({ empresa_id: e.id })
        });
      } catch(_){}
      const { error } = await supabaseClient.from('empresas').delete().eq('id', e.id);
      if(error){ toast(friendlyError(error,'Erro ao excluir empresa. Tente novamente.'),'err'); return; }
    }
    empresas = empresas.filter(x=>x.slug!==slug);
    agendamentos = agendamentos.filter(a=>a.slug!==slug);
    await excluirImagensEmpresa(slug);
    editingSlug = null;
    draw();
  };
  carregarFinanceiro().then(draw);
  iniciarPolling(()=>{ if(!editingSlug) carregarFinanceiro().then(()=>{ if(!editingSlug) draw(); }); });
}

function _limparEstado(){
  empresas = []; agendamentos = []; loaded = false;
  editingSlug = null; masterSearch = ''; masterAba = 'dashboard';
  financeiroData = []; _finForm = null; _filtroFin = 'todos';
  // gestão financeiro — resetado pelo closure de gestaoApp, mas zeramos referências globais por segurança
}
window.masterLogout = async ()=>{
  pararPolling();
  await supabaseClient.auth.signOut();
  currentUser = null; currentProfile = null;
  _limparEstado();
  renderMasterLogin();
};
window.gestaoLogout = async (slug)=>{
  pararPolling();
  await supabaseClient.auth.signOut();
  currentUser = null; currentProfile = null;
  _limparEstado();
  await loadData();
  goto({empresa: slug});
};
window.masterRedefinirSenha = async ()=>{
  const email = prompt("Digite o e-mail do gestor para enviar a redefinição de senha:");
  if(!email) return;
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/app.html' });
  if(error){ toast('Erro ao enviar. Tente novamente.','err'); return; }
  toast('E-mail de redefinição enviado para ' + email,'ok',5000);
};

// ── UPLOAD DE IMAGENS ────────────────────────────────────────
let _cropInstance = null;
let _cropCallback = null;
let _cropTipo = null;
let _cropSlug = null;

function validarArquivo(file){
  const tipos = ['image/jpeg','image/png','image/webp'];
  if(!tipos.includes(file.type)) return 'Formato inválido. Use JPG, PNG ou WEBP.';
  if(file.size > 5 * 1024 * 1024) return 'Arquivo muito grande. Máximo 5 MB.';
  return null;
}

function abrirCrop(tipo, slug, callback){
  _cropTipo = tipo; _cropSlug = slug; _cropCallback = callback;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/jpeg,image/png,image/webp';
  input.onchange = (ev)=>{
    const file = ev.target.files[0]; if(!file) return;
    const err = validarArquivo(file); if(err){ toast(err,'err'); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const modal = document.getElementById('cropModal');
      const img   = document.getElementById('cropImg');
      img.src = e.target.result;
      modal.style.display = 'flex';
      if(_cropInstance){ _cropInstance.destroy(); _cropInstance = null; }
      const ratio = tipo==='logo' ? 1 : 16/9;
      _cropInstance = new Cropper(img, { aspectRatio: ratio, viewMode: 1, autoCropArea: 0.9, movable: true, zoomable: true, rotatable: false, scalable: false });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function confirmarCrop(){
  if(!_cropInstance) return;
  const btn = document.getElementById('btnConfirmarCrop');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const isLogo = _cropTipo === 'logo';
  const w = isLogo ? 540 : 1280, h = isLogo ? 540 : 720;
  const canvas = _cropInstance.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' });
  canvas.toBlob(async (blob)=>{
    const bucket = isLogo ? 'logos' : 'backgrounds';
    const path   = `${_cropSlug}/${isLogo ? 'logo' : 'background'}.jpg`;
    const { error: upErr } = await supabaseClient.storage.from(bucket).upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if(upErr){ toast('Erro ao enviar imagem. Tente novamente.','err'); btn.disabled=false; btn.textContent='Confirmar recorte'; return; }
    const { data } = supabaseClient.storage.from(bucket).getPublicUrl(path);
    const url = data.publicUrl + '?t=' + Date.now();
    const col = isLogo ? 'logo' : 'foto_url';
    const emp = empresas.find(x=>x.slug===_cropSlug);
    if(emp && emp.id){
      await supabaseClient.from('empresas').update({ [col]: url }).eq('id', emp.id);
    }
    const cb = _cropCallback;
    fecharCrop();
    if(cb) cb(url);
  }, 'image/jpeg', 0.92);
}

function cancelarCrop(){ fecharCrop(); }

function fecharCrop(){
  document.getElementById('cropModal').style.display = 'none';
  if(_cropInstance){ _cropInstance.destroy(); _cropInstance = null; }
  const btn = document.getElementById('btnConfirmarCrop');
  btn.disabled = false; btn.textContent = 'Confirmar recorte';
  _cropCallback = null; _cropTipo = null; _cropSlug = null;
}

async function excluirImagensEmpresa(slug){
  await supabaseClient.storage.from('logos').remove([`${slug}/logo.jpg`]);
  await supabaseClient.storage.from('backgrounds').remove([`${slug}/background.jpg`]);
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function sanitizeCor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : '#3d1f3a'; }

// Bloqueia links do tipo "javascript:" salvos nos botões da empresa,
// que executariam código na página pública.
function linkSeguro(url){
  const u = String(url||"").trim();
  return /^(https?:|tel:|mailto:)/i.test(u) ? u : '#';
}
function checkCapsLock(e, id){ const el=document.getElementById(id); if(el) el.style.display=e.getModifierState('CapsLock')?'flex':'none'; }
function applyAccent(cor){ document.documentElement.style.setProperty('--accent', cor || '#3d1f3a'); }
