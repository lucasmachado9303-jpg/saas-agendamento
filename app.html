<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3d1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda+">
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#555555;
    --paper:#f5f5f5;
    --card:#ffffff;
    --line:#e0e0e0;
    --accent:#1a1a1a;
    --danger:#a3423a;
    --ok:#3f6b4f;
    --radius:14px;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Nunito',sans-serif;font-weight:700;letter-spacing:-0.02em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:14px 26px;border-radius:999px;
    font-size:15px;font-weight:600;letter-spacing:.02em;transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(0.88);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line);filter:none;}
  .btn.ghost:hover{border-color:var(--accent);filter:none;}
  .btn.danger{background:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  input,select,textarea{
    font-family:'Nunito',sans-serif;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;width:100%;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:#1a1a1a;}
  label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
  .field{margin-bottom:18px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;}
  .container{max-width:520px;margin:0 auto;padding:32px 20px 80px;}
  .container.wide{max-width:960px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a;font-weight:700;margin-bottom:8px;}
  .top-plum{background:var(--accent);color:#fff;}
  .top-plum .eyebrow{color:rgba(255,255,255,0.7);}
  .muted{color:var(--ink-soft);}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
  }
  .chip.ok{background:#e3ede6;color:var(--ok);}
  .chip.blocked{background:#f3e2e0;color:var(--danger);}
  .service-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;transition:.15s;
  }
  .service-opt:hover{border-color:#1a1a1a;}
  .service-opt.selected{border-color:var(--accent);background:#f5f5f5;box-shadow:inset 0 0 0 1px var(--accent);}
  .slot{
    padding:10px 6px;text-align:center;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;
  }
  .slot.free{cursor:pointer;}
  .slot.free:hover{border-color:#1a1a1a;}
  .slot.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .slot.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed;}
  .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
  .hero{
    position:relative;min-height:100vh;display:flex;align-items:flex-end;background-size:cover;background-position:center;
  }
  .hero::before{
    content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 90%);
  }
  .hero-content{position:relative;z-index:1;padding:48px 28px 64px;color:#fff;width:100%;max-width:640px;margin:0 auto;text-align:center;}
  .hero-content h1{font-size:clamp(32px,7vw,52px);margin:0 0 10px;}
  .hero-content p{font-size:16px;opacity:.9;margin:0 0 28px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;}
  .topbar .brand{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-toggle{
    padding:10px;border-radius:10px;border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:13px;cursor:pointer;background:#fff;
  }
  .day-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:24px;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;text-decoration:underline;padding:0;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);}

  /* ── SPINNER ────────────────────────────────────────────── */
  @keyframes _spin{to{transform:rotate(360deg);}}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:_spin .7s linear infinite;vertical-align:middle;}
  .spinner-dark{border-color:rgba(0,0,0,0.12);border-top-color:#1a1a1a;}
  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--ink-soft);}

  /* ── TOAST ──────────────────────────────────────────────── */
  #toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(340px,90vw);}
  .toast{background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:auto;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.25);}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.ok{background:#2d5a3d;}
  .toast.err{background:#a3423a;}

  /* ── MOBILE FOUNDATION ─────────────────────────────────── */
  html { -webkit-text-size-adjust:100%; }
  body { -webkit-font-smoothing:antialiased; }

  /* Inputs com 16px evitam zoom automático no iOS */
  input,select,textarea { font-size:16px !important; min-height:48px; }

  /* Botões com área de toque mínima */
  .btn { min-height:48px; display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

  /* Slots maiores para toque */
  .slot { min-height:52px; display:flex; align-items:center; justify-content:center; }

  /* Serviço com área maior */
  .service-opt { min-height:56px; }

  /* Tabs com scroll horizontal sem barra */
  .tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:6px;
          scrollbar-width:none; -ms-overflow-style:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { white-space:nowrap; flex-shrink:0; min-height:40px;
         display:inline-flex; align-items:center; justify-content:center; }

  @media (max-width:600px){
    /* Containers com safe-area para notch e barra do iOS */
    .container {
      padding: 20px 16px calc(80px + env(safe-area-inset-bottom, 0px));
    }
    .container.wide {
      padding: 24px 16px calc(80px + env(safe-area-inset-bottom, 0px));
      max-width: 100%;
    }

    /* Cards com menos padding lateral */
    .card { padding:20px 16px; border-radius:12px; }

    /* Topbar compacta */
    .topbar { padding:12px 16px; }
    .topbar .brand { font-size:17px; }

    /* Botões menores lateralmente mas mantendo altura */
    .btn { padding:12px 18px; font-size:14px; }

    /* Slots grid com colunas menores */
    .slots-grid { grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; }

    /* Hero com safe-area no fundo */
    .hero-content {
      padding: 32px 20px calc(56px + env(safe-area-inset-bottom, 0px));
    }
    .hero-content h1 { font-size:clamp(28px,8vw,42px); }

    /* Rows empilham no mobile */
    .row { flex-direction:column; gap:10px; }

    /* List-item com wrap para ações */
    .list-item { padding:14px 0; align-items:flex-start; flex-wrap:wrap; gap:8px; }
    .list-item > div:first-child { flex:1 1 100%; }

    /* Chip menor */
    .chip { font-size:11px; padding:4px 10px; }

    /* Topbar top-plum com safe-area no topo */
    .top-plum { padding-top:env(safe-area-inset-top, 0px); }

    /* Barra de aviso master */
    div[style*="background:#f0f0f0"] { padding:10px 16px; font-size:12px; }

    /* Eyebrow menor */
    .eyebrow { font-size:11px; }

    /* Field sem margin extra quando dentro de row — gap cuida do espaço */
    .row .field { margin-bottom:0; }

    /* Botão de dias de agendamento */
    .dias-scroll {
      display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;
      scrollbar-width:none; -ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;
    }
    .dias-scroll::-webkit-scrollbar { display:none; }
    .dias-scroll .btn { flex-shrink:0; min-width:56px; padding:10px 8px; font-size:13px; }
  }

  @media (min-width:601px){
    .dias-scroll { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .dias-scroll .btn { flex:1; padding:10px 8px; font-size:13px; min-width:0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Modal de recorte de imagem (fora do #root para não ser destruído na navegação) -->
<div id="cropModal" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;overflow:hidden;max-width:480px;width:100%;display:flex;flex-direction:column;max-height:90vh;">
    <div style="padding:14px 20px;border-bottom:1px solid #e6e1ea;font-weight:700;font-size:16px;flex-shrink:0;">Ajuste a imagem</div>
    <div style="background:#111;overflow:hidden;flex:1;min-height:260px;"><img id="cropImg" src="" style="display:block;max-width:100%;"/></div>
    <div style="padding:14px 16px;display:flex;gap:12px;flex-shrink:0;">
      <button onclick="cancelarCrop()" style="flex:1;background:transparent;color:#1a1a1a;border:1.5px solid #e0e0e0;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Cancelar</button>
      <button id="btnConfirmarCrop" onclick="confirmarCrop()" style="flex:1;background:#1a1a1a;color:#fff;border:none;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Confirmar recorte</button>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script>
let currentUser      = null;
let currentProfile   = null;
let modoRecuperacao  = false;   // true quando o usuário chega pelo link de redefinir senha

// Ícones padrão por tipo de botão
const ICONE_POR_TIPO = {
  whatsapp: '', instagram: '', telefone: '',
  maps: '', site: '', link: ''
};
const LABEL_POR_TIPO = {
  whatsapp: 'WhatsApp', instagram: 'Instagram',
  maps: 'Google Maps', site: 'Site'
};

let empresas = [];
let agendamentos = [];
let loaded = false;

// ── PWA ──────────────────────────────────────────────────────
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
function mostrarBannerPWA(){
  if(document.getElementById('pwa-banner')) return;
  if(!_pwaPrompt || sessionStorage.getItem('pwa-banner-dismissed')) return;
  const banner = document.createElement('div');
  banner.id = 'pwa-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9998;background:#1a1a1a;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.2);';
  banner.innerHTML = `
    <div style="flex:1;font-size:14px;font-weight:600;line-height:1.3;">Instale o Agenda+ no seu aparelho para acesso rápido</div>
    <button onclick="instalarPWA()" style="background:#fff;color:#1a1a1a;border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;">Instalar</button>
    <button onclick="dispensarPWA()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:0 4px;line-height:1;">×</button>
  `;
  document.body.appendChild(banner);
}
window.instalarPWA = async ()=>{
  if(!_pwaPrompt) return;
  _pwaPrompt.prompt();
  const { outcome } = await _pwaPrompt.userChoice;
  if(outcome === 'accepted') _pwaPrompt = null;
  dispensarPWA();
};
window.dispensarPWA = ()=>{
  sessionStorage.setItem('pwa-banner-dismissed','1');
  const b = document.getElementById('pwa-banner');
  if(b) b.remove();
};
// ─────────────────────────────────────────────────────────────

async function loadData(){
  try{
    const { data, error } = await supabaseClient.from('empresas').select('*');
    if(error) throw error;
    empresas = (data || []).map(e => ({
      id:                   e.id,
      slug:                 e.slug,
      nome:                 e.nome,
      fotoUrl:              e.foto_url              || '',
      whatsapp:             e.whatsapp              || '',

      bloqueada:            e.bloqueada,
      // Campos de personalização (Fase 2)
      descricao:            e.descricao             || '',
      logo:                 e.logo                  || '',
      corPrincipal:         sanitizeCor(e.cor_principal || '#3d1f3a'),
      textoDestaque:        e.texto_destaque        || '',
      // Relações
      servicos:             [],
      horariosPorMes:       {},
      bloqueios:            [],
      botoes:               []
    }));
  }catch(e){ console.error('Erro ao carregar empresas:', e); empresas = []; }

  if(empresas.length > 0){
    const ids = empresas.map(e => e.id);
    const podeVerDadosPessoais = currentProfile?.role === 'master'
                              || currentProfile?.role === 'owner_empresa';

    const queries = [
      supabaseClient.from('servicos').select('*').in('empresa_id', ids),
      supabaseClient.from('horarios_disponiveis').select('*').in('empresa_id', ids),
      supabaseClient.from('bloqueios').select('*').in('empresa_id', ids),
      supabaseClient.from('botoes_empresa').select('*').in('empresa_id', ids),
      podeVerDadosPessoais
        ? supabaseClient.from('agendamentos').select('*').in('empresa_id', ids)
        : supabaseClient.from('horarios_ocupados').select('*').in('empresa_id', ids),
      currentProfile?.role === 'master'
        ? supabaseClient.from('profiles').select('empresa_id, email, status').eq('role','owner_empresa')
        : Promise.resolve({ data: null })
    ];

    let rServicos, rHorarios, rBloqueios, rBotoes, rAg, rProfiles;
    try{
      [rServicos, rHorarios, rBloqueios, rBotoes, rAg, rProfiles] = await Promise.all(queries);
    }catch(e){
      console.error('Erro ao carregar dados:', e);
      agendamentos = []; loaded = true; return;
    }

    (rServicos.data || []).forEach(s => {
      const emp = empresas.find(e => e.id === s.empresa_id);
      if(emp) emp.servicos.push({ id: s.id, nome: s.nome, duracao: s.duracao, preco: Number(s.preco) });
    });

    (rHorarios.data || []).forEach(h => {
      const emp = empresas.find(e => e.id === h.empresa_id);
      if(!emp) return;
      emp.horariosPorMes[h.mes] = emp.horariosPorMes[h.mes] || [];
      if(!emp.horariosPorMes[h.mes].includes(h.hora)) emp.horariosPorMes[h.mes].push(h.hora);
    });

    (rBloqueios.data || []).forEach(b => {
      const emp = empresas.find(e => e.id === b.empresa_id);
      if(emp) emp.bloqueios.push({ id: b.id, data: b.data, hora: b.hora });
    });

    (rBotoes.data || []).forEach(b => {
      const emp = empresas.find(e => e.id === b.empresa_id);
      if(emp) emp.botoes.push({
        id: b.id, nome: b.nome, tipo: b.tipo, link: b.link,
        icone: b.icone || '', ordem: b.ordem, ativo: b.ativo,
        abrirNovaAba: b.abrir_nova_aba
      });
    });
    empresas.forEach(e => e.botoes.sort((a, b) => a.ordem - b.ordem));

    if(podeVerDadosPessoais){
      agendamentos = (rAg.data || []).map(a => {
        const emp = empresas.find(e => e.id === a.empresa_id);
        return {
          id:          a.id,
          slug:        emp ? emp.slug : '',
          servicoId:   a.servico_id,
          servicoNome: a.servico_nome,
          data:        a.data,
          hora:        a.hora,
          nome:        a.nome_cliente,
          telefone:    a.telefone,
          criadoEm:    a.criado_em
        };
      });
    } else {
      agendamentos = (rAg.data || []).map(a => {
        const emp = empresas.find(e => e.id === a.empresa_id);
        return { slug: emp ? emp.slug : '', data: a.data, hora: a.hora };
      });
    }

    (rProfiles.data || []).forEach(p => {
      const emp = empresas.find(e => e.id === p.empresa_id);
      if(emp){ emp.gestorEmail = p.email; emp.gestorStatus = p.status; }
    });
  } else {
    agendamentos = [];
  }

  loaded = true;
}

async function saveEmpresas(){
  const toRow = e => ({
    slug:                  e.slug,
    nome:                  e.nome,
    foto_url:              e.fotoUrl              || null,
    whatsapp:              e.whatsapp              || null,

    bloqueada:             e.bloqueada,
    // Campos de personalização (Fase 2)
    descricao:             e.descricao             || null,
    logo:                  e.logo                  || null,
    cor_principal:         e.corPrincipal          || '#3d1f3a',
    texto_destaque:        e.textoDestaque         || null,
  });

  const novas     = empresas.filter(e => !e.id);
  const existentes = empresas.filter(e =>  e.id);

  if(novas.length > 0){
    const { data, error } = await supabaseClient
      .from('empresas').insert(novas.map(toRow)).select();
    if(error){ console.error('Erro ao criar empresa:', error); return; }
    (data || []).forEach(row => {
      const emp = empresas.find(e => e.slug === row.slug);
      if(emp) emp.id = row.id;
    });
  }

  if(existentes.length > 0){
    const { error } = await supabaseClient
      .from('empresas')
      .upsert(existentes.map(e => ({ id: e.id, ...toRow(e) })), { onConflict: 'id' });
    if(error) console.error('Erro ao atualizar empresa:', error);
  }
}
function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

let currentRoute = { master:null, empresa:null, page:"" };

function getParams(){
  return currentRoute;
}
function goto(params){
  pararPolling();
  currentRoute = { master:null, empresa:null, page:"", ...params };
  const qs = params.master ? '?master=1'
    : params.empresa ? ('?' + new URLSearchParams({ empresa: params.empresa, ...(params.page ? { page: params.page } : {}) }).toString())
    : '';
  history.pushState(currentRoute, '', qs || location.pathname);
  route();
}
window.addEventListener('popstate', e => {
  if(e.state){ pararPolling(); currentRoute = e.state; route(); }
});

function defaultEmpresa(){
  return {
    slug:"", nome:"", fotoUrl:"", whatsapp:"", bloqueada:false,
    descricao:"", logo:"", corPrincipal:"#3d1f3a", textoDestaque:"",
    servicos:[], horariosPorMes:{}, bloqueios:[], botoes:[]
  };
}

// IMPORTANTE: usa a data LOCAL, não UTC.
// toISOString() converteria para UTC e, no Brasil (UTC-3), a partir
// das 21h o sistema passaria a considerar que já é o dia seguinte.
function mesKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function horariosDoMes(emp, key){
  const uni = (emp.horariosPorMes && emp.horariosPorMes['_uni_']) || [];
  if(uni.length) return [...uni].sort();
  const lista = (emp.horariosPorMes && emp.horariosPorMes[key]) || [];
  return [...lista].sort();
}
function isoData(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const root = document.getElementById('root');
function render(html){ root.innerHTML = html; }

function toast(msg, type='info', ms=3200){
  let c = document.getElementById('toast-root');
  if(!c){ c = document.createElement('div'); c.id='toast-root'; document.body.appendChild(c); }
  const el = document.createElement('div');
  el.className = `toast${type==='ok'?' ok':type==='err'?' err':''}`;
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); el.addEventListener('transitionend',()=>el.remove(),{once:true}); }, ms);
}
function friendlyError(err, fallback='Algo deu errado. Tente novamente.'){
  if(!err) return fallback;
  if(err.code==='23505') return 'Esse horário já está reservado. Escolha outro.';
  if(err.code==='42501'||err.code==='PGRST301') return 'Sem permissão para esta ação.';
  if(err.message && err.message.toLowerCase().includes('network')) return 'Sem conexão. Verifique sua internet.';
  return fallback;
}
function fmtTelStr(val){
  if(!val) return '';
  let d = String(val).replace(/\D/g,'');
  if(d.startsWith('55') && d.length > 11) d = d.slice(2);
  if(d.startsWith('0')) d = d.slice(1);
  d = d.slice(0,11);
  if(d.length > 7) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length > 2) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  return d;
}
window.maskTel = (input)=>{
  input.value = fmtTelStr(input.value);
};

let _pollInterval = null;
let _pollFn = null;
function iniciarPolling(fn){
  pararPolling();
  _pollFn = fn;
  _pollInterval = setInterval(async ()=>{
    if(document.hidden) return;
    await loadData();
    if(_pollFn) _pollFn();
  }, 30000);
}
function pararPolling(){
  if(_pollInterval){ clearInterval(_pollInterval); _pollInterval = null; _pollFn = null; }
}

// ---------- INIT ----------
async function init(){
  render(`<div class="loading-wrap"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div><div>Carregando…</div></div>`);

  // Escuta mudanças de auth (inclui PASSWORD_RECOVERY vindo do e-mail)
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Trava a navegação: sem isso, o route() no fim do init()
      // apagaria a tela de redefinição assim que ela aparecesse.
      modoRecuperacao = true;
      currentUser = session?.user || null;
      renderRedefinirSenha();
      return;
    }
    currentUser = session?.user || null;
    if (currentUser) {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      currentProfile = data || null;
    } else {
      currentProfile = null;
    }
  });

  // Sessão existente (ex: ao recarregar a página)
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  if (currentUser) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = data || null;
  }

  await loadData();
  if(modoRecuperacao) return;   // não sobrepõe a tela de redefinir senha

  const params = new URLSearchParams(location.search);
  if(params.get('empresa')) currentRoute.empresa = params.get('empresa');
  else if(params.get('master')) currentRoute.master = 1;
  else {
    // URL limpa: /slug → Vercel reescreve para /app.html?empresa=slug,
    // mas o browser ainda vê /slug no pathname.
    const slug = location.pathname.replace(/^\/+|\/+$/g, '');
    if(slug && slug !== 'app.html') currentRoute.empresa = slug;
  }
  route();
}

function route(){
  const {master, empresa, page} = getParams();
  if(master){
    renderMaster();
  } else if(empresa){
    const emp = empresas.find(e=>e.slug===empresa);
    if(!emp){ renderNotFound(); return; }
    if(page==="agendar") renderAgendar(emp);
    else if(page==="confirmacao") renderConfirmacao(emp);
    else if(page==="gestao"){
      const isMaster = currentProfile?.role === 'master';
      const isOwner  = currentProfile?.role === 'owner_empresa'
                    && currentProfile?.empresa_id === emp.id
                    && currentProfile?.status === 'ativo';
      if(isMaster || isOwner){
        if(emp.bloqueada && !isMaster){
          render(`${barraVoltarMaster()}<div class="container"><div class="empty"><h2 class="display">Empresa bloqueada</h2><p>Esta empresa está bloqueada pelo administrador. Entre em contato para mais informações.</p></div></div>`);
        } else { renderGestao(emp); }
      } else { renderGestaoLogin(emp); }
    }
    else renderHome(emp);
  } else {
    renderMaster();
  }
}

function barraVoltarMaster(){
  if(currentProfile?.role !== 'master') return "";
  return `<div style="background:#f0f0f0;color:#1a1a1a;padding:10px 20px;text-align:center;font-size:13px;font-weight:700;">
    Modo visualização (via painel master) — <span style="text-decoration:underline;cursor:pointer;" onclick="goto({master:1})">Voltar ao painel master</span>
  </div>`;
}

function renderNotFound(){
  render(`<div class="container"><div class="empty"><h2 class="display">Empresa não encontrada</h2><p>Verifique o link e tente novamente.</p></div></div>`);
}

function setPageMeta(title, description, imageUrl){
  document.title = title;
  const setMeta = (sel, attr, val) => {
    let el = document.querySelector(sel);
    if(!el){ el = document.createElement('meta'); document.head.appendChild(el); }
    el.setAttribute(attr, val);
  };
  setMeta('meta[name="description"]', 'content', description || '');
  setMeta('meta[property="og:title"]', 'content', title);
  setMeta('meta[property="og:description"]', 'content', description || '');
  if(imageUrl) setMeta('meta[property="og:image"]', 'content', imageUrl);
}

// ---------- AGENDAMENTO ----------
let bookingState = {};
function renderAgendar(emp){
  applyAccent(emp.corPrincipal);
  if(bookingState._slug !== emp.slug) bookingState = { _slug:emp.slug, servico:null, data:null, hora:null, nome:"", telefone:"", telefoneDisplay:"" };

  function primeiros7Dias(emp){
    const out = [];
    const hoje = new Date();
    for(let i=0;i<120 && out.length<7;i++){
      const d = new Date(hoje);
      d.setDate(hoje.getDate()+i);
      const key = mesKey(d);
      const h = horariosDoMes(emp, key);
      if(h.length>0) out.push(d);
    }
    return out;
  }

  function draw(){
    const dias7 = primeiros7Dias(emp);

    const diasHtml = dias7.length ? dias7.map(d=>{
      const iso = isoData(d);
      const sel = bookingState.data===iso;
      const label = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      return `<button class="btn ${sel?'':'ghost'}" onclick="selectDia('${iso}')">${label}</button>`;
    }).join("") : `<p class="muted">Nenhuma data disponível.</p>`;

    // verifica se data selecionada não está nos 7 (veio do calendário)
    const dataForaDos7 = bookingState.data && !dias7.some(d=>isoData(d)===bookingState.data);
    const dataFmtOutra = bookingState.data && dataForaDos7
      ? new Date(bookingState.data+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
      : null;

    const slots = bookingState.data ? horariosDoMes(emp, bookingState.data.slice(0,7)) : [];
    const _agora = new Date();
    const _hojeIso = isoData(_agora);
    const slotsHtml = bookingState.data ? (slots.length ? slots.map(h=>{
      const taken = agendamentos.some(a=>a.slug===emp.slug && a.data===bookingState.data && a.hora===h);
      const bloqueado = (emp.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===h);
      const passado = bookingState.data === _hojeIso && (()=>{const [hh,mm]=h.split(':').map(Number); return hh*60+mm <= _agora.getHours()*60+_agora.getMinutes();})();
      const sel = bookingState.hora===h;
      if(taken || bloqueado || passado) return `<div class="slot taken">${h}</div>`;
      return `<div class="slot free ${sel?'selected':''}" onclick="selectHora('${h}')">${h}</div>`;
    }).join("") : `<p class="muted">Nenhum horário disponível nesta data.</p>`) : `<p class="muted">Escolha um dia primeiro.</p>`;

    const servicosHtml = emp.servicos.length
      ? emp.servicos.map(s=>{
          const sel = bookingState.servico===s.id;
          const precoFmt = s.preco ? ` — R$ ${Number(s.preco).toLocaleString('pt-BR',{minimumFractionDigits:0})}` : '';
          return `<div class="service-opt ${sel?'selected':''}" onclick="selectServico('${s.id}')">
            <strong>${escapeHtml(s.nome)}</strong>${precoFmt ? `<span style="font-weight:400;color:var(--ink-soft)">${precoFmt}</span>` : ''}
          </div>`;
        }).join("")
      : `<p class="muted" style="font-size:13px;padding:8px 0;">Em breve — serviços sendo configurados.</p>`;

    const telDigits = bookingState.telefone.replace(/\D/g,'');
    const telValido = telDigits.length === 12 && telDigits[0] === '0' && telDigits[3] === '9';
    const telErro   = telDigits.length > 0 && !telValido;
    const canSubmit = bookingState.servico && bookingState.data && bookingState.hora && bookingState.nome.trim() && telValido;
    const pendente = !canSubmit ? (!bookingState.servico ? 'Escolha um serviço' : !bookingState.data ? 'Escolha um dia' : !bookingState.hora ? 'Escolha um horário' : !bookingState.nome.trim() ? 'Informe seu nome' : 'Informe um telefone válido') : null;

    render(`
      ${barraVoltarMaster()}
      <div class="topbar top-plum" style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;">
        <button class="icon-btn" style="color:rgba(255,255,255,0.85);font-size:22px;line-height:1;" onclick="goto({empresa:'${emp.slug}'})">←</button>
        <div class="brand" style="text-align:center;font-size:17px;">${escapeHtml(emp.nome)}</div>
        <div></div>
      </div>
      <div class="container">
        <div class="card">
          <div class="eyebrow">Passo 1</div>
          <h3 class="display">Escolha o serviço</h3>
          ${servicosHtml}

          <div class="eyebrow" style="margin-top:24px;">Passo 2</div>
          <h3 class="display">Escolha o dia</h3>
          <div class="dias-scroll">
            ${diasHtml}
            <button class="btn ${dataFmtOutra?'':'ghost'}" style="position:relative;flex-shrink:0;min-width:72px;" onclick="document.getElementById('calPicker').showPicker ? document.getElementById('calPicker').showPicker() : document.getElementById('calPicker').click()">
              ${dataFmtOutra ? dataFmtOutra : 'Outra data'}
              <input type="date" id="calPicker" value="${bookingState.data||''}" style="position:absolute;opacity:0;width:1px;height:1px;top:0;left:0;" onchange="selectDiaOutra(this.value)"/>
            </button>
          </div>

          <div class="eyebrow" style="margin-top:24px;">Passo 3</div>
          <h3 class="display">Escolha o horário</h3>
          <div class="slots-grid">${slotsHtml}</div>

          <div class="eyebrow" style="margin-top:24px;">Passo 4</div>
          <h3 class="display">Seus dados</h3>
          <div class="field"><label>Nome</label><input id="inpNome" value="${escapeAttr(bookingState.nome)}" oninput="bookingState.nome=this.value.toUpperCase();this.value=this.value.toUpperCase()" placeholder="SEU NOME" style="text-transform:uppercase;"/></div>
          <div class="field">
            <label>Telefone (WhatsApp)</label>
            <input id="inpTel" type="tel" inputmode="numeric" maxlength="16"
              value="${escapeAttr(bookingState.telefoneDisplay||bookingState.telefone)}"
              oninput="formatarTelefone(this)"
              placeholder="(11) 91234-5678"/>
            <div id="telError" style="display:${telErro?'flex':'none'};align-items:flex-start;gap:6px;margin-top:8px;color:var(--danger);font-size:13px;line-height:1.4;">
              <span style="font-weight:700;font-size:15px;flex-shrink:0;">ⓘ</span>
              <span>DDD + 9 + 8 dígitos. Ex: <strong>(11) 91234-5678</strong></span>
            </div>
          </div>

          <button id="btnAgendar" class="btn" style="width:100%;margin-top:8px;" ${canSubmit?'':'disabled'} onclick="confirmarAgendamento('${emp.slug}')">Agendar</button>
          ${pendente ? `<div style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:6px;">${pendente}</div>` : ''}
        </div>
      </div>
    `);
  }
  window.selectServico = (id)=>{ bookingState.servico = id; draw(); };
  window.selectDia = (iso)=>{ bookingState.data = iso; bookingState.hora=null; draw(); };
  window.selectDiaOutra = (iso)=>{ if(iso){ bookingState.data = iso; bookingState.hora=null; draw(); } };
  window.selectHora = (h)=>{ bookingState.hora = h; draw(); };
  window.formatarTelefone = (input)=>{
    let d = input.value.replace(/\D/g,'');
    // Remove DDI 55 colado do WhatsApp
    if(d.startsWith('55') && d.length > 11) d = d.slice(2);
    // Remove 0 inicial para normalizar
    if(d.startsWith('0')) d = d.slice(1);
    d = d.slice(0, 11);
    // Formato de exibição: (DDD) 9XXXX-XXXX
    let display = d;
    if(d.length > 7) display = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    else if(d.length > 2) display = `(${d.slice(0,2)}) ${d.slice(2)}`;
    input.value = display;
    // Armazena normalizado com 0 para validação
    const norm = d.length > 0 ? '0' + d : '';
    bookingState.telefone = norm;
    bookingState.telefoneDisplay = display;
    const valido = norm.length === 12 && norm[0] === '0' && norm[3] === '9';
    const erro = d.length > 0 && !valido;
    const errEl = document.getElementById('telError');
    if(errEl) errEl.style.display = erro ? 'flex' : 'none';
    const btn = document.getElementById('btnAgendar');
    if(btn) btn.disabled = !(bookingState.servico && bookingState.data && bookingState.hora && bookingState.nome.trim() && valido);
  };
  draw();
}

async function confirmarAgendamento(slug){
  const btnAg = document.getElementById('btnAgendar');
  if(btnAg && btnAg.disabled) return;
  if(btnAg){ btnAg.disabled = true; btnAg.innerHTML = '<span class="spinner"></span> Agendando…'; }
  const emp = empresas.find(e=>e.slug===slug);
  const nomeInp = document.getElementById('inpNome');
  const telInp = document.getElementById('inpTel');
  bookingState.nome = nomeInp ? nomeInp.value : bookingState.nome;
  if(telInp){ let _d=telInp.value.replace(/\D/g,''); if(_d.startsWith('55')&&_d.length>11)_d=_d.slice(2); if(_d.startsWith('0'))_d=_d.slice(1); bookingState.telefone=_d.length?'0'+_d:''; }
  const _digits = bookingState.telefone.replace(/\D/g,'');
  const _telOk = _digits.length === 12 && _digits[0] === '0' && _digits[3] === '9';
  if(!bookingState.servico || !bookingState.data || !bookingState.hora || !bookingState.nome.trim() || !_telOk){
    if(btnAg) btnAg.disabled = false; return;
  }

  const jaOcupado = agendamentos.some(a=>a.slug===slug && a.data===bookingState.data && a.hora===bookingState.hora)
    || (emp.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===bookingState.hora);
  if(jaOcupado){ toast('Esse horário foi reservado ou bloqueado. Escolha outro.','err'); if(btnAg){btnAg.disabled=false;btnAg.innerHTML='Agendar';} renderAgendar(emp); return; }

  const servico = emp.servicos.find(s=>s.id===bookingState.servico);
  // Sem .select(): o visitante tem permissão de gravar, mas não de ler
  // a tabela de agendamentos (protege nome e telefone dos outros clientes).
  const { error } = await supabaseClient.from('agendamentos').insert({
    empresa_id:   emp.id,
    servico_id:   servico ? servico.id : null,
    servico_nome: servico ? servico.nome : '',
    data:         bookingState.data,
    hora:         bookingState.hora,
    nome_cliente: bookingState.nome.trim(),
    telefone:     bookingState.telefone.trim()
  });
  if(error){
    if(btnAg){ btnAg.disabled=false; btnAg.innerHTML='Agendar'; }
    toast(friendlyError(error,'Erro ao realizar agendamento. Tente novamente.'),'err');
    if(error.code === '23505'){ renderAgendar(emp); } return;
  }
  const novo = {
    slug,
    servicoId:   servico ? servico.id : null,
    servicoNome: servico ? servico.nome : '',
    data:        bookingState.data,
    hora:        bookingState.hora,
    nome:        bookingState.nome.trim(),
    telefone:    bookingState.telefone.trim()
  };
  agendamentos.push(novo);
  lastBooking = novo;
  goto({empresa:slug, page:'confirmacao'});
}

let lastBooking = null;

// ---------- CONFIRMAÇÃO ----------

  const numero = '55' + (emp.whatsapp||"").replace(/\D/g,"").replace(/^0/,"");
  const link = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
  render(`
    <div class="topbar top-plum" style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;">
      <button class="icon-btn" style="color:rgba(255,255,255,0.85);font-size:22px;line-height:1;" onclick="goto({empresa:'${emp.slug}'})">←</button>
      <div class="brand" style="text-align:center;font-size:17px;">${escapeHtml(emp.nome)}</div>
      <div></div>
    </div>

async function tentarLoginGestao(slug){
  const email = (document.getElementById('gestaoEmail').value || '').trim();
  const senha = document.getElementById('gestaoSenha').value;
  if(!email || !senha){ toast('Preencha e-mail e senha.','err'); return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){ toast('E-mail ou senha incorretos.','err'); return; }

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();

  if(!profile || profile.status !== 'ativo'){
    await supabaseClient.auth.signOut();
    toast('Conta bloqueada. Entre em contato com o administrador.','err');
    return;
  }

  const emp = empresas.find(e=>e.slug===slug);
  if(profile.role !== 'owner_empresa' || profile.empresa_id !== emp?.id){
    await supabaseClient.auth.signOut();
    toast('Acesso não autorizado para esta empresa.','err');
    return;
  }

  currentUser    = data.user;
  currentProfile = profile;
  await loadData();
  const empAtualizado = empresas.find(e=>e.slug===slug);
  renderGestao(empAtualizado || emp);
}
window.recuperarSenha = async (slug)=>{
  const email = prompt("Digite seu e-mail para receber o link de redefinição de senha:");
  if(!email) return;
  const base = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? location.origin
    : 'https://saas-agendamento-seven.vercel.app';
  const redirectTo = base + '/app.html';
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
  if(error){ toast('Erro ao enviar. Tente novamente.','err'); return; }
  toast('Se o e-mail estiver cadastrado, você receberá um link em breve.','ok',5000);
};

  // ── Financeiro (gestão) ──

  async function gFinCarregar(){
    if(_gFinCarregando) return;
    _gFinCarregando = true;
    const { data, error } = await supabaseClient
      .from('lancamentos_financeiros')
      .select('*')
      .eq('empresa_id', emp.id)
      .order('data', { ascending: false })
      .order('criado_em', { ascending: false });
    _gFinCarregando = false;
    if(!error && data){
      _gFinLancamentos = data;
      const lsKey = 'gfin_lancados_'+emp.id;
      const saved = JSON.parse(localStorage.getItem(lsKey)||'[]');
      saved.forEach(id=>_gFinAgLancados.add(id));
      data.filter(l=>l.agendamento_id).forEach(l=>_gFinAgLancados.add(l.agendamento_id));
      localStorage.setItem(lsKey, JSON.stringify([..._gFinAgLancados]));
    }
    if(corner === 'financeiro') draw();
  }

  function gFinFmtMoeda(v){ return 'R$ ' + parseFloat(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }

  function gFinDataLabel(){
    if(_gFinPeriodo==='dia'){
      const d = new Date(_gFinData+'T00:00:00');
      const hoje = isoData(new Date());
      if(_gFinData===hoje) return 'Hoje, '+d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
      const s = d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
      return s.charAt(0).toUpperCase()+s.slice(1);
    } else {
      const [y,m] = _gFinData.split('-');
      return new Date(parseInt(y),parseInt(m)-1,1).toLocaleString('pt-BR',{month:'long',year:'numeric'}).replace(' de ',' / ');
    }
  }

  function gFinNavegar(dir){
    if(_gFinPeriodo==='dia'){
      const d = new Date(_gFinData+'T00:00:00');
      d.setDate(d.getDate()+dir);
      _gFinData = isoData(d);
    } else {
      const [y,m] = _gFinData.split('-').map(Number);
      const d = new Date(y, m-1+dir, 1);
      _gFinData = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    }
    gFinCarregar();
  }
  window.gFinNavegar = gFinNavegar;

  window.gFinSetPeriodo = (p)=>{
    _gFinPeriodo = p;
    if(p==='dia') _gFinData = isoData(new Date());
    else _gFinData = isoData(new Date()).slice(0,7);
    gFinCarregar();
  };

  function gFinLancamentosFiltrados(){
    return _gFinLancamentos.filter(l=>{
      if(_gFinPeriodo==='dia') return l.data === _gFinData;
      return l.data.startsWith(_gFinData);
    });
  }

  function gFinPendentes(){
    const agora = new Date();
    return agendamentos.filter(a=>{
      if(a.slug !== emp.slug) return false;
      if(_gFinAgLancados.has(a.id)) return false;
      const dt = new Date(a.data+'T'+a.hora);
      return dt <= agora;
    }).sort((a,b)=> (b.data+b.hora).localeCompare(a.data+a.hora));
  }

  function financeiroBody(){
    const todosPeriodo = gFinLancamentosFiltrados();
    const receita = todosPeriodo.filter(l=>l.tipo==='receita').reduce((s,l)=>s+parseFloat(l.valor||0),0);
    const despesa = todosPeriodo.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+parseFloat(l.valor||0),0);
    const saldo   = receita - despesa;
    const pendentes = gFinPendentes();

    const lancamentos = todosPeriodo.filter(l=>{
      if(_gFinFiltro==='entradas') return l.tipo==='receita';
      if(_gFinFiltro==='saidas')   return l.tipo==='despesa';
      return true;
    });

    const CS = 'font-family:Nunito,sans-serif;cursor:pointer;';

    const modalHtml = _gFinModal ? (()=>{
      const m = _gFinModal;

      const svcModal = agModal?.servicoNome || '';
      const svcHtml = svcModal ? `<div class="field"><label>Serviço</label><div style="padding:12px 14px;border-radius:10px;border:1.5px solid #e0e0e0;background:#f7f7f7;font-size:15px;color:#555;">${escapeHtml(svcModal)}</div></div>` : '';
      return `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;display:flex;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)gFinFecharModal()">
        <div style="background:#fff;border-radius:18px 18px 0 0;padding:28px 24px 40px;width:100%;max-width:520px;">

          ${svcHtml}
          <div class="field"><label>Valor (R$)</label><input id="gfin-val" type="number" min="0" step="0.01" value="${escapeHtml(m.valor||'')}" placeholder="0,00"></div>

            <button class="btn ghost" onclick="gFinFecharModal()">Cancelar</button>
            <button class="btn" style="background:${corBtn};" onclick="gFinSalvar()">Salvar</button>
          </div>
        </div>
      </div>`;
    })() : '';

    const pendentesHtml = pendentes.length===0 ? '' : `
      <div style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;">Pendentes</div>
      ${pendentes.map(a=>{
        const svcNome = a.servicoNome || '';
        const horario = a.hora ? a.hora.slice(0,5) : '';

        return `<div style="background:#fff;border:0.5px solid #eee;border-left:4px solid #FFA500;border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;">

            <div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(a.nome||'')}</div>

        </div>`;
      }).join('')}`;

    const lancamentosHtml = lancamentos.length===0
      ? `<div style="text-align:center;padding:28px 20px;color:#aaa;font-size:13px;">Nenhum lançamento neste período</div>`
      : lancamentos.map(l=>{
          const isIn   = l.tipo==='receita';
          const bordClr= isIn ? '#008000' : '#FF0000';
          const valClr = isIn ? '#008000' : '#FF0000';

          const svcMeta = ag?.servicoNome ? ag.servicoNome+' · ' : '';
          const meta   = ag ? `${svcMeta}${dataFmt}${horario}` : dataFmt;
          const lid    = escapeHtml(l.id);
          return `<div style="background:#fff;border:0.5px solid #eee;border-left:4px solid ${bordClr};border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(l.descricao)}</div>
              <div style="font-size:11px;color:#aaa;margin-top:2px;">${escapeHtml(meta)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
              <div style="font-size:13px;font-weight:400;color:${valClr};font-variant-numeric:tabular-nums;">${isIn?'+':'-'}${gFinFmtMoeda(l.valor)}</div>
              <div style="display:flex;gap:3px;">
                <button onclick="gFinEditarLanc('${lid}')" style="${CS}width:26px;height:26px;border-radius:6px;border:none;background:none;color:#1a1a1a;display:flex;align-items:center;justify-content:center;">${ICO_EDIT}</button>
                <button onclick="gFinExcluir('${lid}')" style="${CS}width:26px;height:26px;border-radius:6px;border:none;background:none;color:#1a1a1a;display:flex;align-items:center;justify-content:center;">${ICO_TRASH}</button>
              </div>
            </div>
          </div>`;
        }).join('');

    const filtroLabel = {todos:'Todos',entradas:'Entradas',saidas:'Saídas'};
    const filtros = ['todos','entradas','saidas'].map(f=>`
      <div onclick="gFinSetFiltro('${f}')" style="${CS}padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;
        color:${_gFinFiltro===f?'#1a1a1a':'#888'};
        background:${_gFinFiltro===f?'#fff':'transparent'};
        box-shadow:${_gFinFiltro===f?'0 1px 4px rgba(0,0,0,0.10)':'none'};">
        ${filtroLabel[f]}
      </div>`).join('');

    return `
      ${modalHtml}
      <div style="background:#e8e8e8;border-radius:8px;padding:3px;display:flex;margin-bottom:14px;">
        ${['dia','mes'].map(p=>`<button onclick="gFinSetPeriodo('${p}')" style="${CS}flex:1;padding:6px;border-radius:6px;border:none;font-size:13px;font-weight:700;
          background:${_gFinPeriodo===p?'#fff':'transparent'};color:${_gFinPeriodo===p?'#1a1a1a':'#888'};
          box-shadow:${_gFinPeriodo===p?'0 1px 4px rgba(0,0,0,0.12)':'none'};">${p==='dia'?'Dia':'Mês'}</button>`).join('')}
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:12px;font-weight:600;color:#555;">${gFinDataLabel()}</span>
        <div style="display:flex;gap:4px;">
          <button onclick="gFinNavegar(-1)" style="${CS}background:#fff;border:0.5px solid #e0e0e0;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${ICO_LEFT}</button>
          <button onclick="gFinNavegar(1)"  style="${CS}background:#fff;border:0.5px solid #e0e0e0;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${ICO_RIGHT}</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;grid-auto-rows:44px;">
        <div style="background:#fff;border:0.5px solid #eee;border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#008000;margin-bottom:1px;">Receitas</div>
          <div style="font-size:15px;font-weight:700;color:#008000;font-variant-numeric:tabular-nums;">${gFinFmtMoeda(receita)}</div>
        </div>
        <div style="background:#fff;border:0.5px solid #eee;border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#FF0000;margin-bottom:1px;">Despesas</div>
          <div style="font-size:15px;font-weight:700;color:#FF0000;font-variant-numeric:tabular-nums;">${gFinFmtMoeda(despesa)}</div>
        </div>
        <div style="background:#fff;border:0.5px solid #eee;border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#1a1a1a;margin-bottom:1px;">Saldo ${_gFinPeriodo==='dia'?'do dia':'do mês'}</div>
          <div style="font-size:15px;font-weight:700;color:#1a1a1a;font-variant-numeric:tabular-nums;">${gFinFmtMoeda(saldo)}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button onclick="gFinAbrirModal('receita')" style="${CS}flex:1;border:none;border-radius:7px;background:#008000;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;min-height:0;">+ Receita</button>
          <button onclick="gFinAbrirModal('despesa')" style="${CS}flex:1;border:none;border-radius:7px;background:#FF0000;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;min-height:0;">+ Despesa</button>
        </div>
      </div>

      ${pendentesHtml}

      <div style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;">Lançamentos</div>
      <div style="display:inline-flex;background:#f0f0f0;border-radius:999px;padding:3px;gap:2px;margin-bottom:12px;">${filtros}</div>
      ${lancamentosHtml}
    `;
  }

  window.gFinSetFiltro = (f)=>{ _gFinFiltro=f; draw(); };

  window.gFinAbrirModal = (tipo)=>{
    _gFinModal = { tipo, agId: null, descricao: '', valor: '', editId: null };
    draw();
    setTimeout(()=>document.getElementById('gfin-desc')?.focus(), 50);
  };

  window.gFinEditarLanc = (id)=>{
    const l = _gFinLancamentos.find(x=>x.id===id);
    if(!l) return;
    _gFinModal = { tipo: l.tipo, agId: l.agendamento_id||null, descricao: l.descricao, valor: String(l.valor), editId: id };
    draw();
    setTimeout(()=>document.getElementById('gfin-desc')?.focus(), 50);
  };

  window.gFinExcluir = async (id)=>{
    if(!confirm('Excluir este lancamento?')) return;
    const { error } = await supabaseClient.from('lancamentos_financeiros').delete().eq('id', id);
    if(error){ toast('Erro ao excluir.','err'); return; }
    toast('Lancamento removido.','ok');
    await gFinCarregar();
  };

  window.gFinAbrirModalPendente = (agId)=>{
    const ag = agendamentos.find(a=>a.id===agId);
    if(!ag) return;
    const svc = emp.servicos.find(s=>s.id===ag.servicoId);
    _gFinModal = { tipo:'receita', agId, descricao: ag.nome||'', valor: svc?.preco ? String(svc.preco) : '' };
    draw();
    setTimeout(()=>document.getElementById('gfin-val')?.focus(), 50);
  };

  window.gFinFecharModal = ()=>{ _gFinModal=null; draw(); };

  window.gFinSalvar = async ()=>{
    const descEl = document.getElementById('gfin-desc');
    const valEl  = document.getElementById('gfin-val');
    const desc = descEl?.value?.trim();
    const val  = parseFloat(valEl?.value);
    if(!desc){ toast('Informe uma descricao.','err'); return; }
    if(isNaN(val)||val<=0){ toast('Informe um valor valido.','err'); return; }
    const m = _gFinModal;
    _gFinModal = null;
    let error;
    if(m.editId){
      ({ error } = await supabaseClient.from('lancamentos_financeiros').update({ descricao: desc, valor: val }).eq('id', m.editId));
    } else {
      const dataLanc = _gFinPeriodo==='dia' ? _gFinData : isoData(new Date());
      const payload = { empresa_id: emp.id, tipo: m.tipo, descricao: desc, valor: val, data: dataLanc };
      if(m.agId) payload.agendamento_id = m.agId;
      ({ error } = await supabaseClient.from('lancamentos_financeiros').insert(payload));
      if(!error && m.agId){
        _gFinAgLancados.add(m.agId);
        localStorage.setItem('gfin_lancados_'+emp.id, JSON.stringify([..._gFinAgLancados]));
      }
    }
    if(error){ toast('Erro ao salvar: '+error.message,'err'); _gFinModal=m; draw(); return; }
    toast('Lancamento salvo!','ok');
    await gFinCarregar();
  };

  function draw(){
    const isMaster = currentProfile?.role === 'master';
    const exitAction = isMaster
      ? `goto({empresa:'${emp.slug}'})`
      : `gestaoLogout('${emp.slug}')`;
    const exitLabel = isMaster ? 'Voltar' : 'Sair';
    const exitIco   = isMaster ? G_ICO.voltar : G_ICO.sair;

    const navItems = GESTAO_NAV.map(n => `
      <button class="g-bn-item ${corner===n.id?'active':''}" onclick="setCorner(${n.id===null?'null':`'${n.id}'`})">
        <span class="g-bn-ico">${n.ico}</span>
        <span>${n.label}</span>
      </button>`).join('');

    const body = corner==='dashboard'    ? dashboardBody()
               : corner==='configurar'   ? configurarBody()
               : corner==='financeiro'   ? financeiroBody()
               : agendamentosBody();

    const cardStyle = (corner==='configurar' || corner==='financeiro') ? 'background:none;box-shadow:none;padding:0;' : '';

    render(`
      ${GESTAO_CSS}
      <div style="position:sticky;top:0;z-index:300;">
        ${barraVoltarMaster()}
        <div class="g-topbar">
          <div class="brand">${escapeHtml(emp.nome)}</div>
          <button class="icon-btn" style="color:#888;" onclick="${exitAction}">${exitLabel}</button>
        </div>
      </div>
      <div class="g-layout">
        <nav class="g-bottom-nav">
          ${navItems}
        </nav>
        <div class="g-content">
          <div class="container wide">
            <div class="card" style="${cardStyle}">${body}</div>
          </div>
        </div>
      </div>
    `);
  }

  window.setCorner = (c)=>{
    if(c==='financeiro' && corner!=='financeiro'){
      _gFinData = isoData(new Date()); _gFinPeriodo='dia'; _gFinLancamentos=[]; _gFinModal=null;
      corner=c; editandoId=null; novoAgState=null; configurarSub=null; _removendoServicoIdx=null;
      draw(); gFinCarregar(); return;
    }
    corner=c; editandoId=null; novoAgState=null; configurarSub=null; _removendoServicoIdx=null; _gFinModal=null; draw();
  };
  window.selecionarDiaGestao = (iso)=>{
    if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
    diaSelecionado=iso; editandoId=null; novoAgState=null; draw();
  };
  window.selecionarImagem = (tipo)=>{
    abrirCrop(tipo, emp.slug, async (url)=>{
      if(tipo==='logo'){ emp.logo = url; } else { emp.fotoUrl = url; }
      // preserva campos digitados antes de re-renderizar
      const _nome = document.getElementById('pNome')?.value; if(_nome!=null) emp.nome = _nome;
      const _desc = document.getElementById('pDescricao')?.value; if(_desc!=null) emp.descricao = _desc;
      const _dest = document.getElementById('pTextoDestaque')?.value; if(_dest!=null) emp.textoDestaque = _dest;
      draw();
    });
  };

  window.bloquearDiaTodo = async ()=>{
    const horarios = horariosDoMes(emp, diaSelecionado.slice(0,7));
    if(!horarios.length){ toast('Nenhum horário configurado para este dia.','err'); return; }
    const naoBloquados = horarios.filter(h=>!((emp.bloqueios||[]).some(b=>b.data===diaSelecionado && b.hora===h)));
    const dataFmtConf = new Date(diaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(!confirm(`Bloquear o dia ${dataFmtConf} inteiro?`)) return;
    if(naoBloquados.length){
      const rows = naoBloquados.map(h=>({ empresa_id: emp.id, data: diaSelecionado, hora: h }));
      const { data, error } = await supabaseClient.from('bloqueios').insert(rows).select();
      if(error){ toast('Erro ao bloquear. Tente novamente.','err'); return; }
      if(data) data.forEach(r=>{ (emp.bloqueios=emp.bloqueios||[]).push({id:r.id, data:r.data, hora:r.hora}); });
    }
    draw();
  };
  window.desbloquearDiaTodo = async ()=>{
    const dataFmtConf = new Date(diaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(!confirm(`Desbloquear o dia ${dataFmtConf} inteiro?`)) return;
    const ids = (emp.bloqueios||[]).filter(b=>b.data===diaSelecionado).map(b=>b.id);
    if(!ids.length){ draw(); return; }
    const { error } = await supabaseClient.from('bloqueios').delete().in('id', ids);
    if(error){ toast('Erro ao desbloquear. Tente novamente.','err'); return; }
    emp.bloqueios = (emp.bloqueios||[]).filter(b=>b.data!==diaSelecionado);
    draw();
  };

  window.novoAgendamento = (data, hora)=>{ novoAgState={data,hora}; editandoId=null; draw(); };
  window.cancelarNovoAg = ()=>{ novoAgState=null; draw(); };
  window.salvarNovoAg = async (data)=>{
    const nome = document.getElementById('novoNome')?.value?.trim();
    const tel  = document.getElementById('novoTel')?.value?.trim();
    const servicoId = document.getElementById('novoServico')?.value;
    const hora = document.getElementById('novoHora')?.value;
    if(!nome||!tel||!servicoId||!hora){ toast('Preencha todos os campos.','err'); return; }
    const telDigits = tel.replace(/\D/g,'').replace(/^0/,'');
    if(telDigits.length !== 11 || telDigits[2] !== '9'){ toast('Telefone inválido. Ex: (11) 98765-4321','err'); return; }
    const telNorm = '0' + telDigits;
    const servico = emp.servicos.find(s=>s.id===servicoId);
    const {data:row, error} = await supabaseClient.from('agendamentos').insert({
      empresa_id: emp.id,
      nome_cliente: nome, telefone: telNorm, servico_id: servicoId, servico_nome: servico?.nome||'',
      data, hora
    }).select().single();
    if(error){ toast(friendlyError(error,'Erro ao agendar.'),'err'); return; }
    agendamentos.push({
      id:row.id, slug:emp.slug,
      nome:row.nome_cliente, telefone:row.telefone,
      servicoId:row.servico_id, servicoNome:row.servico_nome,
      data:row.data, hora:row.hora
    });
    novoAgState=null; draw();
  };
  window.editarAgendamento = (id)=>{ editandoId=id; novoAgState=null; draw(); };
  window.cancelarEdicaoAgendamento = ()=>{ editandoId=null; draw(); };
  window.salvarEdicaoAgendamento = async (id)=>{
    const ag = agendamentos.find(a=>a.id===id);
    const nome = document.getElementById('editNome').value.trim();
    const tel = document.getElementById('editTel').value.trim();
    const servicoId = document.getElementById('editServico').value;
    const hora = document.getElementById('editHora').value;
    if(!nome || !tel){ toast('Preencha nome e telefone.','err'); return; }
    const telDigitos = tel.replace(/\D/g,'').replace(/^(55|0)/,'');
    if(telDigitos.length !== 11 || telDigitos[2] !== '9'){ toast('Telefone inválido. Ex: (11) 98765-4321','err'); return; }
    const telNorm = '0' + telDigitos;
    if(hora !== ag.hora){
      const ocupado = agendamentos.some(a=>a.id!==ag.id && a.slug===emp.slug && a.data===ag.data && a.hora===hora);
      if(ocupado){ toast('Esse horário já está ocupado.','err'); return; }
    }
    const servico = emp.servicos.find(s=>s.id===servicoId);
    const { error } = await supabaseClient.from('agendamentos').update({
      nome_cliente: nome,
      telefone:     telNorm,
      servico_id:   servicoId,
      servico_nome: servico ? servico.nome : ag.servicoNome,
      hora:         hora
    }).eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao salvar agendamento. Tente novamente.'),'err'); return; }
    ag.nome = nome; ag.telefone = telNorm; ag.servicoId = servicoId; ag.servicoNome = servico?servico.nome:ag.servicoNome; ag.hora = hora;
    editandoId = null; draw();
  };
  window.cancelarAgendamento = async (id)=>{
    if(!confirm('Cancelar este agendamento? Essa ação não pode ser desfeita.')) return;
    const { error } = await supabaseClient.from('agendamentos').delete().eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao cancelar agendamento. Tente novamente.'),'err'); return; }
    agendamentos = agendamentos.filter(a=>a.id!==id);
    draw();
  };
  window.bloquearHorario = async (data,hora)=>{

    if(error){ toast(friendlyError(error,'Erro ao remover horário. Tente novamente.'),'err'); return; }

  window.toggleDiaSemana = async (dia)=>{
    emp.horariosPorMes = emp.horariosPorMes || {};
    const atual = (emp.horariosPorMes['_dias_'] || []).map(Number);
    const jaExiste = atual.length > 0;
    let novos;
    if(!jaExiste){
      // primeira vez: começa com todos os dias e remove o clicado
      novos = [0,1,2,3,4,5,6].filter(d=>d!==dia);
    } else {
      novos = atual.includes(dia) ? atual.filter(d=>d!==dia) : [...atual, dia].sort();
    }
    // remove entradas antigas de _dias_ e insere as novas
    const { error: delErr } = await supabaseClient.from('horarios_disponiveis')
      .delete().eq('empresa_id', emp.id).eq('mes', '_dias_');
    if(delErr){ toast(friendlyError(delErr,'Erro ao salvar dias. Tente novamente.'),'err'); return; }

      const { error } = await supabaseClient.from('horarios_disponiveis').insert(rows);
      if(error){ toast(friendlyError(error,'Erro ao salvar dias. Tente novamente.'),'err'); return; }

    toast('Informações salvas!','ok');
    draw();
  };

  function validarConverterWhatsapp(val){
    let d = val.replace(/\D/g,'');
    if(d.startsWith('55') && d.length > 11) d = d.slice(2);
    if(d.startsWith('0')) d = d.slice(1);
    if(d.length !== 11 || d[2] !== '9') return null;
    return 'https://wa.me/55' + d;
  }
  window.atualizarCampoBotao = (tipoId, linkId, hintId)=>{
    const tipo = document.getElementById(tipoId)?.value;
    const inp  = document.getElementById(linkId);
    const hint = document.getElementById(hintId);
    if(!inp) return;
    if(tipo === 'whatsapp'){
      inp.placeholder = '(xx) xxxxx-xxxx';
      inp.type = 'tel'; inp.inputMode = 'numeric'; inp.maxLength = 16;
      inp.oninput = ()=>window.maskTel(inp);
    } else {
      inp.placeholder = tipo === 'telefone' ? 'tel:+5511999999999' : 'https://...';
      inp.type = 'text'; inp.inputMode = ''; inp.maxLength = 500;
      inp.oninput = null; inp.removeAttribute('oninput');
      if(hint) hint.style.display = 'none';
    }
  };
  window.iniciarNovoBotao  = ()=>{ novoBotaoState = {}; editandoBotaoId = null; draw(); };
  window.cancelarNovoBotao = ()=>{ novoBotaoState = null; draw(); };
  window.editarBotao       = (id)=>{ editandoBotaoId = id; novoBotaoState = null; draw(); };
  window.cancelarEdicaoBotao = ()=>{ editandoBotaoId = null; draw(); };
  window.salvarEdicaoBotao = async (id)=>{
    const tipo = document.getElementById('ebTipo').value;
    const nome = LABEL_POR_TIPO[tipo] || tipo;
    let link   = document.getElementById('ebLink').value.trim();
    if(!link){ toast('Preencha o link do botão.','err'); return; }
    if(tipo === 'whatsapp'){
      const convertido = validarConverterWhatsapp(link);
      if(!convertido){
        const hint = document.getElementById('ebLinkHint');
        if(hint) hint.style.display = 'block';
        return;
      }
      link = convertido;
    } else if(!/^(https?:|tel:|mailto:)/i.test(link)){
      toast('O link deve começar com https://, http://, tel: ou mailto:','err'); return;
    }
    const existingB = emp.botoes.find(x=>x.id===id);
    const { error } = await supabaseClient.from('botoes_empresa').update({
      nome, tipo, link, icone: '', abrir_nova_aba: true
    }).eq('id', id);
    if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    Object.assign(existingB, { nome, tipo, link, icone: '', abrirNovaAba: true });

    draw();
  };

  window.salvarNovoBotao = async ()=>{
    const tipo = document.getElementById('bTipo').value;
    const nome = LABEL_POR_TIPO[tipo] || tipo;
    let link   = document.getElementById('bLink').value.trim();
    if(!link){ toast('Preencha o link do botão.','err'); return; }
    if(tipo === 'whatsapp'){
      const convertido = validarConverterWhatsapp(link);
      if(!convertido){
        const hint = document.getElementById('bLinkHint');
        if(hint) hint.style.display = 'block';
        return;
      }
      link = convertido;
    } else if(!/^(https?:|tel:|mailto:)/i.test(link)){
      toast('O link deve começar com https://, http://, tel: ou mailto:','err'); return;
    }
    const ordemMax = emp.botoes.length > 0 ? Math.max(...emp.botoes.map(b=>b.ordem)) + 1 : 0;
    const { data: row, error } = await supabaseClient.from('botoes_empresa').insert({
      empresa_id:    emp.id,
      nome, tipo, link,
      icone:         '',
      ordem:         ordemMax,
      ativo:         true,
      abrir_nova_aba: true
    }).select().single();

    emp.botoes.push({ id:row.id, nome:row.nome, tipo:row.tipo, link:row.link,
      icone:row.icone, ordem:row.ordem, ativo:row.ativo, abrirNovaAba:row.abrir_nova_aba });
    emp.botoes.sort((a,b)=>a.ordem-b.ordem);
    novoBotaoState = null;
    draw();
  };

  window.removerBotao = async (id)=>{
    if(!confirm('Remover este botão?')) return;
    const { error } = await supabaseClient.from('botoes_empresa').delete().eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao remover botão. Tente novamente.'),'err'); return; }
    emp.botoes = emp.botoes.filter(b=>b.id!==id);
    draw();
  };

  let _dragFromId = null;
  window.dragBotaoStart = (e, id)=>{
    _dragFromId = id;
    e.currentTarget.style.opacity = '0.4';
    e.dataTransfer.effectAllowed = 'move';
  };
  window.dragBotaoOver = (e)=>{
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  };
  window.dragBotaoEnd = (e)=>{
    e.currentTarget.style.opacity = '';
  };
  window.dragBotaoDrop = async (e, toId)=>{
    e.preventDefault();
    if(!_dragFromId || _dragFromId === toId) return;
    const fromIdx = emp.botoes.findIndex(b=>b.id===_dragFromId);
    const toIdx   = emp.botoes.findIndex(b=>b.id===toId);
    if(fromIdx < 0 || toIdx < 0) return;
    const moved = emp.botoes.splice(fromIdx, 1)[0];
    emp.botoes.splice(toIdx, 0, moved);
    emp.botoes.forEach((b, i) => b.ordem = i);
    _dragFromId = null;
    await Promise.all(emp.botoes.map(b =>
      supabaseClient.from('botoes_empresa').update({ ordem: b.ordem }).eq('id', b.id)
    ));

  };

    const url = location.origin + '/' + emp.slug;
    if(navigator.share){
      try{ await navigator.share({ title: emp.nome, url }); } catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(url); toast('Link copiado!','ok'); }
      catch(e){ prompt('Copie o link abaixo:', url); }
    }
  };

  draw();
  iniciarPolling(()=>{
    // Reaponta para o objeto novo criado pelo loadData()
    const atual = empresas.find(e => e.slug === emp.slug);
    if(atual) emp = atual;
    // Não redesenha se houver formulário aberto (evita apagar campos em edição)
    const formAberto = editandoId !== null || novoAgState !== null || novoBotaoState !== null || editandoBotaoId !== null || _gFinModal !== null;
    if(!formAberto && (corner===null || corner==='dashboard')) draw();
  });
}

window.tentarLoginMaster = async ()=>{
  const email = (document.getElementById('masterEmail').value || '').trim();
  const senha = document.getElementById('masterPass').value;
  if(!email || !senha){ toast('Preencha e-mail e senha.','err'); return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){ toast('E-mail ou senha incorretos.','err'); return; }

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
  if(!profile || profile.role !== 'master' || profile.status !== 'ativo'){
    await supabaseClient.auth.signOut();
    toast('Essa conta não tem acesso ao painel master.','err');
    return;
  }

  currentUser    = data.user;
  currentProfile = profile;
  renderMasterPanel();
};

function finStatusInfo(reg){
  if(!reg) return { label:'Sem dados', cor:'#9e9e9e', bg:'#f5f5f5' };
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth(); // 0-based
  const diaHoje = hoje.getDate();
  const dia = reg.dia_vencimento;
  // Verificar se pagou no mês atual
  if(reg.pago_em){
    const mesStr = `${ano}-${String(mes+1).padStart(2,'0')}`;
    if(reg.pago_em.slice(0,7) === mesStr){
      return { label:'Pago', cor:'#2e7d32', bg:'#e8f5e9' };
    }
  }
  // Vencido: já passou o dia de vencimento este mês e não pagou
  if(diaHoje > dia){
    return { label:'Vencido', cor:'#c62828', bg:'#ffebee' };
  }
  // A vencer: faltam 7 dias ou menos
  if(dia - diaHoje <= 7){
    return { label:`Vence em ${dia - diaHoje === 0 ? 'hoje' : (dia - diaHoje) + ' dia(s)'}`, cor:'#e65100', bg:'#fff3e0' };
  }
  return { label:'Em dia', cor:'#2e7d32', bg:'#e8f5e9' };
}

  `;

  function drawMasterShell(conteudo){
    const navItems = MASTER_NAV.map(n=>`
      <button class="master-bn-item ${masterAba===n.id?'active':''}" onclick="masterIrAba('${n.id}')">
        <span class="master-bn-ico">${n.ico}</span>

    render(`
      ${SIDEBAR_CSS}
      <div style="position:sticky;top:0;z-index:300;">
        <div class="master-topbar">
          <div class="brand">Agenda+ · Master</div>
        </div>
      </div>
      <div class="master-layout">
        <nav class="master-bottom-nav">
          ${navItems}
          <button class="master-bn-item" onclick="masterLogout()">
            <span class="master-bn-ico">${M_ICO.sair}</span>
            <span>Sair</span>
          </button>
        </nav>
        <div class="master-content">
          ${conteudo}
        </div>
      </div>
    `);

  function draw(){
    if(masterAba === 'dashboard') drawDashboard();
    else if(masterAba === 'empresas') drawEmpresas();
    else if(masterAba === 'financeiro') drawFinanceiro();
  }

  function drawDashboard(){
    const total = empresas.length;
    const ativas = empresas.filter(e=>!e.bloqueada).length;
    const bloqueadas = empresas.filter(e=>e.bloqueada).length;

    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = hoje.getMonth();

    let vencendo = 0, vencidas = 0, pagas = 0;
    let fatEsperado = 0, fatConfirmado = 0, fatAberto = 0;

    empresas.forEach(e => {
      const reg = financeiroData.find(f=>f.empresa_id===e.id);
      if(reg){
        fatEsperado += parseFloat(reg.valor||0);
        const info = finStatusInfo(reg);
        if(info.label === 'Pago'){ pagas++; fatConfirmado += parseFloat(reg.valor||0); }
        else if(info.label === 'Vencido'){ vencidas++; fatAberto += parseFloat(reg.valor||0); }
        else if(info.label.startsWith('Vence')){ vencendo++; fatAberto += parseFloat(reg.valor||0); }
        else { fatAberto += parseFloat(reg.valor||0); }
      }
    });

    const fmt = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

    const alertas = [];
    empresas.forEach(e => {
      const reg = financeiroData.find(f=>f.empresa_id===e.id);
      if(!reg) return;
      const info = finStatusInfo(reg);
      if(info.label === 'Vencido' || info.label.startsWith('Vence')){
        alertas.push({ nome: e.nome, info });
      }
    });

    const listaAlertas = alertas.length ? alertas.map(a=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);">
        <span style="font-size:14px;font-weight:600;">${escapeHtml(a.nome)}</span>
        <span class="fin-status" style="color:${a.info.cor};background:${a.info.bg};">${a.info.label}</span>
      </div>
    `).join('') : `<p class="muted">Nenhum alerta no momento.</p>`;

    drawMasterShell(`
      <h2 class="display" style="margin:0 0 20px;">Visão geral</h2>
      <div class="dash-cards">
        <div class="dash-card">
          <div class="dash-card-val">${total}</div>
          <div class="dash-card-label">Total de empresas</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#2e7d32;">${ativas}</div>
          <div class="dash-card-label">Ativas</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#c62828;">${bloqueadas}</div>
          <div class="dash-card-label">Bloqueadas</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#2e7d32;">${pagas}</div>
          <div class="dash-card-label">Pagas este mês</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#c62828;">${vencidas}</div>
          <div class="dash-card-label">Inadimplentes</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#e65100;">${vencendo}</div>
          <div class="dash-card-label">Vencendo em breve</div>
        </div>
      </div>
      <div class="dash-cards">
        <div class="dash-card">
          <div class="dash-card-val">${fmt(fatEsperado)}</div>
          <div class="dash-card-label">Faturamento esperado</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#2e7d32;">${fmt(fatConfirmado)}</div>
          <div class="dash-card-label">Confirmado</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-val" style="color:#c62828;">${fmt(fatAberto)}</div>
          <div class="dash-card-label">Em aberto</div>
        </div>
      </div>
      ${alertas.length ? `
        <div class="card">
          <h3 class="display" style="margin:0 0 4px;">Atenção necessária</h3>
          <div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">${alertas.length} empresa(s) precisam de ação</div>
          ${listaAlertas}
        </div>
      ` : ''}
    `);
  }

  function drawEmpresas(){
    const editing = editingSlug ? empresas.find(e=>e.slug===editingSlug) : null;
    const form = editing ? `
      <div class="card" style="margin-bottom:24px;">
        <h3 class="display">Editar empresa</h3>
        <div class="field"><label>Nome</label><input value="${escapeAttr(editing.nome)}" onchange="masterUpd('nome',this.value)"/></div>
        <div class="field"><label>WhatsApp</label><input type="tel" inputmode="numeric" maxlength="16" value="${escapeAttr(fmtTelStr(editing.whatsapp))}" oninput="maskTel(this);masterUpd('whatsapp',this.value)"/></div>
        <div class="field">
          <label>Link público</label>
          <input readonly value="${escapeAttr(location.origin+'/'+editing.slug)}" onclick="this.select()"/>
        </div>
        <div class="field">
          <label>E-mail do gestor</label>
