  const NOTA_CORES = { amarelo:'#fef9c3', azul:'#dbeafe', rosa:'#fce7f3', verde:'#dcfce7' };

  function dashboardBody(){
    const agora    = new Date();
    const hoje     = isoData(agora);
    const mesStr   = hoje.slice(0,7);
    const horaAgora= agora.getHours().toString().padStart(2,'0')+':'+agora.getMinutes().toString().padStart(2,'0');
    const ags     = agendamentos.filter(a => a.slug === emp.slug);
    const agsHoje = ags.filter(a => a.data === hoje).sort((a,b)=>a.hora.localeCompare(b.hora));
    const agHoje  = agsHoje.length;

    // Próximo atendimento
    const prox    = agsHoje.find(a => a.hora >= horaAgora);
    const proxVal = prox ? prox.hora.slice(0,5) : '--:--';

    // Faturamento de hoje
    const fatHoje = _gFinLancamentos.filter(l=>l.tipo==='receita' && l.data===hoje)
                                    .reduce((s,l)=>s+parseFloat(l.valor||0),0);

    const fatMes = _gFinLancamentos.filter(l=>l.tipo==='receita' && l.data.startsWith(mesStr))
                                   .reduce((s,l)=>s+parseFloat(l.valor||0),0);

    // Clientes já atendidos no mês
    const atendidosMes = ags.filter(a => a.data.startsWith(mesStr)
      && (a.data < hoje || (a.data === hoje && a.hora < horaAgora))).length;

    const saudacao = agora.getHours() < 12 ? 'Bom dia' : agora.getHours() < 18 ? 'Boa tarde' : 'Boa noite';
    const dataFmt  = agora.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})
                          .replace(/^./, c=>c.toUpperCase());

    const ICO_CAL2 = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
    const ICO_CLK  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>`;
    const ICO_CASH = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><line x1="6" y1="12" x2="6.01" y2="12"/><line x1="18" y1="12" x2="18.01" y2="12"/></svg>`;
    const ICO_USRS = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;

    const card = (area, icoBg, ico, label, val) => `
      <div class="g-dash-card" style="grid-area:${area};">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="g-dash-ico" style="background:${icoBg};">${ico}</div>
          <div class="g-dash-label">${label}</div>
        </div>
        <div class="g-dash-val">${val}</div>
      </div>`;

    // Agenda de hoje (metade da largura)
    const agendaRows = agsHoje.length
      ? agsHoje.map(a=>{
          const passou = a.hora < horaAgora;
          const ehProx = prox && a.id === prox.id;
          return `<div class="g-ag-row" style="${passou?'opacity:.45;':''}">
            <div style="display:flex;align-items:baseline;gap:7px;">
              <span class="g-ag-hora">${a.hora.slice(0,5)}</span>
              <span class="g-ag-nome" style="${ehProx?'font-weight:700;':''}">${escapeHtml(a.nome)}</span>
            </div>
            <div class="g-ag-serv">${escapeHtml(a.servicoNome||'')}</div>
          </div>`;
        }).join('')
      : `<div style="font-size:12px;color:#8e8e93;padding:10px 0;">Nenhum agendamento hoje.</div>`;

    // Bloco de notas
    const notasHtml = _notas.length
      ? _notas.map(n=>`
          <div class="g-nota" style="background:${NOTA_CORES[n.cor]||NOTA_CORES.amarelo};">
            <span class="g-nota-txt">${escapeHtml(n.texto)}</span>
            <button class="g-nota-x" onclick="removerNota('${n.id}')" title="Excluir">&times;</button>
          </div>`).join('')
      : `<div style="font-size:12px;color:#8e8e93;padding:6px 0;">Nenhuma anotação ainda.</div>`;

    // Modal de nova nota
    const notaModalHtml = (()=>{
      if(!_notaModal) return '';
      const m = _notaModal;
      const swatches = Object.entries(NOTA_CORES).map(([k,hex])=>`
        <div onclick="setNotaCor('${k}')" style="width:30px;height:30px;border-radius:8px;background:${hex};cursor:pointer;border:2px solid ${m.cor===k?'#1a1a1a':'transparent'};"></div>`).join('');
      return `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this) fecharNota()">
          <div style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.18);">
            <div style="font-weight:700;font-size:16px;margin-bottom:14px;">${m.editId?'Editar anotação':'Nova anotação'}</div>
            <div class="field">
              <label>Anotação</label>
              <textarea id="notaTexto" rows="4" style="resize:vertical;min-height:90px;" placeholder="Escreva sua anotação">${escapeHtml(m.texto||'')}</textarea>
            </div>
            <div class="field">
              <label>Cor</label>
              <div style="display:flex;gap:8px;margin-top:4px;">${swatches}</div>
            </div>
            <div class="row" style="margin-top:16px;">
              <button class="btn ghost" onclick="fecharNota()">Cancelar</button>
              <button class="btn" onclick="salvarNota()">Salvar</button>
            </div>
          </div>
        </div>`;
    })();

    return `
      <div class="g-dash-root">
        <div>
          <div style="font-size:19px;font-weight:800;color:#1a1a1a;letter-spacing:-.02em;">${saudacao}, ${escapeHtml(emp.nome)}</div>
          <div style="font-size:12px;color:#8e8e93;margin-top:2px;">${dataFmt}</div>
        </div>

        <div class="g-dash-grid">
          ${card('prox',  '#fff7ed', ICO_CLK,  'Próximo<br>atendimento', proxVal)}
          ${card('agend', '#eff6ff', ICO_CAL2, 'Agendamentos<br>hoje', agHoje)}

          <div class="g-dash-panel g-dash-agenda">
            <div class="g-dash-ttl" style="margin-bottom:5px;">Agenda de hoje</div>
            <div class="g-dash-agenda-list">${agendaRows}</div>
            <button onclick="setCorner(null)" style="margin-top:7px;padding:7px 0 0;border:none;border-top:0.5px solid #f4f4f5;background:none;font-family:inherit;font-size:11px;color:#8e8e93;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:3px;width:100%;flex-shrink:0;">Ver completa &#8250;</button>
          </div>

          ${card('fat', '#f0fdf4', ICO_CASH, 'Faturamento<br>hoje', gFinFmtMoeda(fatHoje))}
          ${card('cli', '#faf5ff', ICO_USRS, 'Clientes atendidos<br>este mês', atendidosMes)}
          ${card('fatmes', '#ecfdf5', ICO_CASH, 'Faturamento<br>este mês', gFinFmtMoeda(fatMes))}

          <div class="g-dash-panel g-dash-notas">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-shrink:0;">
              <div class="g-dash-ttl">Bloco de notas</div>
              <button onclick="novaNota()" style="background:none;border:none;font-family:inherit;font-size:11px;color:#3b82f6;font-weight:700;cursor:pointer;padding:0;">+ Nova</button>
            </div>
            <div class="g-dash-notas-list">${notasHtml}</div>
          </div>
        </div>
      </div>

      ${notaModalHtml}
    `;
  }

  // ── Financeiro (gestão) ──

  async function gFinCarregar(){
    if(_gFinCarregando) return;
    _gFinCarregando = true;
    const { data, error } = await supabaseClient
      .from('lancamentos_financeiros')
      .select('*')
      .eq('empresa_id', emp.id)
      .order('data', { ascending: false })
      .order('criado_em', { ascending: false });
    _gFinCarregando = false;
    if(!error && data){
      _gFinLancamentos = data;
      const lsKey = 'gfin_lancados_'+emp.id;
      const saved = JSON.parse(localStorage.getItem(lsKey)||'[]');
      saved.forEach(id=>_gFinAgLancados.add(id));
      data.filter(l=>l.agendamento_id).forEach(l=>_gFinAgLancados.add(l.agendamento_id));
      localStorage.setItem(lsKey, JSON.stringify([..._gFinAgLancados]));
    }
    if(corner === 'financeiro' || corner === 'dashboard') draw();
  }

  // ── Bloco de notas (dashboard) ──

  async function carregarNotas(){
    if(_notasCarregando) return;
    _notasCarregando = true;
    const { data, error } = await supabaseClient
      .from('notas')
      .select('*')
      .eq('empresa_id', emp.id)
      .order('criado_em', { ascending: false });
    _notasCarregando = false;
    if(!error && data) _notas = data;
    if(corner === 'dashboard') draw();
  }

  window.novaNota   = ()=>{ _notaModal = { texto:'', cor:'amarelo' }; draw(); };
  window.fecharNota = ()=>{ _notaModal = null; draw(); };
  window.setNotaCor = (cor)=>{
    if(!_notaModal) return;
    const el = document.getElementById('notaTexto');
    if(el) _notaModal.texto = el.value;
    _notaModal.cor = cor;
    draw();
  };

  window.salvarNota = async ()=>{
    if(!_notaModal) return;
    const texto = (document.getElementById('notaTexto')?.value || '').trim();
    if(!texto){ toast('Escreva alguma coisa na anotação.','err'); return; }
    const cor = _notaModal.cor || 'amarelo';
    _notaModal = null; draw();
    const { error } = await supabaseClient.from('notas')
      .insert({ empresa_id: emp.id, texto, cor });
    if(error){ toast(friendlyError(error,'Erro ao salvar anotação.'),'err'); return; }
    toast('Anotação salva!','ok');
    await carregarNotas();
  };

  window.removerNota = async (id)=>{
    const { error } = await supabaseClient.from('notas').delete().eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao excluir anotação.'),'err'); return; }
    _notas = _notas.filter(n=>n.id !== id);
    draw();
  };

  function gFinFmtMoeda(v){ return 'R$ ' + parseFloat(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }

  function gFinDataLabel(){
    if(_gFinPeriodo==='dia'){
      const d = new Date(_gFinData+'T00:00:00');
      const hoje = isoData(new Date());
      if(_gFinData===hoje) return 'Hoje, '+d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
      const s = d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
      return s.charAt(0).toUpperCase()+s.slice(1);
    } else {
      const [y,m] = _gFinData.split('-');
      return new Date(parseInt(y),parseInt(m)-1,1).toLocaleString('pt-BR',{month:'long',year:'numeric'}).replace(' de ',' / ');
    }
  }

  function gFinNavegar(dir){
    if(_gFinPeriodo==='dia'){
      const d = new Date(_gFinData+'T00:00:00');
      d.setDate(d.getDate()+dir);
      _gFinData = isoData(d);
    } else {
      const [y,m] = _gFinData.split('-').map(Number);
      const d = new Date(y, m-1+dir, 1);
      _gFinData = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    }
    gFinCarregar();
  }
  window.gFinNavegar = gFinNavegar;

  window.gFinSetPeriodo = (p)=>{
    _gFinPeriodo = p;
    if(p==='dia') _gFinData = isoData(new Date());
    else _gFinData = isoData(new Date()).slice(0,7);
    gFinCarregar();
  };

  function gFinLancamentosFiltrados(){
    return _gFinLancamentos.filter(l=>{
      if(_gFinPeriodo==='dia') return l.data === _gFinData;
      return l.data.startsWith(_gFinData);
    });
  }

  function gFinPendentes(){
    const agora = new Date();
    const hoje = isoData(agora);
    const horaAgora = agora.getHours().toString().padStart(2,'0')+':'+agora.getMinutes().toString().padStart(2,'0');
    return agendamentos.filter(a=>{
      if(a.slug !== emp.slug) return false;
      if(_gFinAgLancados.has(a.id)) return false;
      if(a.data > hoje) return false;
      if(a.data === hoje) return a.hora.slice(0,5) <= horaAgora;
      return true;
    }).sort((a,b)=> (b.data+b.hora).localeCompare(a.data+a.hora));
  }

  function financeiroBody(){
    const todosPeriodo = gFinLancamentosFiltrados();
    const receita = todosPeriodo.filter(l=>l.tipo==='receita').reduce((s,l)=>s+parseFloat(l.valor||0),0);
    const despesa = todosPeriodo.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+parseFloat(l.valor||0),0);
    const saldo   = receita - despesa;
    const pendentes = gFinPendentes();

    const lancamentos = todosPeriodo.filter(l=>{
      if(_gFinFiltro==='entradas') return l.tipo==='receita';
      if(_gFinFiltro==='saidas')   return l.tipo==='despesa';
      return true;
    });

    const ICO_UP   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`;
    const ICO_DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>`;
    const ICO_LEFT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="15 18 9 12 15 6"/></svg>`;
    const ICO_RIGHT= `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="9 18 15 12 9 6"/></svg>`;
    const ICO_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
    const ICO_TRASH= `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;

    const CS = 'font-family:Nunito,sans-serif;cursor:pointer;';

    const modalHtml = _gFinModal ? (()=>{
      const m = _gFinModal;
      const isEdit = !!m.editId;
      const titulo = isEdit ? 'Editar lançamento' : (m.tipo==='receita' ? 'Nova Receita' : 'Nova Despesa');
      const corBtn = m.tipo==='receita' ? '#2d6a47' : '#a3423a';
      const agModal = m.agId ? agendamentos.find(a=>a.id===m.agId) : null;
      const svcModal = agModal?.servicoNome || '';
      const svcHtml = svcModal ? `<div class="field"><label>Serviço</label><div style="padding:12px 14px;border-radius:10px;border:1.5px solid #e0e0e0;background:#f7f7f7;font-size:15px;color:#555;">${escapeHtml(svcModal)}</div></div>` : '';
      return `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;display:flex;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)gFinFecharModal()">
        <div style="background:#fff;border-radius:18px 18px 0 0;padding:28px 24px 40px;width:100%;max-width:520px;">
          <h3 style="${CS}font-weight:700;font-size:18px;margin:0 0 20px;">${titulo}</h3>
          <div class="field"><label>Descrição</label><input id="gfin-desc" type="text" value="${escapeHtml(m.descricao||'')}" placeholder="Ex: Coloracao raiz"></div>
          ${svcHtml}
          <div class="field"><label>Valor (R$)</label><input id="gfin-val" type="number" min="0" step="0.01" value="${escapeHtml(m.valor||'')}" placeholder="0,00"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
            <button class="btn ghost" onclick="gFinFecharModal()">Cancelar</button>
            <button class="btn" style="background:${corBtn};" onclick="gFinSalvar()">Salvar</button>
          </div>
        </div>
      </div>`;
    })() : '';

    const pendentesHtml = pendentes.length===0 ? '' : `
      <div style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;">Pendentes</div>
      ${pendentes.map(a=>{
        const svcNome = a.servicoNome || '';
        const horario = a.hora ? a.hora.slice(0,5) : '';
        const dataFmt = new Date(a.data+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
        return `<div style="background:#fff;border:0.5px solid #eee;border-left:4px solid #FFA500;border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(a.nome||'')}</div>
            <div style="font-size:11px;color:#aaa;margin-top:2px;">${escapeHtml(svcNome)}${horario?' · '+dataFmt+' '+horario:''}</div>
          </div>
          <button onclick="gFinAbrirModalPendente('${a.id}')" style="${CS}background:#fff;color:#FFA500;border:1px solid #FFA500;border-radius:7px;padding:7px 12px;font-size:11px;font-weight:700;flex-shrink:0;">Lançar</button>
        </div>`;
      }).join('')}`;

    const lancamentosHtml = lancamentos.length===0
      ? `<div style="text-align:center;padding:28px 20px;color:#aaa;font-size:13px;">Nenhum lançamento neste período</div>`
      : lancamentos.map(l=>{
          const isIn   = l.tipo==='receita';
          const bordClr= isIn ? '#008000' : '#FF0000';
          const valClr = isIn ? '#008000' : '#FF0000';
          const ag     = l.agendamento_id ? agendamentos.find(a=>a.id===l.agendamento_id) : null;
          const dataFmt= new Date(l.data+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
          const horario = ag?.hora ? ' · '+ag.hora.slice(0,5) : '';
          const svcMeta = ag?.servicoNome ? ag.servicoNome+' · ' : '';
          const meta   = ag ? `${svcMeta}${dataFmt}${horario}` : dataFmt;
          const lid    = escapeHtml(l.id);
          return `<div style="background:#fff;border:0.5px solid #eee;border-left:4px solid ${bordClr};border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(l.descricao)}</div>
              <div style="font-size:11px;color:#aaa;margin-top:2px;">${escapeHtml(meta)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
              <div style="font-size:13px;font-weight:400;color:${valClr};font-variant-numeric:tabular-nums;">${isIn?'+':'-'}${gFinFmtMoeda(l.valor)}</div>
              <div style="display:flex;gap:3px;">
                <button onclick="gFinEditarLanc('${lid}')" style="${CS}width:26px;height:26px;border-radius:6px;border:none;background:none;color:#1a1a1a;display:flex;align-items:center;justify-content:center;">${ICO_EDIT}</button>
                <button onclick="gFinExcluir('${lid}')" style="${CS}width:26px;height:26px;border-radius:6px;border:none;background:none;color:#1a1a1a;display:flex;align-items:center;justify-content:center;">${ICO_TRASH}</button>
              </div>
            </div>
          </div>`;
        }).join('');

    const filtroLabel = {todos:'Todos',entradas:'Entradas',saidas:'Saídas'};
    const filtros = ['todos','entradas','saidas'].map(f=>`
      <div onclick="gFinSetFiltro('${f}')" style="${CS}padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;
        color:${_gFinFiltro===f?'#1a1a1a':'#888'};
        background:${_gFinFiltro===f?'#fff':'transparent'};
        box-shadow:${_gFinFiltro===f?'0 1px 4px rgba(0,0,0,0.10)':'none'};">
        ${filtroLabel[f]}
      </div>`).join('');

    return `
      ${modalHtml}
      <div style="background:#e8e8e8;border-radius:8px;padding:3px;display:flex;margin-bottom:14px;">
        ${['dia','mes'].map(p=>`<button onclick="gFinSetPeriodo('${p}')" style="${CS}flex:1;padding:6px;border-radius:6px;border:none;font-size:13px;font-weight:700;
          background:${_gFinPeriodo===p?'#fff':'transparent'};color:${_gFinPeriodo===p?'#1a1a1a':'#888'};
          box-shadow:${_gFinPeriodo===p?'0 1px 4px rgba(0,0,0,0.12)':'none'};">${p==='dia'?'Dia':'Mês'}</button>`).join('')}
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:12px;font-weight:600;color:#555;">${gFinDataLabel()}</span>
        <div style="display:flex;gap:4px;">
          <button onclick="gFinNavegar(-1)" style="${CS}background:#fff;border:0.5px solid #e0e0e0;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${ICO_LEFT}</button>
          <button onclick="gFinNavegar(1)"  style="${CS}background:#fff;border:0.5px solid #e0e0e0;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${ICO_RIGHT}</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;grid-auto-rows:44px;">
        <div style="background:#fff;border:0.5px solid #eee;border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#008000;margin-bottom:1px;">Receitas</div>
          <div style="font-size:15px;font-weight:700;color:#008000;font-variant-numeric:tabular-nums;">${gFinFmtMoeda(receita)}</div>
        </div>
        <div style="background:#fff;border:0.5px solid #eee;border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#FF0000;margin-bottom:1px;">Despesas</div>
          <div style="font-size:15px;font-weight:700;color:#FF0000;font-variant-numeric:tabular-nums;">${gFinFmtMoeda(despesa)}</div>
        </div>
        <div style="background:#fff;border:0.5px solid #eee;border-radius:9px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;">
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#1a1a1a;margin-bottom:1px;">Saldo ${_gFinPeriodo==='dia'?'do dia':'do mês'}</div>
          <div style="font-size:15px;font-weight:700;color:#1a1a1a;font-variant-numeric:tabular-nums;">${gFinFmtMoeda(saldo)}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button onclick="gFinAbrirModal('receita')" style="${CS}flex:1;border:1px solid #86efac;border-radius:7px;background:#f0fdf4;color:#16a34a;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:3px;min-height:0;transition:background 160ms ease;">+ Receita</button>
          <button onclick="gFinAbrirModal('despesa')" style="${CS}flex:1;border:1px solid #fca5a5;border-radius:7px;background:#fff;color:#dc2626;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:3px;min-height:0;transition:background 160ms ease;">+ Despesa</button>
        </div>
      </div>

      ${pendentesHtml}

      <div style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;">Lançamentos</div>
      <div style="display:inline-flex;background:#f0f0f0;border-radius:999px;padding:3px;gap:2px;margin-bottom:12px;">${filtros}</div>
      ${lancamentosHtml}
    `;
  }

  window.gFinSetFiltro = (f)=>{ _gFinFiltro=f; draw(); };

  window.gFinAbrirModal = (tipo)=>{
    _gFinModal = { tipo, agId: null, descricao: '', valor: '', editId: null };
    draw();
  };

  window.gFinEditarLanc = (id)=>{
    const l = _gFinLancamentos.find(x=>x.id===id);
    if(!l) return;
    _gFinModal = { tipo: l.tipo, agId: l.agendamento_id||null, descricao: l.descricao, valor: String(l.valor), editId: id };
    draw();
  };

  window.gFinExcluir = async (id)=>{
    if(!confirm('Excluir este lancamento?')) return;
    const { error } = await supabaseClient.from('lancamentos_financeiros').delete().eq('id', id);
    if(error){ toast('Erro ao excluir.','err'); return; }
    toast('Lancamento removido.','ok');
    await gFinCarregar();
  };

  window.gFinAbrirModalPendente = (agId)=>{
    const ag = agendamentos.find(a=>a.id===agId);
    if(!ag) return;
    const svc = emp.servicos.find(s=>s.id===ag.servicoId);
    _gFinModal = { tipo:'receita', agId, descricao: ag.nome||'', valor: svc?.preco ? String(svc.preco) : '' };
    draw();
  };

  window.gFinFecharModal = ()=>{ _gFinModal=null; draw(); };

  window.gFinSalvar = async ()=>{
    const descEl = document.getElementById('gfin-desc');
    const valEl  = document.getElementById('gfin-val');
    const desc = descEl?.value?.trim();
    const val  = parseFloat(valEl?.value);
    if(!desc){ toast('Informe uma descricao.','err'); return; }
    if(isNaN(val)||val<=0){ toast('Informe um valor valido.','err'); return; }
    const m = _gFinModal;
    _gFinModal = null;
    let error;
    if(m.editId){
      ({ error } = await supabaseClient.from('lancamentos_financeiros').update({ descricao: desc, valor: val }).eq('id', m.editId));
    } else {
      const dataLanc = _gFinPeriodo==='dia' ? _gFinData : isoData(new Date());
      const payload = { empresa_id: emp.id, tipo: m.tipo, descricao: desc, valor: val, data: dataLanc };
      if(m.agId) payload.agendamento_id = m.agId;
      ({ error } = await supabaseClient.from('lancamentos_financeiros').insert(payload));
      if(!error && m.agId){
        _gFinAgLancados.add(m.agId);
        localStorage.setItem('gfin_lancados_'+emp.id, JSON.stringify([..._gFinAgLancados]));
      }
    }
    if(error){ toast('Erro ao salvar: '+error.message,'err'); _gFinModal=m; draw(); return; }
    toast('Lancamento salvo!','ok');
    await gFinCarregar();
  };

  function draw(){
    const isMaster = currentProfile?.role === 'master';
    const exitAction = isMaster
      ? `goto({empresa:'${emp.slug}'})`
      : `gestaoLogout('${emp.slug}')`;
    const exitLabel = isMaster ? 'Voltar' : 'Sair';
    const exitIco   = isMaster ? G_ICO.voltar : G_ICO.sair;

    const navItems = GESTAO_NAV.map(n => `
      <button class="g-bn-item ${corner===n.id?'active':''}" onclick="setCorner(${n.id===null?'null':`'${n.id}'`})">
        <span class="g-bn-ico">${n.ico}</span>
        <span>${n.label}</span>
      </button>`).join('');

    const body = corner==='dashboard'    ? dashboardBody()
               : corner==='configurar'   ? configurarBody()
               : corner==='financeiro'   ? financeiroBody()
               : agendamentosBody();

    const cardStyle = (corner==='configurar' || corner==='financeiro' || corner==='dashboard') ? 'background:none;box-shadow:none;padding:0;' : '';


    render(`
      ${GESTAO_CSS}
      <div style="position:sticky;top:0;z-index:300;">
        ${barraVoltarMaster()}
      </div>
      <div class="g-layout ${corner==='dashboard'?'g-dash-mode':''}">
        <nav class="g-bottom-nav">
          ${navItems}
        </nav>
        <div class="g-content">
          <div class="container wide">
            <div class="card" style="${cardStyle}">${body}</div>
          </div>
        </div>
      </div>
    `);
  }

  window.setCorner = (c)=>{
    if(c==='financeiro' && corner!=='financeiro'){
      _gFinData = isoData(new Date()); _gFinPeriodo='dia'; _gFinLancamentos=[]; _gFinModal=null;
      corner=c; editandoId=null; novoAgState=null; configurarSub=null; _removendoServicoIdx=null; _waMenuId=null;
      draw(); gFinCarregar(); return;
    }
    if(c==='dashboard' && corner!=='dashboard'){
      corner=c; editandoId=null; novoAgState=null; configurarSub=null; _removendoServicoIdx=null; _waMenuId=null; _gFinModal=null; _notaModal=null;
      draw();
      if(!_gFinLancamentos.length) gFinCarregar();
      carregarNotas();
      return;
    }
    corner=c; editandoId=null; novoAgState=null; configurarSub=null; _removendoServicoIdx=null; _waMenuId=null; _gFinModal=null; _notaModal=null; _linkMenuAberto=false;
    draw();
    loadData().then(()=>{ const a=empresas.find(e=>e.slug===emp.slug); if(a) emp=a; draw(); });
  };
  window.selecionarDiaGestao = (iso)=>{
    if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
    diaSelecionado=iso; editandoId=null; novoAgState=null; _waMenuId=null; draw();
  };
  window.selecionarImagem = (tipo)=>{
    abrirCrop(tipo, emp.slug, async (url)=>{
      if(tipo==='logo'){ emp.logo = url; } else { emp.fotoUrl = url; }
      // preserva campos digitados antes de re-renderizar
      const _nome = document.getElementById('pNome')?.value; if(_nome!=null) emp.nome = _nome;
      const _desc = document.getElementById('pDescricao')?.value; if(_desc!=null) emp.descricao = _desc;
      const _dest = document.getElementById('pTextoDestaque')?.value; if(_dest!=null) emp.textoDestaque = _dest;
      draw();
    });
  };

  window.bloquearDiaTodo = async ()=>{
    const horarios = horariosDoMes(emp, diaSelecionado.slice(0,7));
    if(!horarios.length){ toast('Nenhum horário configurado para este dia.','err'); return; }
    const naoBloquados = horarios.filter(h=>!((emp.bloqueios||[]).some(b=>b.data===diaSelecionado && b.hora===h)));
    const dataFmtConf = new Date(diaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(!confirm(`Bloquear o dia ${dataFmtConf} inteiro?`)) return;
    if(naoBloquados.length){
      const rows = naoBloquados.map(h=>({ empresa_id: emp.id, data: diaSelecionado, hora: h }));
      const { data, error } = await supabaseClient.from('bloqueios').insert(rows).select();
      if(error){ toast('Erro ao bloquear. Tente novamente.','err'); return; }
      if(data) data.forEach(r=>{ (emp.bloqueios=emp.bloqueios||[]).push({id:r.id, data:r.data, hora:r.hora}); });
    }
    draw();
  };
  window.desbloquearDiaTodo = async ()=>{
    const dataFmtConf = new Date(diaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(!confirm(`Desbloquear o dia ${dataFmtConf} inteiro?`)) return;
    const ids = (emp.bloqueios||[]).filter(b=>b.data===diaSelecionado).map(b=>b.id);
    if(!ids.length){ draw(); return; }
    const { error } = await supabaseClient.from('bloqueios').delete().in('id', ids);
    if(error){ toast('Erro ao desbloquear. Tente novamente.','err'); return; }
    emp.bloqueios = (emp.bloqueios||[]).filter(b=>b.data!==diaSelecionado);
    draw();
  };

  window.novoAgendamento = (data, hora)=>{ novoAgState={data,hora}; editandoId=null; draw(); };
  window.cancelarNovoAg = ()=>{ novoAgState=null; draw(); };
  window.salvarNovoAg = async (data)=>{
    const nome = document.getElementById('novoNome')?.value?.trim();
    const tel  = document.getElementById('novoTel')?.value?.trim();
    const servicoId = document.getElementById('novoServico')?.value;
    const hora = document.getElementById('novoHora')?.value;
    if(!nome||!tel||!servicoId||!hora){ toast('Preencha todos os campos.','err'); return; }
    const telDigits = tel.replace(/\D/g,'').replace(/^0/,'');
    if(telDigits.length !== 11 || telDigits[2] !== '9'){ toast('Telefone inválido. Ex: (11) 98765-4321','err'); return; }
    const telNorm = '0' + telDigits;
    const servico = emp.servicos.find(s=>s.id===servicoId);
    const {data:row, error} = await supabaseClient.from('agendamentos').insert({
      empresa_id: emp.id,
      nome_cliente: nome, telefone: telNorm, servico_id: servicoId, servico_nome: servico?.nome||'',
      data, hora
    }).select().single();
    if(error){ toast(friendlyError(error,'Erro ao agendar.'),'err'); return; }
    agendamentos.push({
      id:row.id, slug:emp.slug,
      nome:row.nome_cliente, telefone:row.telefone,
      servicoId:row.servico_id, servicoNome:row.servico_nome,
      data:row.data, hora:row.hora
    });
    novoAgState=null; draw();
  };
  window.editarAgendamento = (id)=>{ editandoId=id; novoAgState=null; draw(); };
  window.cancelarEdicaoAgendamento = ()=>{ editandoId=null; draw(); };
  window.salvarEdicaoAgendamento = async (id)=>{
    const ag = agendamentos.find(a=>a.id===id);
    const nome = document.getElementById('editNome').value.trim();
    const tel = document.getElementById('editTel').value.trim();
    const servicoId = document.getElementById('editServico').value;
    const hora = document.getElementById('editHora').value;
    if(!nome || !tel){ toast('Preencha nome e telefone.','err'); return; }
    const telDigitos = tel.replace(/\D/g,'').replace(/^(55|0)/,'');
    if(telDigitos.length !== 11 || telDigitos[2] !== '9'){ toast('Telefone inválido. Ex: (11) 98765-4321','err'); return; }
    const telNorm = '0' + telDigitos;
    if(hora !== ag.hora){
      const ocupado = agendamentos.some(a=>a.id!==ag.id && a.slug===emp.slug && a.data===ag.data && a.hora===hora);
      if(ocupado){ toast('Esse horário já está ocupado.','err'); return; }
    }
    const servico = emp.servicos.find(s=>s.id===servicoId);
    const { error } = await supabaseClient.from('agendamentos').update({
      nome_cliente: nome,
      telefone:     telNorm,
      servico_id:   servicoId,
      servico_nome: servico ? servico.nome : ag.servicoNome,
      hora:         hora
    }).eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao salvar agendamento. Tente novamente.'),'err'); return; }
    ag.nome = nome; ag.telefone = telNorm; ag.servicoId = servicoId; ag.servicoNome = servico?servico.nome:ag.servicoNome; ag.hora = hora;
    editandoId = null; draw();
  };
  window.cancelarAgendamento = async (id)=>{
    if(!confirm('Cancelar este agendamento? Essa ação não pode ser desfeita.')) return;
    const { error } = await supabaseClient.from('agendamentos').delete().eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao cancelar agendamento. Tente novamente.'),'err'); return; }
    agendamentos = agendamentos.filter(a=>a.id!==id);
    draw();
  };
  window.bloquearHorario = async (data,hora)=>{
    const { data: row, error } = await supabaseClient.from('bloqueios').insert({
      empresa_id: emp.id, data, hora
    }).select().single();
    if(error){ toast(friendlyError(error,'Erro ao bloquear horário. Tente novamente.'),'err'); return; }
    emp.bloqueios = emp.bloqueios || [];
    emp.bloqueios.push({ id: row.id, data, hora });
    draw();
  };
  window.desbloquearHorario = async (data,hora)=>{
    const { error } = await supabaseClient.from('bloqueios')
      .delete().eq('empresa_id', emp.id).eq('data', data).eq('hora', hora);
    if(error){ toast(friendlyError(error,'Erro ao desbloquear horário. Tente novamente.'),'err'); return; }
    emp.bloqueios = (emp.bloqueios||[]).filter(b=>!(b.data===data && b.hora===hora));
    draw();
  };

  window.adicionarServico = async ()=>{
    const nomeInp = document.getElementById('novoServicoNome');
    const precoInp = document.getElementById('novoServicoPreco');
    const nome = nomeInp ? nomeInp.value.trim() : '';
    const preco = precoInp ? Number(precoInp.value)||0 : 0;
    if(!nome){ toast('Digite o nome do serviço.','err'); return; }
    if(emp.servicos.some(s=>s.nome.toLowerCase()===nome.toLowerCase())){ toast('Já existe um serviço com esse nome.','err'); return; }
    const { data: row, error } = await supabaseClient.from('servicos').insert({
      empresa_id: emp.id, nome, duracao: 60, preco
    }).select().single();
    if(error){ toast(friendlyError(error,'Erro ao adicionar serviço. Tente novamente.'),'err'); return; }
    emp.servicos.push({ id: row.id, nome: row.nome, duracao: row.duracao, preco: Number(row.preco) });
    _novoServicoForm = false;
    draw();
  };
  window.salvarEdicaoServico = async (i)=>{
    const nomeInp = document.getElementById('svcNome_'+i);
    const precoInp = document.getElementById('svcPreco_'+i);
    const nome = nomeInp ? nomeInp.value.trim() : '';
    const preco = precoInp ? Number(precoInp.value)||0 : 0;
    if(!nome){ toast('Digite o nome do serviço.','err'); return; }
    if(emp.servicos.some((s,idx)=>idx!==i && s.nome.toLowerCase()===nome.toLowerCase())){ toast('Já existe um serviço com esse nome.','err'); return; }
    const s = emp.servicos[i];
    const { error } = await supabaseClient.from('servicos').update({ nome, preco }).eq('id', s.id);
    if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    emp.servicos[i] = { ...s, nome, preco };
    _editandoServicoIdx = null;
    draw();
  };
  window.cancelarEdicaoServico = ()=>{ _editandoServicoIdx = null; draw(); };
  window.editarServico = (i)=>{ _editandoServicoIdx = i; _removendoServicoIdx = null; draw(); };
  window.abrirNovoServico = ()=>{ _novoServicoForm = true; _editandoServicoIdx = null; draw(); };
  window.cancelarNovoServico = ()=>{ _novoServicoForm = false; draw(); };
  window.cancelarRemocaoServico = ()=>{ _removendoServicoIdx = null; draw(); };
  window.removeServico = async (i)=>{
    if(_removendoServicoIdx !== i){ _removendoServicoIdx = i; draw(); return; }
    _removendoServicoIdx = null;
    const s = emp.servicos[i];
    const { error } = await supabaseClient.from('servicos').delete().eq('id', s.id);
    if(error){ toast('Erro ao remover serviço. Tente novamente.','err'); return; }
    emp.servicos.splice(i,1);
    draw();
  };
  window.updServico = async (i,field,val)=>{
    const s = emp.servicos[i];
    const dbVal = (field==='duracao'||field==='preco') ? Number(val) : val;
    s[field] = dbVal;
    const { error } = await supabaseClient.from('servicos').update({ [field]: dbVal }).eq('id', s.id);
    if(error) console.error('Erro ao atualizar serviço:', error);
  };

  window.toggleWaMenu = (agId)=>{
    _waMenuId = _waMenuId === agId ? null : agId;
    draw();
  };
  window.waAcao = (agId, tipo, empId)=>{
    const ag = agendamentos.find(a=>a.id===agId);
    if(!ag) return;
    const waNum = '55' + ag.telefone.replace(/\D/g,'').replace(/^0/,'');
    let link;
    if(tipo === 'conversar'){
      link = `https://wa.me/${waNum}`;
    } else {
      const empObj = empresas.find(e=>e.id===empId);
      const defaultMsg = tipo === 'confirmacao'
        ? 'Ola, {nome}! Confirmando seu agendamento de {servico} hoje as {hora}. Te esperamos!'
        : 'Ola, {nome}! Lembrando do seu agendamento de {servico} amanha as {hora}. Ate la!';
      const tmpl = (tipo === 'confirmacao' ? empObj?.msgConfirmacao : empObj?.msgLembrete) || defaultMsg;
      const dataFmt = ag.data ? new Date(ag.data+'T00:00:00').toLocaleDateString('pt-BR') : '';
      const msg = tmpl
        .replace(/{nome}/g, ag.nome||'')
        .replace(/{hora}/g, ag.hora||'')
        .replace(/{servico}/g, ag.servicoNome||'')
        .replace(/{data}/g, dataFmt);
      link = `https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`;
      const campo = tipo === 'confirmacao' ? 'confirmacao_enviada' : 'lembrete_enviado';
      supabaseClient.from('agendamentos').update({ [campo]: true }).eq('id', agId);
      if(tipo === 'confirmacao') ag.confirmacaoEnviada = true;
      else ag.lembreteEnviado = true;
    }
    _waMenuId = null;
    draw();
    window.open(link, '_blank', 'noopener,noreferrer');
  };
  window.salvarMensagens = async (empId)=>{
    const c = document.getElementById('msgConfirmacao');
    const l = document.getElementById('msgLembrete');
    if(!c || !l) return;
    const { error } = await supabaseClient.from('empresas').update({
      msg_confirmacao: c.value,
      msg_lembrete:    l.value
    }).eq('id', empId);
    if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    const empObj = empresas.find(e=>e.id===empId);
    if(empObj){ empObj.msgConfirmacao = c.value; empObj.msgLembrete = l.value; }
    toast('Mensagens salvas!','ok');
  };
  window.toggleLinkMenu = ()=>{ _linkMenuAberto = !_linkMenuAberto; draw(); };
  window.linkAcao = (acao)=>{
    const url = `https://${emp.slug}.agenplus.com.br`;
    if(acao==='abrir'){ window.open(url, '_blank'); }
    else if(acao==='copiar'){ navigator.clipboard.writeText(url).then(()=>toast('Link copiado!','ok')); }
    else if(acao==='compartilhar'){ if(navigator.share) navigator.share({ title: emp.nome, url }); else navigator.clipboard.writeText(url).then(()=>toast('Link copiado!','ok')); }
    _linkMenuAberto = false; draw();
  };
  window.configurarIr = (sub)=>{ configurarSub=sub; personalizarDirty=false; _removendoServicoIdx=null; draw(); };
  window.irParaHorarios = ()=>{ corner='configurar'; configurarSub='horarios'; draw(); };
  window.marcarPersonalizarDirty = ()=>{
    if(personalizarDirty) return;
    personalizarDirty = true;
    const saveWrap = document.getElementById('pers-save-wrap');
    const dirtyBanner = document.getElementById('pers-dirty-banner');
    if(saveWrap) saveWrap.style.display = 'none';
    if(dirtyBanner) dirtyBanner.style.display = 'block';
  };
  window.voltarDePersonalizar = ()=>{ personalizarDirty=false; configurarIr(null); };
  window.descartarPersonalizar = ()=>{ personalizarDirty=false; configurarIr(null); };
  window.adicionarHorario = async ()=>{
    const val = document.getElementById('novoHorarioInput').value;
    if(!val){ toast('Selecione um horário.','err'); return; }
    emp.horariosPorMes = emp.horariosPorMes || {};
    const lista = emp.horariosPorMes['_uni_'] || [];
    if(lista.includes(val)){ return; }
    const { error } = await supabaseClient.from('horarios_disponiveis').insert({
      empresa_id: emp.id, mes: '_uni_', hora: val
    });
    if(error){ toast(friendlyError(error,'Erro ao adicionar horário. Tente novamente.'),'err'); return; }
    lista.push(val);
    emp.horariosPorMes['_uni_'] = lista;
    draw();
  };
  window.removerHorario = async (h)=>{
    const { error } = await supabaseClient.from('horarios_disponiveis')
      .delete().eq('empresa_id', emp.id).eq('mes', '_uni_').eq('hora', h);
    if(error){ toast(friendlyError(error,'Erro ao remover horário. Tente novamente.'),'err'); return; }
    emp.horariosPorMes['_uni_'] = (emp.horariosPorMes['_uni_']||[]).filter(x=>x!==h);
    draw();
  };
  window.toggleDiaSemana = async (dia)=>{
    emp.horariosPorMes = emp.horariosPorMes || {};
    const atual = (emp.horariosPorMes['_dias_'] || []).map(Number);
    const jaExiste = atual.length > 0;
    let novos;
    if(!jaExiste){
      // primeira vez: começa com todos os dias e remove o clicado
      novos = [0,1,2,3,4,5,6].filter(d=>d!==dia);
    } else {
      novos = atual.includes(dia) ? atual.filter(d=>d!==dia) : [...atual, dia].sort();
    }
    // remove entradas antigas de _dias_ e insere as novas
    const { error: delErr } = await supabaseClient.from('horarios_disponiveis')
      .delete().eq('empresa_id', emp.id).eq('mes', '_dias_');
    if(delErr){ toast(friendlyError(delErr,'Erro ao salvar dias. Tente novamente.'),'err'); return; }
    if(novos.length){
      const rows = novos.map(d=>({ empresa_id: emp.id, mes: '_dias_', hora: String(d) }));
      const { error } = await supabaseClient.from('horarios_disponiveis').insert(rows);
      if(error){ toast(friendlyError(error,'Erro ao salvar dias. Tente novamente.'),'err'); return; }
    }
    emp.horariosPorMes['_dias_'] = novos.map(String);
    draw();
  };

  // ── PERSONALIZAR PÁGINA ──────────────────────────────────

  window.salvarInfoEmpresa = async ()=>{
    emp.nome               = document.getElementById('pNome').value.trim() || emp.nome;
    emp.descricao          = document.getElementById('pDescricao').value.trim();
    emp.textoDestaque      = document.getElementById('pTextoDestaque').value.trim();
    emp.corPrincipal       = document.getElementById('pCor').value;
    const { error } = await supabaseClient.from('empresas').update({
      nome:                  emp.nome,
      descricao:             emp.descricao             || null,
      cor_principal:         emp.corPrincipal,
      texto_destaque:        emp.textoDestaque         || null,
    }).eq('id', emp.id);
    if(error){ console.error('Erro ao salvar informações:', error); toast('Erro ao salvar. Tente novamente.','err'); return; }
    personalizarDirty = false;
    toast('Informações salvas!','ok');
    draw();
  };

  function validarConverterWhatsapp(val){
    let d = val.replace(/\D/g,'');
    if(d.startsWith('55') && d.length > 11) d = d.slice(2);
    if(d.startsWith('0')) d = d.slice(1);
    if(d.length !== 11 || d[2] !== '9') return null;
    return 'https://wa.me/55' + d;
  }
  window.atualizarCampoBotao = (tipoId, linkId, hintId)=>{
    const tipo = document.getElementById(tipoId)?.value;
    const inp  = document.getElementById(linkId);
    const hint = document.getElementById(hintId);
    if(!inp) return;
    if(tipo === 'whatsapp'){
      inp.placeholder = '(xx) xxxxx-xxxx';
      inp.type = 'tel'; inp.inputMode = 'numeric'; inp.maxLength = 16;
      inp.oninput = ()=>window.maskTel(inp);
    } else {
      inp.placeholder = tipo === 'telefone' ? 'tel:+5511999999999' : 'https://...';
      inp.type = 'text'; inp.inputMode = ''; inp.maxLength = 500;
      inp.oninput = null; inp.removeAttribute('oninput');
      if(hint) hint.style.display = 'none';
    }
  };
  window.iniciarNovoBotao  = ()=>{ novoBotaoState = {}; editandoBotaoId = null; draw(); };
  window.cancelarNovoBotao = ()=>{ novoBotaoState = null; draw(); };
  window.editarBotao       = (id)=>{ editandoBotaoId = id; novoBotaoState = null; draw(); };
  window.cancelarEdicaoBotao = ()=>{ editandoBotaoId = null; draw(); };
  window.salvarEdicaoBotao = async (id)=>{
    const tipo = document.getElementById('ebTipo').value;
    const nome = LABEL_POR_TIPO[tipo] || tipo;
    let link   = document.getElementById('ebLink').value.trim();
    if(!link){ toast('Preencha o link do botão.','err'); return; }
    if(tipo === 'whatsapp'){
      const convertido = validarConverterWhatsapp(link);
      if(!convertido){
        const hint = document.getElementById('ebLinkHint');
        if(hint) hint.style.display = 'block';
        return;
      }
      link = convertido;
    } else if(!/^(https?:|tel:|mailto:)/i.test(link)){
      toast('O link deve começar com https://, http://, tel: ou mailto:','err'); return;
    }
    const existingB = emp.botoes.find(x=>x.id===id);
    const { error } = await supabaseClient.from('botoes_empresa').update({
      nome, tipo, link, icone: '', abrir_nova_aba: true
    }).eq('id', id);
    if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    Object.assign(existingB, { nome, tipo, link, icone: '', abrirNovaAba: true });
    editandoBotaoId = null;
    draw();
  };

  window.salvarNovoBotao = async ()=>{
    const tipo = document.getElementById('bTipo').value;
    const nome = LABEL_POR_TIPO[tipo] || tipo;
    let link   = document.getElementById('bLink').value.trim();
    if(!link){ toast('Preencha o link do botão.','err'); return; }
    if(tipo === 'whatsapp'){
      const convertido = validarConverterWhatsapp(link);
      if(!convertido){
        const hint = document.getElementById('bLinkHint');
        if(hint) hint.style.display = 'block';
        return;
      }
      link = convertido;
    } else if(!/^(https?:|tel:|mailto:)/i.test(link)){
      toast('O link deve começar com https://, http://, tel: ou mailto:','err'); return;
    }
    const ordemMax = emp.botoes.length > 0 ? Math.max(...emp.botoes.map(b=>b.ordem)) + 1 : 0;
    const { data: row, error } = await supabaseClient.from('botoes_empresa').insert({
      empresa_id:    emp.id,
      nome, tipo, link,
      icone:         '',
      ordem:         ordemMax,
      ativo:         true,
      abrir_nova_aba: true
    }).select().single();
    if(error){ console.error('Erro ao adicionar botão:', error); toast('Erro ao salvar. Tente novamente.','err'); return; }
    emp.botoes.push({ id:row.id, nome:row.nome, tipo:row.tipo, link:row.link,
      icone:row.icone, ordem:row.ordem, ativo:row.ativo, abrirNovaAba:row.abrir_nova_aba });
    emp.botoes.sort((a,b)=>a.ordem-b.ordem);
    novoBotaoState = null;
    draw();
  };

  window.removerBotao = async (id)=>{
    if(!confirm('Remover este botão?')) return;
    const { error } = await supabaseClient.from('botoes_empresa').delete().eq('id', id);
    if(error){ toast(friendlyError(error,'Erro ao remover botão. Tente novamente.'),'err'); return; }
    emp.botoes = emp.botoes.filter(b=>b.id!==id);
    draw();
  };

  let _dragFromId = null;
  window.dragBotaoStart = (e, id)=>{
    _dragFromId = id;
    e.currentTarget.style.opacity = '0.4';
    e.dataTransfer.effectAllowed = 'move';
  };
  window.dragBotaoOver = (e)=>{
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  };
  window.dragBotaoEnd = (e)=>{
    e.currentTarget.style.opacity = '';
  };
  window.dragBotaoDrop = async (e, toId)=>{
    e.preventDefault();
    if(!_dragFromId || _dragFromId === toId) return;
    const fromIdx = emp.botoes.findIndex(b=>b.id===_dragFromId);
    const toIdx   = emp.botoes.findIndex(b=>b.id===toId);
    if(fromIdx < 0 || toIdx < 0) return;
    const moved = emp.botoes.splice(fromIdx, 1)[0];
    emp.botoes.splice(toIdx, 0, moved);
    emp.botoes.forEach((b, i) => b.ordem = i);
    _dragFromId = null;
    await Promise.all(emp.botoes.map(b =>
      supabaseClient.from('botoes_empresa').update({ ordem: b.ordem }).eq('id', b.id)
    ));
    draw();
  };

  window.compartilharLink = async ()=>{
    const url = `https://${emp.slug}.agenplus.com.br`;
    if(navigator.share){
      try{ await navigator.share({ title: emp.nome, url }); } catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(url); toast('Link copiado!','ok'); }
      catch(e){ prompt('Copie o link abaixo:', url); }
    }
  };

  draw();
  gFinCarregar();
  carregarNotas();
  iniciarPolling(()=>{
    // Reaponta para o objeto novo criado pelo loadData()
    const atual = empresas.find(e => e.slug === emp.slug);
    if(atual) emp = atual;
    // Não redesenha se houver formulário aberto (evita apagar campos em edição)
    const formAberto = editandoId !== null || novoAgState !== null || novoBotaoState !== null || editandoBotaoId !== null || _gFinModal !== null || _notaModal !== null;
    if(!formAberto && (corner===null || corner==='dashboard')) draw();
  });
}

window.tentarCadastro = async ()=>{
  const nome  = (document.getElementById('cad-nome')?.value  || '').trim();
  const whats = (document.getElementById('cad-whats')?.value || '').trim();
  const email = (document.getElementById('cad-email')?.value || '').trim();
  const senha = (document.getElementById('cad-senha')?.value || '');

  if(!nome)  { toast('Digite o nome da empresa.','err'); return; }
  if(!email) { toast('Digite seu e-mail.','err'); return; }
  if(senha.length < 6){ toast('A senha deve ter pelo menos 6 caracteres.','err'); return; }

  if(whats){
    let wd = whats.replace(/\D/g,'');
    if(wd.startsWith('55') && wd.length > 11) wd = wd.slice(2);
    if(wd.startsWith('0')) wd = wd.slice(1);
    if(wd.length < 10 || wd.length > 11){ toast('WhatsApp inválido. Use o formato (xx) xxxxx-xxxx.','err'); return; }
  }

  const btn = document.querySelector('.card .btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Criando conta...'; }

  render(`<div class="loading-wrap"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div><div>Criando sua conta...</div></div>`);

  let resp, result;
  try {
    resp = await fetch('/api/cadastro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome_empresa: nome, email, password: senha, whatsapp: whats })
    });
    result = await resp.json();
  } catch(e) {
    toast('Erro de conexão. Tente novamente.','err',8000);
    renderCadastro(); return;
  }

  if(!resp.ok){
    toast(result.error || 'Erro ao criar conta.','err',6000);
    renderCadastro(); return;
  }

  // Faz login com as credenciais recem criadas
  const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(loginError || !loginData?.session){
    toast('Conta criada! Faça login para continuar.','ok',5000);
    renderLoginUnificado(); return;
  }

  const session = loginData.session;
  const hash = `access_token=${session.access_token}&refresh_token=${session.refresh_token}&token_type=bearer&type=bearer`;
  location.replace(`https://${result.slug}.agenplus.com.br/gestao#${hash}`);
};

window.tentarLoginUnificado = async ()=>{
  const email = (document.getElementById('loginEmail').value || '').trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){ toast('Preencha e-mail e senha.','err'); return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){ toast('E-mail ou senha incorretos.','err'); return; }

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
  if(!profile || profile.status !== 'ativo'){
    await supabaseClient.auth.signOut();
    toast('Conta bloqueada. Entre em contato com o administrador.','err');
    return;
  }

  currentUser    = data.user;
  currentProfile = profile;
  await loadData();

  if(profile.role === 'master'){
    location.replace('/master');
  } else if(profile.role === 'owner_empresa'){
    const emp = empresas.find(e => e.id === profile.empresa_id);
    if(emp){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const hash = `access_token=${session.access_token}&refresh_token=${session.refresh_token}&token_type=bearer&type=bearer`;
      location.replace(`https://${emp.slug}.agenplus.com.br/gestao#${hash}`);
    } else {
      toast('Empresa não encontrada.','err');
    }
  } else {
    toast('Acesso não autorizado.','err');
  }
};

function finStatusInfo(reg){
  if(!reg) return { label:'Sem dados', cor:'#9e9e9e', bg:'#f5f5f5' };
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth(); // 0-based
  const diaHoje = hoje.getDate();
  const dia = reg.dia_vencimento;
  // Verificar se pagou no mês atual
  if(reg.pago_em){
    const mesStr = `${ano}-${String(mes+1).padStart(2,'0')}`;
    if(reg.pago_em.slice(0,7) === mesStr){
      return { label:'Pago', cor:'#2e7d32', bg:'#e8f5e9' };
    }
  }
  // Vencido: já passou o dia de vencimento este mês e não pagou
  if(diaHoje > dia){
    return { label:'Vencido', cor:'#c62828', bg:'#ffebee' };
  }
  // A vencer: faltam 7 dias ou menos
  if(dia - diaHoje <= 7){
    return { label:`Vence em ${dia - diaHoje === 0 ? 'hoje' : (dia - diaHoje) + ' dia(s)'}`, cor:'#e65100', bg:'#fff3e0' };
  }
  return { label:'Em dia', cor:'#2e7d32', bg:'#e8f5e9' };
}

          <label>Cor principal</label>
          <div class="m-swatches" id="masterCorSwatches">
            ${['#3d1f3a','#1a1a2e','#0f3460','#264653','#2d6a4f','#533483','#b5179e','#c1121f','#e76f51','#f4a261','#457b9d','#1a1a1a'].map(c=>
              `<div class="m-sw master-cor-sw" data-cor="${c}" onclick="masterSwatchCor('${c}')" style="background:${c};border-color:${c==='#3d1f3a'?'#1a1a1a':'transparent'};"></div>`

          <div style="display:flex;align-items:center;gap:10px;">

            <span style="font-size:13px;color:#888;">Personalizar cor</span>
          </div>
        </div>
        <div class="m-form-actions">
          <button class="btn" style="width:100%;" onclick="masterCriar()">Criar empresa</button>
          <button class="btn ghost" style="width:100%;" onclick="masterFecharDrawer()">Cancelar</button>
        </div>
      `);
      return;
    }

    // Formulario de editar — substitui a lista
    if(masterDrawerMode === 'editar' && editing){
      drawMasterShell(`
        <button class="m-back" onclick="masterFecharDrawer()">${ICO_BACK} Voltar</button>
        <div class="m-form-title">${escapeHtml(editing.nome)}</div>
        <div class="field"><label>Nome</label><input value="${escapeAttr(editing.nome)}" onchange="masterUpd('nome',this.value)"/></div>
        <div class="field"><label>WhatsApp</label><input type="tel" inputmode="numeric" maxlength="16" value="${escapeAttr(fmtTelStr(editing.whatsapp))}" onkeydown="if(event.key.length===1&&!/[0-9]/.test(event.key))event.preventDefault()" oninput="maskTel(this);masterUpd('whatsapp',this.value)"/></div>
        <div class="field">
          <label>Link público</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <span style="font-size:13px;color:var(--ink-soft);white-space:nowrap;">https://</span>
            <input id="masterSlugInput" value="${escapeAttr(editing.slug)}" placeholder="seu-link" style="flex:1;" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')"/>
            <span style="font-size:13px;color:var(--ink-soft);white-space:nowrap;">.agenplus.com.br</span>
          </div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Alterar o link quebra o endereço antigo.</div>
        </div>
        <div class="field">
          <label>E-mail do gestor</label>
          <input readonly value="${escapeAttr(editing.gestorEmail||'Não cadastrado')}" style="background:#f5f5f5;color:var(--ink-soft);" onclick="this.select()"/>
        </div>
        <div class="m-form-actions">
          <button class="btn" style="width:100%;" onclick="masterSalvarEdicao()">Salvar alterações</button>
          <button class="btn ghost" style="width:100%;" onclick="masterToggleBloqueio()">${editing.bloqueada?'Desbloquear empresa':'Bloquear empresa'}</button>
          <button class="btn ghost" style="width:100%;" onclick="masterRedefinirSenha()">Redefinir senha do gestor</button>
          <button class="btn danger" style="width:100%;" onclick="masterExcluir('${editing.slug}')">Excluir empresa</button>
        </div>
      `);
      return;
    }

    // Lista normal
    const listaFiltrada = masterSearch
      ? empresas.filter(e => e.nome.toLowerCase().includes(masterSearch.toLowerCase()))
      : empresas;

    const ICO_EXT  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
    const ICO_COPY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const ICO_GEST = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`;
    const ICO_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

    const lista = listaFiltrada.length
      ? `<div style="display:flex;flex-direction:column;gap:8px;">${listaFiltrada.map(e=>{
          const link = `https://${e.slug}.agenplus.com.br`;
          return `<div class="m-ec">
            <div class="m-ec-dot" style="background:${e.bloqueada?'#ef4444':'#22c55e'};"></div>
            <div class="m-ec-body">
              <div class="m-ec-name">${escapeHtml(e.nome)}</div>
              <div class="m-ec-link">${escapeHtml(link)}</div>
            </div>
            <div class="m-ec-acts">
              <button class="m-ib" title="Página pública" onclick="goto({empresa:'${e.slug}'})"> ${ICO_EXT}</button>
              <button class="m-ib" title="Copiar link" onclick="navigator.clipboard.writeText('${escapeAttr(link)}').then(()=>toast('Link copiado!','ok'))">${ICO_COPY}</button>
              <button class="m-ib" title="Painel de gestão" onclick="goto({empresa:'${e.slug}',page:'gestao'})">${ICO_GEST}</button>
              <button class="m-ib" title="Editar" onclick="masterEditarEmpresa('${e.slug}')">${ICO_EDIT}</button>
            </div>
          </div>`;
        }).join('')}</div>`
      : `<p class="muted">${masterSearch ? 'Nenhuma empresa encontrada.' : 'Nenhuma empresa cadastrada ainda.'}</p>`;

    drawMasterShell(`
      <div class="m-sh">
        <div>
          <div class="m-sh-title">Empresas</div>
          <div class="m-sh-sub">${empresas.length} cadastrada${empresas.length!==1?'s':''}</div>
        </div>
        <button class="m-add" onclick="masterAbrirDrawer('criar')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova empresa
        </button>
      </div>
      <input class="m-search" placeholder="Buscar empresa..." value="${escapeAttr(masterSearch)}" oninput="masterSearch=this.value; drawMaster()"/>
      ${lista}
    `);
  }

  function drawFinanceiro(){
    const hoje = new Date();
    const mesAtual = hoje.toLocaleString('pt-BR',{month:'long', year:'numeric'}).replace(' De ', ' de ');

    const rows = empresas.map(e => ({ e, reg: financeiroData.find(f=>f.empresa_id===e.id) }));

    const filtroFin = _filtroFin;
    const filtrados = rows.filter(({reg}) => {
      if(filtroFin === 'todos') return true;
      if(!reg) return filtroFin === 'sem-dados';
      const info = finStatusInfo(reg);
      if(filtroFin === 'pagos')    return info.label === 'Pago';
      if(filtroFin === 'vencidos') return info.label === 'Vencido';
      if(filtroFin === 'a-vencer') return info.label.startsWith('Vence');
      return true;
    });

    const tabBtns = ['todos','pagos','vencidos','a-vencer'].map(f => `
      <button class="m-tab ${filtroFin===f?'on':''}" onclick="_filtroFin='${f}'; drawMaster();">
        ${{todos:'Todos',pagos:'Pagos',vencidos:'Vencidos','a-vencer':'A vencer'}[f]}
      </button>`).join('');

    const listaFin = filtrados.length ? filtrados.map(({e, reg}) => {
      const info = finStatusInfo(reg);
      const valor = reg ? parseFloat(reg.valor||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '—';
      const diaVenc = reg ? `Dia ${reg.dia_vencimento}` : '—';
      const pagoEm = reg?.pago_em ? new Date(reg.pago_em).toLocaleDateString('pt-BR') : null;
      const podeMarcar = reg && info.label !== 'Pago';
      return `
        <div class="m-fc">
          <div class="m-fc-body">
            <div class="m-fc-name">${escapeHtml(e.nome)}</div>
            <div class="m-fc-sub">${diaVenc} · ${valor}/mês${pagoEm ? ` · pago em ${pagoEm}` : ''}</div>
          </div>
          <span class="fin-status" style="color:${info.cor};background:${info.bg};flex-shrink:0;">${info.label}</span>
          <div class="m-fc-acts">
            ${!reg
              ? `<button class="btn" style="font-size:12px;height:34px;padding:0 12px;" onclick="finConfigurar('${e.id}')">Configurar</button>`
              : `${podeMarcar ? `<button class="btn" style="font-size:12px;height:34px;padding:0 12px;background:#166534;border-color:#166534;" onclick="finMarcarPago('${reg.id}')">Pago</button>` : `<button class="btn ghost" style="font-size:12px;height:34px;padding:0 12px;" disabled>Pago</button>`}
                 <button class="m-ib" title="Editar plano" onclick="finEditar('${e.id}','${reg.id}',${reg.valor},${reg.dia_vencimento})">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                 </button>`
            }
          </div>
        </div>`;
    }).join('') : `<p class="muted">Nenhuma empresa nesta categoria.</p>`;

    if(_finForm){
      const emp = empresas.find(e=>e.id===_finForm.empresaId);
      drawMasterShell(`
        <button class="m-back" onclick="finCancelarForm()">${ICO_BACK} Voltar</button>
        <div class="m-form-title">${_finForm.mode==='configurar'?'Configurar plano':'Editar plano'}${emp?' — '+escapeHtml(emp.nome):''}</div>
        <div class="field"><label>Valor mensal (R$)</label><input type="number" id="finFormValor" value="${_finForm.valor||''}" min="0" step="0.01" placeholder="Ex: 99.90"/></div>
        <div class="field"><label>Dia de vencimento (1 a 28)</label><input type="number" id="finFormDia" value="${_finForm.dia||''}" min="1" max="28" placeholder="Ex: 10"/></div>
        <div class="m-form-actions">
          <button class="btn" style="width:100%;" onclick="finSalvarForm()">Salvar</button>
          <button class="btn ghost" style="width:100%;" onclick="finCancelarForm()">Cancelar</button>
        </div>
      `);
      return;
    }

    drawMasterShell(`
      <div class="m-sh" style="margin-bottom:16px;">
        <div>
          <div class="m-sh-title">Financeiro</div>
          <div class="m-sh-sub" style="text-transform:capitalize;">${mesAtual}</div>
        </div>
      </div>
      <div class="m-tabs">${tabBtns}</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${listaFin}</div>
    `);
  }

  window.drawMaster = draw;
  window.masterIrAba = (aba) => { masterAba = aba; draw(); };

  window.finCancelarForm = () => { _finForm = null; draw(); };
  window.finConfigurar = (empresaId) => { _finForm = { mode:'configurar', empresaId, regId:null, valor:'', dia:'' }; draw(); };
  window.finEditar = (empresaId, regId, valorAtual, diaAtual) => { _finForm = { mode:'editar', empresaId, regId, valor:valorAtual, dia:diaAtual }; draw(); };

  window.finSalvarForm = async () => {
    const valorEl = document.getElementById('finFormValor');
    const diaEl   = document.getElementById('finFormDia');
    const valor = parseFloat(valorEl?.value) || 0;
    const diaNum = parseInt(diaEl?.value);
    if(isNaN(diaNum) || diaNum < 1 || diaNum > 28){ toast('Dia inválido. Use um número entre 1 e 28.','err'); return; }
    const form = _finForm;
    _finForm = null;
    if(form.mode === 'configurar'){
      const { error } = await supabaseClient.from('financeiro').insert({ empresa_id: form.empresaId, valor, dia_vencimento: diaNum });
      if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    } else {
      const { error } = await supabaseClient.from('financeiro').update({ valor, dia_vencimento: diaNum, updated_at: new Date().toISOString() }).eq('id', form.regId);
      if(error){ toast('Erro ao salvar. Tente novamente.','err'); return; }
    }
    await carregarFinanceiro();
    draw();
  };

  window.finMarcarPago = (regId) => {
    if(!confirm("Confirmar pagamento recebido?")) return;
    const _d = new Date();
    const hoje = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
    supabaseClient.from('financeiro').update({ pago_em: hoje, updated_at: new Date().toISOString() }).eq('id', regId)
      .then(async ({ error }) => {
        if(error){ toast('Erro ao registrar pagamento.','err'); return; }
        await carregarFinanceiro();
        draw();
      });
  };

  window.masterSwatchCor = (c, viaInput=false) => {
    if(!viaInput){
      const inp = document.getElementById('novaCor');
      if(inp) inp.value = c;
    }
    document.querySelectorAll('.master-cor-sw').forEach(el => {
      el.style.borderColor = el.dataset.cor === c ? '#1a1a1a' : 'transparent';
    });
  };

  window.masterCriar = async ()=>{
    const nome  = document.getElementById('novoNome').value.trim();
    const email = document.getElementById('novoEmail').value.trim();
    const senha = document.getElementById('novaSenha').value;
    if(!nome){ toast('Digite o nome da empresa.','err'); return; }
    if(!email){ toast('Digite o e-mail do gestor.','err'); return; }
    if(senha.length < 6){ toast('A senha deve ter pelo menos 6 caracteres.','err'); return; }
    const _whatsRaw = document.getElementById('novoWhats').value.trim();
    if(_whatsRaw){
      let _wd = _whatsRaw.replace(/\D/g,'');
      if(_wd.startsWith('55') && _wd.length > 11) _wd = _wd.slice(2);
      if(_wd.startsWith('0')) _wd = _wd.slice(1);
      if(_wd.length < 10 || _wd.length > 11){ toast('WhatsApp inválido. Use o formato (xx) xxxxx-xxxx.','err'); return; }
    }

    // 1. Cria a empresa no banco
    const SLUGS_RESERVADOS = ['api','app','admin','master','login','logout','static','assets','sw','manifest','index','null','undefined','favicon'];
    let slug = slugify(nome);
    if(SLUGS_RESERVADOS.includes(slug)){ toast(`O nome "${nome}" é reservado pelo sistema. Use um nome diferente.`,'err'); return; }
    let s2 = slug, n=1;
    while(empresas.some(e=>e.slug===s2)){ s2 = slug+"-"+(++n); }
    const nova = defaultEmpresa();
    nova.slug = s2; nova.nome = nome;
    nova.whatsapp = document.getElementById('novoWhats').value.trim();
    nova.corPrincipal = sanitizeCor(document.getElementById('novaCor')?.value || '#3d1f3a');
    empresas.push(nova);
    await saveEmpresas();

    const empCriada = empresas.find(e=>e.slug===s2);
    if(!empCriada?.id){
      empresas = empresas.filter(e=>e.slug!==s2);
      toast('Não foi possível criar a empresa. Verifique sua conexão e tente novamente.','err',6000);
      masterShowForm = false; masterDrawerMode = null; draw(); return;
    }

    // 2. Cria o usuário gestor via API segura
    const { data: { session } } = await supabaseClient.auth.getSession();
    let apiOk = false;
    try {
      const resp = await fetch('/api/create-user', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token
        },
        body: JSON.stringify({ email, password: senha, nome, empresa_id: empCriada.id })
      });
      if(!resp.ok){
        const err = await resp.json();
        toast('Empresa criada, mas erro ao criar usuário: ' + (err.error || 'Erro desconhecido') + '. Crie manualmente no Supabase.','err',8000);
      } else {
        apiOk = true;
      }
    } catch(e) {
      toast('Empresa criada, mas não foi possível contatar a API. Crie o usuário manualmente no Supabase.','err',8000);
    }

    masterShowForm = false; masterDrawerMode = null;
    if(apiOk){
      toast(`"${nome}" criada! Gestor: ${email}. Compartilhe a senha por canal seguro.`,'ok',8000);
    }
    draw();
  };
  window.masterEditarEmpresa = async (slug) => {
    editingSlug = slug;
    masterDrawerMode = 'editar';
    draw();
    const emp = empresas.find(e => e.slug === slug);
    if(emp && !emp.gestorEmail){
      const { data } = await supabaseClient.from('profiles').select('email').eq('empresa_id', emp.id).eq('role','owner_empresa').single();
      if(data?.email){ emp.gestorEmail = data.email; draw(); }
    }
  };
  window.masterSalvarEdicao = async ()=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    if(!e){ editingSlug=null; draw(); return; }

    const novoSlug = (document.getElementById('masterSlugInput')?.value||'').trim();
    const RESERVADOS = ['api','app','admin','master','login','logout','static','assets','sw','manifest','index','null','undefined','favicon'];

    if(novoSlug && novoSlug !== editingSlug){
      if(!novoSlug || !/^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$/.test(novoSlug)){
        toast('Link inválido. Use apenas letras minúsculas, números e hífens.','err'); return;
      }
      if(RESERVADOS.includes(novoSlug)){ toast('Esse link é reservado pelo sistema.','err'); return; }
      if(empresas.some(x=>x.slug===novoSlug && x.id!==e.id)){ toast('Esse link já está em uso por outra empresa.','err'); return; }

      const antigoSlug = editingSlug;
      e.slug = novoSlug;
      await saveEmpresas();

      // Move imagens no Storage para o novo caminho
      for(const bucket of ['logos','backgrounds']){
        const file = bucket==='logos' ? 'logo.jpg' : 'background.jpg';
        try{
          const { data:blob } = await supabaseClient.storage.from(bucket).download(`${antigoSlug}/${file}`);
          if(blob){
            await supabaseClient.storage.from(bucket).upload(`${novoSlug}/${file}`, blob, { contentType:'image/jpeg', upsert:true });
            await supabaseClient.storage.from(bucket).remove([`${antigoSlug}/${file}`]);
            const { data:urlData } = supabaseClient.storage.from(bucket).getPublicUrl(`${novoSlug}/${file}`);
            if(bucket==='logos') e.logo = urlData.publicUrl;
            else e.fotoUrl = urlData.publicUrl;
          }
        }catch(_){}
      }
      await saveEmpresas();

      agendamentos = agendamentos.map(a=> a.slug===antigoSlug ? {...a, slug:novoSlug} : a);
      editingSlug = novoSlug;
      toast('Link alterado com sucesso!','ok');
    }

    editingSlug = null; masterDrawerMode = null; draw();
  };
  window.masterUpd = async (field,val)=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e[field] = val; await saveEmpresas();
  };
  window.masterToggleBloqueio = async ()=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e.bloqueada = !e.bloqueada; await saveEmpresas(); draw();
  };
  window.masterExcluir = async (slug)=>{
    const e = empresas.find(x=>x.slug===slug);
    if(!confirm(`Excluir "${e.nome}" definitivamente? Isso também apaga os agendamentos dela. Essa ação não pode ser desfeita.`)) return;
    if(e.id){
      // Remove o auth user do gestor via API (service role)
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        await fetch('/api/delete-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session?.access_token },
          body: JSON.stringify({ empresa_id: e.id })
        });
      } catch(_){}
      const { error } = await supabaseClient.from('empresas').delete().eq('id', e.id);
      if(error){ toast(friendlyError(error,'Erro ao excluir empresa. Tente novamente.'),'err'); return; }
    }
    empresas = empresas.filter(x=>x.slug!==slug);
    agendamentos = agendamentos.filter(a=>a.slug!==slug);
    await excluirImagensEmpresa(slug);
    editingSlug = null;
    draw();
  };
  carregarFinanceiro().then(draw);
  iniciarPolling(()=>{ if(!editingSlug) carregarFinanceiro().then(()=>{ if(!editingSlug) draw(); }); });
}

function _limparEstado(){
  empresas = []; agendamentos = []; loaded = false;
  editingSlug = null; masterSearch = ''; masterAba = 'dashboard';
  financeiroData = []; _finForm = null; _filtroFin = 'todos';
  // gestão financeiro — resetado pelo closure de gestaoApp, mas zeramos referências globais por segurança
}
window.masterLogout = async ()=>{
  pararPolling();
  await supabaseClient.auth.signOut();
  currentUser = null; currentProfile = null;
  _limparEstado();
  renderLoginUnificado();
};
window.gestaoLogout = async (slug)=>{
  pararPolling();
  await supabaseClient.auth.signOut();
  currentUser = null; currentProfile = null;
  _limparEstado();
  await loadData();
  goto({empresa: slug});
};
window.masterRedefinirSenha = async ()=>{
  const email = prompt("Digite o e-mail do gestor para enviar a redefinição de senha:");
  if(!email) return;
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/app.html' });
  if(error){ toast('Erro ao enviar. Tente novamente.','err'); return; }
  toast('E-mail de redefinição enviado para ' + email,'ok',5000);
};

// ── UPLOAD DE IMAGENS ────────────────────────────────────────
let _cropInstance = null;
let _cropCallback = null;
let _cropTipo = null;
let _cropSlug = null;

function validarArquivo(file){
  const tipos = ['image/jpeg','image/png','image/webp'];
  if(!tipos.includes(file.type)) return 'Formato inválido. Use JPG, PNG ou WEBP.';
  if(file.size > 5 * 1024 * 1024) return 'Arquivo muito grande. Máximo 5 MB.';
  return null;
}

function abrirCrop(tipo, slug, callback){
  _cropTipo = tipo; _cropSlug = slug; _cropCallback = callback;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/jpeg,image/png,image/webp';
  input.onchange = (ev)=>{
    const file = ev.target.files[0]; if(!file) return;
    const err = validarArquivo(file); if(err){ toast(err,'err'); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const modal = document.getElementById('cropModal');
      const img   = document.getElementById('cropImg');
      img.src = e.target.result;
      modal.style.display = 'flex';
      if(_cropInstance){ _cropInstance.destroy(); _cropInstance = null; }
      const ratio = tipo==='logo' ? 1 : 16/9;
      _cropInstance = new Cropper(img, { aspectRatio: ratio, viewMode: 1, autoCropArea: 0.9, movable: true, zoomable: true, rotatable: false, scalable: false });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function confirmarCrop(){
  if(!_cropInstance) return;
  const btn = document.getElementById('btnConfirmarCrop');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const isLogo = _cropTipo === 'logo';
  const w = isLogo ? 540 : 1280, h = isLogo ? 540 : 720;
  const canvas = _cropInstance.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' });
  canvas.toBlob(async (blob)=>{
    const bucket = isLogo ? 'logos' : 'backgrounds';
    const path   = `${_cropSlug}/${isLogo ? 'logo' : 'background'}.jpg`;
    const { error: upErr } = await supabaseClient.storage.from(bucket).upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if(upErr){ toast('Erro ao enviar imagem. Tente novamente.','err'); btn.disabled=false; btn.textContent='Confirmar recorte'; return; }
    const { data } = supabaseClient.storage.from(bucket).getPublicUrl(path);
    const url = data.publicUrl + '?t=' + Date.now();
    const col = isLogo ? 'logo' : 'foto_url';
    const emp = empresas.find(x=>x.slug===_cropSlug);
    if(emp && emp.id){
      await supabaseClient.from('empresas').update({ [col]: url }).eq('id', emp.id);
    }
    const cb = _cropCallback;
    fecharCrop();
    if(cb) cb(url);
  }, 'image/jpeg', 0.92);
}

function cancelarCrop(){ fecharCrop(); }

function fecharCrop(){
  document.getElementById('cropModal').style.display = 'none';
  if(_cropInstance){ _cropInstance.destroy(); _cropInstance = null; }
  const btn = document.getElementById('btnConfirmarCrop');
  btn.disabled = false; btn.textContent = 'Confirmar recorte';
  _cropCallback = null; _cropTipo = null; _cropSlug = null;
}

async function excluirImagensEmpresa(slug){
  await supabaseClient.storage.from('logos').remove([`${slug}/logo.jpg`]);
  await supabaseClient.storage.from('backgrounds').remove([`${slug}/background.jpg`]);
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function sanitizeCor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : '#3d1f3a'; }

// Bloqueia links do tipo "javascript:" salvos nos botões da empresa,
// que executariam código na página pública.
function linkSeguro(url){
  const u = String(url||"").trim();
  return /^(https?:|tel:|mailto:)/i.test(u) ? u : '#';
}
function checkCapsLock(e, id){ const el=document.getElementById(id); if(el) el.style.display=e.getModifierState('CapsLock')?'flex':'none'; }
function applyAccent(cor){ document.documentElement.style.setProperty('--accent', cor || '#3d1f3a'); }

init();
