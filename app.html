<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda+">
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#555555;
    --paper:#f5f5f5;
    --card:#ffffff;
    --line:#e0e0e0;
    --accent:#1a1a1a;
    --danger:#a3423a;
    --ok:#3f6b4f;
    --radius:14px;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:14px 26px;border-radius:999px;
    font-size:15px;font-weight:600;letter-spacing:.02em;transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(0.88);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line);filter:none;}
  .btn.ghost:hover{border-color:var(--accent);filter:none;}
  .btn.danger{background:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  input,select,textarea{
    font-family:'Inter',sans-serif;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;width:100%;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:#1a1a1a;}
  label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
  .field{margin-bottom:18px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;}
  .container{max-width:520px;margin:0 auto;padding:32px 20px 80px;}
  .container.wide{max-width:960px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a;font-weight:700;margin-bottom:8px;}
  .top-plum{background:var(--accent);color:#fff;}
  .top-plum .eyebrow{color:rgba(255,255,255,0.7);}
  .muted{color:var(--ink-soft);}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
  }
  .chip.ok{background:#e3ede6;color:var(--ok);}
  .chip.blocked{background:#f3e2e0;color:var(--danger);}
  .service-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;transition:.15s;
  }
  .service-opt:hover{border-color:#1a1a1a;}
  .service-opt.selected{border-color:var(--accent);background:#f5f5f5;box-shadow:inset 0 0 0 1px var(--accent);}
  .slot{
    padding:10px 6px;text-align:center;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;
  }
  .slot.free{cursor:pointer;}
  .slot.free:hover{border-color:#1a1a1a;}
  .slot.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .slot.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed;}
  .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
  .hero{
    position:relative;min-height:100vh;display:flex;align-items:flex-end;background-size:cover;background-position:center;
  }
  .hero::before{
    content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 90%);
  }
  .hero-content{position:relative;z-index:1;padding:48px 28px 64px;color:#fff;width:100%;max-width:640px;margin:0 auto;text-align:center;}
  .hero-content h1{font-size:clamp(32px,7vw,52px);margin:0 0 10px;}
  .hero-content p{font-size:16px;opacity:.9;margin:0 0 28px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;}
  .topbar .brand{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-toggle{
    padding:10px;border-radius:10px;border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:13px;cursor:pointer;background:#fff;
  }
  .day-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:24px;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;text-decoration:underline;padding:0;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);}

  /* ── MOBILE FOUNDATION ─────────────────────────────────── */
  html { -webkit-text-size-adjust:100%; }
  body { -webkit-font-smoothing:antialiased; }

  /* Inputs com 16px evitam zoom automático no iOS */
  input,select,textarea { font-size:16px !important; min-height:48px; }

  /* Botões com área de toque mínima */
  .btn { min-height:48px; display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

  /* Slots maiores para toque */
  .slot { min-height:52px; display:flex; align-items:center; justify-content:center; }

  /* Serviço com área maior */
  .service-opt { min-height:56px; }

  /* Tabs com scroll horizontal sem barra */
  .tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:6px;
          scrollbar-width:none; -ms-overflow-style:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { white-space:nowrap; flex-shrink:0; min-height:40px;
         display:inline-flex; align-items:center; justify-content:center; }

  @media (max-width:600px){
    /* Containers com safe-area para notch e barra do iOS */
    .container {
      padding: 20px 16px calc(80px + env(safe-area-inset-bottom, 0px));
    }
    .container.wide {
      padding: 20px 16px calc(80px + env(safe-area-inset-bottom, 0px));
      max-width: 100%;
    }

    /* Cards com menos padding lateral */
    .card { padding:20px 16px; border-radius:12px; }

    /* Topbar compacta */
    .topbar { padding:12px 16px; }
    .topbar .brand { font-size:17px; }

    /* Botões menores lateralmente mas mantendo altura */
    .btn { padding:12px 18px; font-size:14px; }

    /* Slots grid com colunas menores */
    .slots-grid { grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; }

    /* Hero com safe-area no fundo */
    .hero-content {
      padding: 32px 20px calc(56px + env(safe-area-inset-bottom, 0px));
    }
    .hero-content h1 { font-size:clamp(28px,8vw,42px); }

    /* Rows empilham no mobile */
    .row { flex-direction:column; gap:0; }

    /* List-item com wrap para ações */
    .list-item { padding:14px 0; align-items:flex-start; flex-wrap:wrap; gap:8px; }
    .list-item > div:first-child { flex:1 1 100%; }

    /* Chip menor */
    .chip { font-size:11px; padding:4px 10px; }

    /* Topbar top-plum com safe-area no topo */
    .top-plum { padding-top:env(safe-area-inset-top, 0px); }

    /* Barra de aviso master */
    div[style*="background:#f0f0f0"] { padding:10px 16px; font-size:12px; }

    /* Eyebrow menor */
    .eyebrow { font-size:11px; }

    /* Field sem margin extra quando dentro de row */
    .row .field { margin-bottom:18px; }

    /* Botão de dias de agendamento */
    .dias-scroll {
      display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;
      scrollbar-width:none; -ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;
    }
    .dias-scroll::-webkit-scrollbar { display:none; }
    .dias-scroll .btn { flex-shrink:0; min-width:56px; padding:10px 8px; font-size:13px; }
  }

  @media (min-width:601px){
    .dias-scroll { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .dias-scroll .btn { flex:1; padding:10px 8px; font-size:13px; min-width:0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Modal de recorte de imagem (fora do #root para não ser destruído na navegação) -->
<div id="cropModal" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;overflow:hidden;max-width:480px;width:100%;display:flex;flex-direction:column;max-height:90vh;">
    <div style="padding:14px 20px;border-bottom:1px solid #e6e1ea;font-weight:700;font-size:16px;flex-shrink:0;">Ajuste a imagem</div>
    <div style="background:#111;overflow:hidden;flex:1;min-height:260px;"><img id="cropImg" src="" style="display:block;max-width:100%;"/></div>
    <div style="padding:14px 16px;display:flex;gap:12px;flex-shrink:0;">
      <button onclick="cancelarCrop()" style="flex:1;background:transparent;color:#1a1a1a;border:1.5px solid #e0e0e0;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Cancelar</button>
      <button id="btnConfirmarCrop" onclick="confirmarCrop()" style="flex:1;background:#1a1a1a;color:#fff;border:none;padding:12px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;">Confirmar recorte</button>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script>
let currentUser      = null;
let currentProfile   = null;
let modoRecuperacao  = false;   // true quando o usuário chega pelo link de redefinir senha

// Ícones padrão por tipo de botão
const ICONE_POR_TIPO = {
  whatsapp: '💬', instagram: '📸', telefone: '📞',
  maps: '📍', site: '🌐', link: '🔗'
};

let empresas = [];
let agendamentos = [];
let loaded = false;

// ── PWA ──────────────────────────────────────────────────────
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
function mostrarBannerPWA(){
  if(document.getElementById('pwa-banner')) return;
  if(!_pwaPrompt || sessionStorage.getItem('pwa-banner-dismissed')) return;
  const banner = document.createElement('div');
  banner.id = 'pwa-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9998;background:#1a1a1a;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.2);';
  banner.innerHTML = `
    <div style="flex:1;font-size:14px;font-weight:600;line-height:1.3;">Instale o Agenda+ no seu aparelho para acesso rápido</div>
    <button onclick="instalarPWA()" style="background:#fff;color:#1a1a1a;border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;">Instalar</button>
    <button onclick="dispensarPWA()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:0 4px;line-height:1;">×</button>
  `;
  document.body.appendChild(banner);
}
window.instalarPWA = async ()=>{
  if(!_pwaPrompt) return;
  _pwaPrompt.prompt();
  const { outcome } = await _pwaPrompt.userChoice;
  if(outcome === 'accepted') _pwaPrompt = null;
  dispensarPWA();
};
window.dispensarPWA = ()=>{
  sessionStorage.setItem('pwa-banner-dismissed','1');
  const b = document.getElementById('pwa-banner');
  if(b) b.remove();
};
// ─────────────────────────────────────────────────────────────

async function loadData(){
  try{
    const { data, error } = await supabaseClient.from('empresas').select('*');
    if(error) throw error;
    empresas = (data || []).map(e => ({
      id:                   e.id,
      slug:                 e.slug,
      nome:                 e.nome,
      fotoUrl:              e.foto_url              || '',
      whatsapp:             e.whatsapp              || '',

      bloqueada:            e.bloqueada,
      // Campos de personalização (Fase 2)
      descricao:            e.descricao             || '',
      logo:                 e.logo                  || '',
      corPrincipal:         e.cor_principal         || '#3d1f3a',
      textoDestaque:        e.texto_destaque        || '',
      // Relações
      servicos:             [],
      horariosPorMes:       {},
      bloqueios:            [],
      botoes:               []
    }));
  }catch(e){ console.error('Erro ao carregar empresas:', e); empresas = []; }

  if(empresas.length > 0){
    const ids = empresas.map(e => e.id);

    try{
      const { data } = await supabaseClient.from('servicos').select('*').in('empresa_id', ids);
      (data || []).forEach(s => {
        const emp = empresas.find(e => e.id === s.empresa_id);
        if(emp) emp.servicos.push({ id: s.id, nome: s.nome, duracao: s.duracao, preco: Number(s.preco) });
      });
    }catch(e){ console.error('Erro ao carregar serviços:', e); }

    try{
      const { data } = await supabaseClient.from('horarios_disponiveis').select('*').in('empresa_id', ids);
      (data || []).forEach(h => {
        const emp = empresas.find(e => e.id === h.empresa_id);
        if(!emp) return;
        emp.horariosPorMes[h.mes] = emp.horariosPorMes[h.mes] || [];
        if(!emp.horariosPorMes[h.mes].includes(h.hora)) emp.horariosPorMes[h.mes].push(h.hora);
      });
    }catch(e){ console.error('Erro ao carregar horários:', e); }

    try{
      const { data } = await supabaseClient.from('bloqueios').select('*').in('empresa_id', ids);
      (data || []).forEach(b => {
        const emp = empresas.find(e => e.id === b.empresa_id);
        if(emp) emp.bloqueios.push({ id: b.id, data: b.data, hora: b.hora });
      });
    }catch(e){ console.error('Erro ao carregar bloqueios:', e); }

    try{
      const { data } = await supabaseClient.from('botoes_empresa').select('*').in('empresa_id', ids);
      (data || []).forEach(b => {
        const emp = empresas.find(e => e.id === b.empresa_id);
        if(emp) emp.botoes.push({
          id: b.id, nome: b.nome, tipo: b.tipo, link: b.link,
          icone: b.icone || '', ordem: b.ordem, ativo: b.ativo,
          abrirNovaAba: b.abrir_nova_aba
        });
      });
      empresas.forEach(e => e.botoes.sort((a, b) => a.ordem - b.ordem));
    }catch(e){ console.error('Erro ao carregar botões:', e); }

    // Visitante comum lê apenas a view "horarios_ocupados" (sem nome/telefone).
    // Só master e dono da empresa carregam os dados completos do cliente.
    const podeVerDadosPessoais = currentProfile?.role === 'master'
                              || currentProfile?.role === 'owner_empresa';
    try{
      if(podeVerDadosPessoais){
        const { data } = await supabaseClient.from('agendamentos').select('*').in('empresa_id', ids);
        agendamentos = (data || []).map(a => {
          const emp = empresas.find(e => e.id === a.empresa_id);
          return {
            id:          a.id,
            slug:        emp ? emp.slug : '',
            servicoId:   a.servico_id,
            servicoNome: a.servico_nome,
            data:        a.data,
            hora:        a.hora,
            nome:        a.nome_cliente,
            telefone:    a.telefone,
            criadoEm:    a.criado_em
          };
        });
      } else {
        const { data } = await supabaseClient.from('horarios_ocupados').select('*').in('empresa_id', ids);
        agendamentos = (data || []).map(a => {
          const emp = empresas.find(e => e.id === a.empresa_id);
          return { slug: emp ? emp.slug : '', data: a.data, hora: a.hora };
        });
      }
    }catch(e){ console.error('Erro ao carregar agendamentos:', e); agendamentos = []; }

    // Carrega e-mail dos gestores (apenas para master)
    if(currentProfile?.role === 'master'){
      try{
        const { data } = await supabaseClient.from('profiles').select('empresa_id, email, status').eq('role','owner_empresa');
        (data || []).forEach(p => {
          const emp = empresas.find(e => e.id === p.empresa_id);
          if(emp){ emp.gestorEmail = p.email; emp.gestorStatus = p.status; }
        });
      }catch(e){ console.error('Erro ao carregar perfis:', e); }
    }
  } else {
    agendamentos = [];
  }

  loaded = true;
}

async function saveEmpresas(){
  const toRow = e => ({
    slug:                  e.slug,
    nome:                  e.nome,
    foto_url:              e.fotoUrl              || null,
    whatsapp:              e.whatsapp              || null,

    bloqueada:             e.bloqueada,
    // Campos de personalização (Fase 2)
    descricao:             e.descricao             || null,
    logo:                  e.logo                  || null,
    cor_principal:         e.corPrincipal          || '#3d1f3a',
    texto_destaque:        e.textoDestaque         || null,
  });

  const novas     = empresas.filter(e => !e.id);
  const existentes = empresas.filter(e =>  e.id);

  if(novas.length > 0){
    const { data, error } = await supabaseClient
      .from('empresas').insert(novas.map(toRow)).select();
    if(error){ console.error('Erro ao criar empresa:', error); return; }
    (data || []).forEach(row => {
      const emp = empresas.find(e => e.slug === row.slug);
      if(emp) emp.id = row.id;
    });
  }

  if(existentes.length > 0){
    const { error } = await supabaseClient
      .from('empresas')
      .upsert(existentes.map(e => ({ id: e.id, ...toRow(e) })), { onConflict: 'id' });
    if(error) console.error('Erro ao atualizar empresa:', error);
  }
}
function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

let currentRoute = { master:null, empresa:null, page:"" };

function getParams(){
  return currentRoute;
}
function goto(params){
  pararPolling();
  currentRoute = { master:null, empresa:null, page:"", ...params };
  route();
}

function defaultEmpresa(){
  return {
    slug:"", nome:"", fotoUrl:"", whatsapp:"", bloqueada:false,
    descricao:"", logo:"", corPrincipal:"#3d1f3a", textoDestaque:"",
    servicos:[], horariosPorMes:{}, bloqueios:[], botoes:[]
  };
}

// IMPORTANTE: usa a data LOCAL, não UTC.
// toISOString() converteria para UTC e, no Brasil (UTC-3), a partir
// das 21h o sistema passaria a considerar que já é o dia seguinte.
function mesKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function horariosDoMes(emp, key){
  const lista = (emp.horariosPorMes && emp.horariosPorMes[key]) || [];
  return [...lista].sort();
}
function isoData(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const root = document.getElementById('root');
function render(html){ root.innerHTML = html; }

let _pollInterval = null;
let _pollFn = null;
function iniciarPolling(fn){
  pararPolling();
  _pollFn = fn;
  _pollInterval = setInterval(async ()=>{
    await loadData();
    if(_pollFn) _pollFn();
  }, 30000);
}
function pararPolling(){
  if(_pollInterval){ clearInterval(_pollInterval); _pollInterval = null; _pollFn = null; }
}

// ---------- INIT ----------
async function init(){
  render(`<div class="loading">Carregando…</div>`);

  // Escuta mudanças de auth (inclui PASSWORD_RECOVERY vindo do e-mail)
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Trava a navegação: sem isso, o route() no fim do init()
      // apagaria a tela de redefinição assim que ela aparecesse.
      modoRecuperacao = true;
      currentUser = session?.user || null;
      renderRedefinirSenha();
      return;
    }
    currentUser = session?.user || null;
    if (currentUser) {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      currentProfile = data || null;
    } else {
      currentProfile = null;
    }
  });

  // Sessão existente (ex: ao recarregar a página)
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  if (currentUser) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = data || null;
  }

  await loadData();
  if(modoRecuperacao) return;   // não sobrepõe a tela de redefinir senha

  const params = new URLSearchParams(location.search);
  if(params.get('empresa')) currentRoute.empresa = params.get('empresa');
  else if(params.get('master')) currentRoute.master = 1;
  route();
}

function route(){
  const {master, empresa, page} = getParams();
  if(master){
    renderMaster();
  } else if(empresa){
    const emp = empresas.find(e=>e.slug===empresa);
    if(!emp){ renderNotFound(); return; }
    if(page==="agendar") renderAgendar(emp);
    else if(page==="confirmacao") renderConfirmacao(emp);
    else if(page==="gestao"){
      const isMaster = currentProfile?.role === 'master';
      const isOwner  = currentProfile?.role === 'owner_empresa'
                    && currentProfile?.empresa_id === emp.id
                    && currentProfile?.status === 'ativo';
      if(isMaster || isOwner){ renderGestao(emp); }
      else { renderGestaoLogin(emp); }
    }
    else renderHome(emp);
  } else {
    renderMaster();
  }
}

  if(currentProfile?.role !== 'master') return "";

}

// ---------- AGENDAMENTO ----------
let bookingState = {};
function renderAgendar(emp){
  applyAccent(emp.corPrincipal);
  bookingState = { servico:null, data:null, hora:null, nome:"", telefone:"" };

  function primeiros7Dias(emp){
    const out = [];
    const hoje = new Date();
    for(let i=0;i<120 && out.length<7;i++){
      const d = new Date(hoje);
      d.setDate(hoje.getDate()+i);
      const key = mesKey(d);
      const h = horariosDoMes(emp, key);
      if(h.length>0) out.push(d);
    }
    return out;
  }

  function draw(){
    const dias7 = primeiros7Dias(emp);

    const diasHtml = dias7.length ? dias7.map(d=>{
      const iso = isoData(d);
      const sel = bookingState.data===iso;
      const label = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      return `<button class="btn ${sel?'':'ghost'}" onclick="selectDia('${iso}')">${label}</button>`;
    }).join("") : `<p class="muted">Nenhuma data disponível.</p>`;

    // verifica se data selecionada não está nos 7 (veio do calendário)
    const dataForaDos7 = bookingState.data && !dias7.some(d=>isoData(d)===bookingState.data);
    const dataFmtOutra = bookingState.data && dataForaDos7
      ? new Date(bookingState.data+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
      : null;

    const slots = bookingState.data ? horariosDoMes(emp, bookingState.data.slice(0,7)) : [];
    const _agora = new Date();
    const _hojeIso = isoData(_agora);
    const slotsHtml = bookingState.data ? (slots.length ? slots.map(h=>{
      const taken = agendamentos.some(a=>a.slug===emp.slug && a.data===bookingState.data && a.hora===h);
      const bloqueado = (emp.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===h);
      const passado = bookingState.data === _hojeIso && (()=>{const [hh,mm]=h.split(':').map(Number); return hh*60+mm <= _agora.getHours()*60+_agora.getMinutes();})();
      const sel = bookingState.hora===h;
      if(taken || bloqueado || passado) return `<div class="slot taken">${h}</div>`;
      return `<div class="slot free ${sel?'selected':''}" onclick="selectHora('${h}')">${h}</div>`;
    }).join("") : `<p class="muted">Nenhum horário disponível nesta data.</p>`) : `<p class="muted">Escolha um dia primeiro.</p>`;

    const servicosHtml = emp.servicos.map(s=>{
      const sel = bookingState.servico===s.id;
      return `<div class="service-opt ${sel?'selected':''}" onclick="selectServico('${s.id}')">
        <strong>${escapeHtml(s.nome)}</strong>
      </div>`;
    }).join("");

    const telDigits = bookingState.telefone.replace(/\D/g,'');
    const telValido = telDigits.length === 12 && telDigits[0] === '0' && telDigits[3] === '9';
    const telErro   = telDigits.length > 0 && !telValido;
    const canSubmit = bookingState.servico && bookingState.data && bookingState.hora && bookingState.nome.trim() && telValido;

    render(`
      ${barraVoltarMaster()}
      <div class="topbar top-plum" style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;">
        <button class="icon-btn" style="color:rgba(255,255,255,0.85);font-size:22px;line-height:1;" onclick="goto({empresa:'${emp.slug}'})">←</button>
        <div class="brand" style="text-align:center;font-size:17px;">${escapeHtml(emp.nome)}</div>
        <div></div>
      </div>
      <div class="container">
        <div class="card">
          <div class="eyebrow">Passo 1</div>
          <h3 class="display">Escolha o serviço</h3>
          ${servicosHtml}

          <div class="eyebrow" style="margin-top:24px;">Passo 2</div>
          <h3 class="display">Escolha o dia</h3>
          <div class="dias-scroll">
            ${diasHtml}
            <button class="btn ${dataFmtOutra?'':'ghost'}" style="position:relative;flex-shrink:0;min-width:72px;" onclick="document.getElementById('calPicker').showPicker ? document.getElementById('calPicker').showPicker() : document.getElementById('calPicker').click()">
              ${dataFmtOutra ? dataFmtOutra : 'Outra data'}
              <input type="date" id="calPicker" value="${bookingState.data||''}" style="position:absolute;opacity:0;width:1px;height:1px;top:0;left:0;" onchange="selectDiaOutra(this.value)"/>
            </button>
          </div>

          <div class="eyebrow" style="margin-top:24px;">Passo 3</div>
          <h3 class="display">Escolha o horário</h3>
          <div class="slots-grid">${slotsHtml}</div>

          <div class="eyebrow" style="margin-top:24px;">Passo 4</div>
          <h3 class="display">Seus dados</h3>
          <div class="field"><label>Nome</label><input id="inpNome" value="${escapeAttr(bookingState.nome)}" oninput="bookingState.nome=this.value.toUpperCase();this.value=this.value.toUpperCase()" placeholder="SEU NOME" style="text-transform:uppercase;"/></div>
          <div class="field">
            <label>Telefone (WhatsApp)</label>
            <input id="inpTel" type="tel" inputmode="numeric" maxlength="12"
              value="${escapeAttr(bookingState.telefone)}"
              oninput="formatarTelefone(this)"
              placeholder="011912345678"/>
            <div id="telError" style="display:${telErro?'flex':'none'};align-items:flex-start;gap:6px;margin-top:8px;color:var(--danger);font-size:13px;line-height:1.4;">
              <span style="font-weight:700;font-size:15px;flex-shrink:0;">ⓘ</span>
              <span>Formato: 0 + DDD (2 dígitos) + 9 + número (8 dígitos). Ex: <strong>011912345678</strong></span>
            </div>
          </div>

          <button id="btnAgendar" class="btn" style="width:100%;margin-top:8px;" ${canSubmit?'':'disabled'} onclick="confirmarAgendamento('${emp.slug}')">Agendar</button>
        </div>
      </div>
    `);
  }
  window.selectServico = (id)=>{ bookingState.servico = id; draw(); };
  window.selectDia = (iso)=>{ bookingState.data = iso; bookingState.hora=null; draw(); };
  window.selectDiaOutra = (iso)=>{ if(iso){ bookingState.data = iso; bookingState.hora=null; draw(); } };
  window.selectHora = (h)=>{ bookingState.hora = h; draw(); };
  window.formatarTelefone = (input)=>{
    let v = input.value.replace(/\D/g,'');
    if(v.length > 0 && v[0] !== '0') v = '0' + v;
    v = v.slice(0, 12);
    input.value = v;
    bookingState.telefone = v;
    const digits = v;
    const valido = digits.length === 12 && digits[0] === '0' && digits[3] === '9';
    const erro = digits.length > 0 && !valido;
    const errEl = document.getElementById('telError');
    if(errEl) errEl.style.display = erro ? 'flex' : 'none';
    const btn = document.getElementById('btnAgendar');
    if(btn) btn.disabled = !(bookingState.servico && bookingState.data && bookingState.hora && bookingState.nome.trim() && valido);
  };
  draw();
}

async function confirmarAgendamento(slug){
  const emp = empresas.find(e=>e.slug===slug);
  const nomeInp = document.getElementById('inpNome');
  const telInp = document.getElementById('inpTel');
  bookingState.nome = nomeInp ? nomeInp.value : bookingState.nome;
  bookingState.telefone = telInp ? telInp.value : bookingState.telefone;
  const _digits = bookingState.telefone.replace(/\D/g,'');
  const _telOk = _digits.length === 12 && _digits[0] === '0' && _digits[3] === '9';
  if(!bookingState.servico || !bookingState.data || !bookingState.hora || !bookingState.nome.trim() || !_telOk) return;

  const jaOcupado = agendamentos.some(a=>a.slug===slug && a.data===bookingState.data && a.hora===bookingState.hora)
    || (emp.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===bookingState.hora);
  if(jaOcupado){ alert("Esse horário acabou de ser reservado ou bloqueado. Escolha outro."); renderAgendar(emp); return; }

  const servico = emp.servicos.find(s=>s.id===bookingState.servico);
  // Sem .select(): o visitante tem permissão de gravar, mas não de ler
  // a tabela de agendamentos (protege nome e telefone dos outros clientes).
  const { error } = await supabaseClient.from('agendamentos').insert({
    empresa_id:   emp.id,
    servico_id:   servico ? servico.id : null,
    servico_nome: servico ? servico.nome : '',
    data:         bookingState.data,
    hora:         bookingState.hora,
    nome_cliente: bookingState.nome.trim(),
    telefone:     bookingState.telefone.trim()
  });
  if(error){
    if(error.code === '23505'){ alert("Esse horário acabou de ser reservado. Escolha outro."); renderAgendar(emp); return; }
    alert("Erro ao realizar agendamento. Tente novamente."); return;
  }
  const novo = {
    slug,
    servicoId:   servico ? servico.id : null,
    servicoNome: servico ? servico.nome : '',
    data:        bookingState.data,
    hora:        bookingState.hora,
    nome:        bookingState.nome.trim(),
    telefone:    bookingState.telefone.trim()
  };
  agendamentos.push(novo);
  lastBooking = novo;
  goto({empresa:slug, page:'confirmacao'});
}

async function tentarLoginGestao(slug){
  const email = (document.getElementById('gestaoEmail').value || '').trim();
  const senha = document.getElementById('gestaoSenha').value;
  if(!email || !senha){ alert("Preencha e-mail e senha."); return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){ alert("E-mail ou senha incorretos."); return; }

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();

  if(!profile || profile.status !== 'ativo'){
    await supabaseClient.auth.signOut();
    alert("Conta bloqueada ou sem acesso. Entre em contato com o administrador.");
    return;
  }

  const emp = empresas.find(e=>e.slug===slug);
  if(profile.role !== 'owner_empresa' || profile.empresa_id !== emp?.id){
    await supabaseClient.auth.signOut();
    alert("Suas credenciais não têm acesso à gestão desta empresa.");
    return;
  }

  currentUser    = data.user;
  currentProfile = profile;
  renderGestao(emp);
}
window.recuperarSenha = async (slug)=>{
  const email = prompt("Digite seu e-mail para receber o link de redefinição de senha:");
  if(!email) return;
  const base = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? location.origin
    : 'https://saas-agendamento-seven.vercel.app';
  const redirectTo = base + '/app.html';
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
  if(error){ alert("Erro: " + error.message); return; }
  alert("Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.");
};

// ---------- GESTÃO (PAINEL) ----------
function renderGestao(empInicial){
  // 'let' porque o polling recria os objetos de empresa a cada 30s
  // e precisamos trocar a referência, senão a tela congela nos dados antigos.
  let emp = empInicial;
  applyAccent('#1a1a1a');
  dispensarPWA();
  let corner = null; // null = agendamentos | 'servicos' | 'horarios' | 'personalizar'
  let diaSelecionado = null;
  let editandoId = null;
  let mesHorario = mesKey(new Date());
  let novoBotaoState = null;
  let editandoBotaoId = null;

  function agendamentosBody(){
    if(diaSelecionado===null){
      // começa no dia de hoje independente de ter horário ou não
      diaSelecionado = isoData(new Date());
    }
    const dataObj = new Date(diaSelecionado+"T00:00:00");
    const dataFmt = dataObj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});

    function isoAddDias(iso, n){
      const d = new Date(iso+"T00:00:00");
      d.setDate(d.getDate()+n);
      return isoData(d);
    }

    const horarios = horariosDoMes(emp, diaSelecionado.slice(0,7));
    const linhas = horarios.length ? horarios.map(h=>{
      const ag = agendamentos.find(a=>a.slug===emp.slug && a.data===diaSelecionado && a.hora===h);
      const bloqueado = (emp.bloqueios||[]).some(b=>b.data===diaSelecionado && b.hora===h);
      if(ag && editandoId===ag.id){
        const servicoOpts = emp.servicos.map(s=>`<option value="${s.id}" ${ (ag.servicoId===s.id) ?'selected':''}>${escapeHtml(s.nome)}</option>`).join("");
        const horariosOpts = horarios.map(hh=>`<option value="${hh}" ${hh===ag.hora?'selected':''}>${hh}</option>`).join("");
        return `<div class="list-item" style="flex-direction:column;align-items:stretch;">
          <div class="field"><label>Nome</label><input id="editNome" value="${escapeAttr(ag.nome)}"/></div>
          <div class="field"><label>Telefone</label><input id="editTel" value="${escapeAttr(ag.telefone)}"/></div>
          <div class="row">
            <div class="field"><label>Serviço</label><select id="editServico">${servicoOpts}</select></div>
            <div class="field"><label>Horário</label><select id="editHora">${horariosOpts}</select></div>
          </div>
          <div class="row">

    return `

          <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;">${dataFmt}</div>
          <div style="font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:capitalize;margin:2px 0;">${diaNome}</div>
          <div class="muted" style="font-size:11px;">toque para escolher</div>
          <input type="date" id="calGestao" value="${diaSelecionado}" style="position:absolute;opacity:0;width:1px;height:1px;top:0;left:50%;" onchange="selecionarDiaGestao(this.value)"/>

        <button class="btn ghost" style="padding:10px 16px;font-size:18px;line-height:1;" onclick="selecionarDiaGestao('${isoAddDias(diaSelecionado,1)}')">&#8594;</button>

      <div style="text-align:center;margin-bottom:20px;">
        <button class="icon-btn" style="font-size:12px;color:var(--danger);" onclick="bloquearDiaTodo()">Bloquear dia todo</button>

    return `

        <div class="eyebrow" style="margin-bottom:12px;color:#1a1a1a;">Serviços disponíveis</div>

          <div class="list-item">
            <input value="${escapeAttr(s.nome)}" onchange="updServico(${i},'nome',this.value)"/>

  function personalizarBody(){
    const cor = emp.corPrincipal || '#3d1f3a';
    const botoesSorted = [...(emp.botoes || [])].sort((a,b) => a.ordem - b.ordem);

    const botoesHtml = botoesSorted.length ? `<div id="botoes-drag-list">${botoesSorted.map((b) => `
      <div class="list-item" data-id="${b.id}" draggable="true"
        style="flex-direction:column;align-items:stretch;gap:10px;padding:14px 0;cursor:default;transition:opacity .15s;"
        ondragstart="dragBotaoStart(event,'${b.id}')"
        ondragover="dragBotaoOver(event)"
        ondrop="dragBotaoDrop(event,'${b.id}')"
        ondragend="dragBotaoEnd(event)">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="color:#bbb;font-size:20px;cursor:grab;padding:0 4px;line-height:1;touch-action:none;" title="Arraste para reordenar">⠿</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:14px;">${escapeHtml(b.nome)}</div>
            <div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(b.link)}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn ghost" style="padding:6px 14px;font-size:12px;flex:1;" onclick="editarBotao('${b.id}')">Editar</button>
          <button class="btn ghost" style="padding:6px 14px;font-size:12px;color:var(--danger);border-color:var(--danger);flex:1;" onclick="removerBotao('${b.id}')">Excluir</button>
        </div>
      </div>
    `).join('')}</div>` : `<p class="muted" style="text-align:center;padding:16px 0;">Nenhum botão cadastrado ainda.</p>`;

    const formNovoBotao = novoBotaoState !== null ? `
      <div style="background:var(--paper);border-radius:12px;padding:20px 16px;margin-top:12px;border:1.5px solid var(--line);">
        <div class="eyebrow" style="margin-bottom:14px;color:#1a1a1a;">Novo botão</div>
        <div class="field"><label>Nome exibido</label><input id="bNome" placeholder="Ex: WhatsApp"/></div>
        <div class="field"><label>Tipo</label>
          <select id="bTipo">
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram</option>
            <option value="telefone">Telefone</option>
            <option value="maps">Google Maps</option>
            <option value="site">Site</option>
            <option value="link">Link personalizado</option>
          </select>
        </div>
        <div class="field"><label>Link</label><input id="bLink" placeholder="https://wa.me/5511999999999"/></div>
        <div class="row">
          <button class="btn ghost" onclick="cancelarNovoBotao()">Cancelar</button>
          <button class="btn" onclick="salvarNovoBotao()">Adicionar</button>
        </div>
      </div>
    ` : editandoBotaoId !== null ? (()=>{ const eb = emp.botoes.find(x=>x.id===editandoBotaoId)||{}; return `
      <div style="background:var(--paper);border-radius:12px;padding:20px 16px;margin-top:12px;border:1.5px solid var(--line);">
        <div class="eyebrow" style="margin-bottom:14px;color:#1a1a1a;">Editar botão</div>
        <div class="field"><label>Nome exibido</label><input id="ebNome" value="${escapeAttr(eb.nome||'')}"/></div>
        <div class="field"><label>Tipo</label>
          <select id="ebTipo">
            <option value="whatsapp" ${eb.tipo==='whatsapp'?'selected':''}>WhatsApp</option>
            <option value="instagram" ${eb.tipo==='instagram'?'selected':''}>Instagram</option>
            <option value="telefone" ${eb.tipo==='telefone'?'selected':''}>Telefone</option>
            <option value="maps" ${eb.tipo==='maps'?'selected':''}>Google Maps</option>
            <option value="site" ${eb.tipo==='site'?'selected':''}>Site</option>
            <option value="link" ${eb.tipo==='link'?'selected':''}>Link personalizado</option>
          </select>
        </div>
        <div class="field"><label>Link</label><input id="ebLink" value="${escapeAttr(eb.link||'')}"/></div>
        <div class="row">
          <button class="btn ghost" onclick="cancelarEdicaoBotao()">Cancelar</button>
          <button class="btn" onclick="salvarEdicaoBotao('${editandoBotaoId}')">Salvar</button>
        </div>
      </div>
    `; })() : `<button class="btn ghost" style="width:100%;margin-top:14px;" onclick="iniciarNovoBotao()">+ Adicionar botão</button>`;

    return `
      <div class="eyebrow" style="margin-bottom:16px;color:#1a1a1a;">Identidade visual</div>

      <div class="field"><label>Nome da empresa</label><input id="pNome" value="${escapeAttr(emp.nome)}"/></div>
      <div class="field"><label>Descrição curta</label><textarea id="pDescricao" rows="2" style="resize:vertical;min-height:80px;">${escapeHtml(emp.descricao||'')}</textarea></div>
      <div class="field"><label>Texto de destaque</label><input id="pTextoDestaque" value="${escapeAttr(emp.textoDestaque||'')}" placeholder="Ex: Atendimento premium"/></div>
      <div class="field">
        <label>Logo</label>
        ${emp.logo ? `<img src="${escapeAttr(emp.logo)}" style="width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin-bottom:10px;border:2px solid var(--line);"/>` : `<div style="width:90px;height:90px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:#999999;font-size:13px;text-align:center;">Sem logo</div>`}
        <button class="btn ghost" style="width:100%;" onclick="selecionarImagem('logo')">Enviar logo</button>
      </div>
      <div class="field">
        <label>Imagem de fundo</label>
        ${emp.fotoUrl ? `<img src="${escapeAttr(emp.fotoUrl)}" style="width:100%;height:110px;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px;border:1.5px solid var(--line);"/>` : `<div style="width:100%;height:110px;border-radius:10px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:#999999;font-size:13px;">Sem imagem de fundo</div>`}
        <button class="btn ghost" style="width:100%;" onclick="selecionarImagem('background')">Enviar imagem de fundo</button>
      </div>
      <div class="field">
        <label>Cor principal</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <input type="color" id="pCor" value="${escapeAttr(cor)}" style="padding:4px;height:48px;width:64px;border-radius:10px;cursor:pointer;"/>
          <span class="muted" style="font-size:13px;">Usada nos botões e destaques da página</span>
        </div>
      </div>

      <button class="btn" style="width:100%;" onclick="salvarInfoEmpresa()">Salvar informações</button>
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost" style="flex:1;" onclick="goto({empresa:'${emp.slug}'})">Ver página</button>
        <button class="btn ghost" style="flex:1;" onclick="compartilharLink()">Compartilhar link</button>
      </div>

      <div class="eyebrow" style="margin-top:36px;margin-bottom:4px;color:#1a1a1a;">Botões da página</div>
      <p class="muted" style="font-size:13px;margin:0 0 16px;">Aparecem na página pública abaixo do botão de agendamento.</p>
      ${botoesHtml}
      ${formNovoBotao}
    `;
  }

  function draw(){
    const body = corner==='configurar'   ? configurarBody()
               : corner==='personalizar' ? personalizarBody()
               : agendamentosBody();
    render(`
      <div style="position:sticky;top:0;z-index:100;background:var(--paper);">
        ${barraVoltarMaster()}
        <div class="topbar" style="background:#1a1a1a;color:#fff;"><div class="brand">${escapeHtml(emp.nome)} · Gestão</div>${currentProfile?.role==='master'?`<button class="icon-btn" style="color:#fff;" onclick="goto({empresa:'${emp.slug}'})">← Voltar</button>`:`<button class="icon-btn" style="color:#fff;" onclick="gestaoLogout('${emp.slug}')">Sair</button>`}</div>
        <div class="tabs" style="padding:8px 16px 0;border-bottom:1.5px solid var(--line);margin:0;gap:0;background:var(--paper);">
          <div class="tab ${!corner?'active':''}" style="flex:1;text-align:center;padding:10px 6px;font-size:14px;${!corner?'background:#1a1a1a;color:#fff;border-color:#1a1a1a;':''}" onclick="setCorner(null)">Agendamentos</div>
          <div class="tab ${corner==='configurar'?'active':''}" style="flex:1;text-align:center;padding:10px 6px;font-size:14px;${corner==='configurar'?'background:#1a1a1a;color:#fff;border-color:#1a1a1a;':''}" onclick="setCorner('configurar')">Configurar</div>
          <div class="tab ${corner==='personalizar'?'active':''}" style="flex:1;text-align:center;padding:10px 6px;font-size:14px;${corner==='personalizar'?'background:#1a1a1a;color:#fff;border-color:#1a1a1a;':''}" onclick="setCorner('personalizar')">Personalizar</div>
        </div>
      </div>
      <div class="container wide">
        <div class="card" style="${corner==='configurar'?'background:none;box-shadow:none;padding:0;':''}">${body}</div>
      </div>
    `);
  }

  window.setCorner = (c)=>{ corner=c; editandoId=null; draw(); };
  window.selecionarDiaGestao = (iso)=>{ diaSelecionado=iso; editandoId=null; draw(); };

  window.selecionarImagem = (tipo)=>{
    abrirCrop(tipo, emp.slug, async (url)=>{
      if(tipo==='logo'){ emp.logo = url; } else { emp.fotoUrl = url; }
      draw();
    });
  };

  window.bloquearDiaTodo = async ()=>{
    const horarios = horariosDoMes(emp, diaSelecionado.slice(0,7));
    if(!horarios.length){ alert("Nenhum horário configurado para este dia."); return; }
    const livres = horarios.filter(h => !((emp.bloqueios||[]).some(b=>b.data===diaSelecionado && b.hora===h)));
    if(!livres.length){ alert("Todos os horários deste dia já estão bloqueados."); return; }
    const dataFmtConf = new Date(diaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(!confirm(`Bloquear todos os ${livres.length} horários de ${dataFmtConf}?`)) return;
    const rows = livres.map(h=>({ empresa_id: emp.id, data: diaSelecionado, hora: h }));
    const { data, error } = await supabaseClient.from('bloqueios').insert(rows).select();
    if(error){ alert("Erro ao bloquear: " + error.message); return; }
    if(data) data.forEach(r=>{ (emp.bloqueios=emp.bloqueios||[]).push({id:r.id, data:r.data, hora:r.hora}); });
    draw();
  };

  window.editarAgendamento = (id)=>{ editandoId=id; draw(); };
  window.cancelarEdicaoAgendamento = ()=>{ editandoId=null; draw(); };
  window.salvarEdicaoAgendamento = async (id)=>{
    const ag = agendamentos.find(a=>a.id===id);
    const nome = document.getElementById('editNome').value.trim();
    const tel = document.getElementById('editTel').value.trim();
    const servicoId = document.getElementById('editServico').value;
    const hora = document.getElementById('editHora').value;
    if(!nome || !tel){ alert("Preencha nome e telefone."); return; }
    if(hora !== ag.hora){
      const ocupado = agendamentos.some(a=>a.id!==ag.id && a.slug===emp.slug && a.data===ag.data && a.hora===hora);
      if(ocupado){ alert("Esse horário já está ocupado."); return; }
    }
    const servico = emp.servicos.find(s=>s.id===servicoId);
    const { error } = await supabaseClient.from('agendamentos').update({
      nome_cliente: nome,
      telefone:     tel,
      servico_id:   servicoId,
      servico_nome: servico ? servico.nome : ag.servicoNome,
      hora:         hora
    }).eq('id', id);
    if(error){ console.error('Erro ao editar agendamento:', error); return; }
    ag.nome = nome; ag.telefone = tel; ag.servicoId = servicoId; ag.servicoNome = servico?servico.nome:ag.servicoNome; ag.hora = hora;
    editandoId = null; draw();
  };
  window.cancelarAgendamento = async (id)=>{
    if(!confirm('Cancelar este agendamento? Essa ação não pode ser desfeita.')) return;
    const { error } = await supabaseClient.from('agendamentos').delete().eq('id', id);
    if(error){ console.error('Erro ao cancelar agendamento:', error); return; }
    agendamentos = agendamentos.filter(a=>a.id!==id);
    draw();
  };
  window.bloquearHorario = async (data,hora)=>{
    const { data: row, error } = await supabaseClient.from('bloqueios').insert({
      empresa_id: emp.id, data, hora
    }).select().single();
    if(error){ console.error('Erro ao bloquear horário:', error); return; }
    emp.bloqueios = emp.bloqueios || [];
    emp.bloqueios.push({ id: row.id, data, hora });
    draw();
  };
  window.desbloquearHorario = async (data,hora)=>{
    const { error } = await supabaseClient.from('bloqueios')
      .delete().eq('empresa_id', emp.id).eq('data', data).eq('hora', hora);
    if(error){ console.error('Erro ao desbloquear horário:', error); return; }
    emp.bloqueios = (emp.bloqueios||[]).filter(b=>!(b.data===data && b.hora===hora));
    draw();
  };

  window.adicionarServico = async ()=>{
    const inp = document.getElementById('novoServicoInput');
    const nome = inp ? inp.value.trim() : '';
    if(!nome){ alert("Digite o nome do serviço."); return; }
    const { data: row, error } = await supabaseClient.from('servicos').insert({
      empresa_id: emp.id, nome, duracao: 60, preco: 0
    }).select().single();
    if(error){ console.error('Erro ao adicionar serviço:', error); return; }
    emp.servicos.push({ id: row.id, nome: row.nome, duracao: row.duracao, preco: Number(row.preco) });
    draw();
  };
  window.removeServico = async (i)=>{
    const s = emp.servicos[i];
    if(!confirm(`Remover o serviço "${s.nome}"?`)) return;
    const { error } = await supabaseClient.from('servicos').delete().eq('id', s.id);
    if(error){ console.error('Erro ao remover serviço:', error); return; }
    emp.servicos.splice(i,1);
    draw();
  };
  window.updServico = async (i,field,val)=>{
    const s = emp.servicos[i];
    const dbVal = (field==='duracao'||field==='preco') ? Number(val) : val;
    s[field] = dbVal;
    const { error } = await supabaseClient.from('servicos').update({ [field]: dbVal }).eq('id', s.id);
    if(error) console.error('Erro ao atualizar serviço:', error);
  };

  window.mudarMesHorario = (val)=>{ mesHorario = val; draw(); };
  window.adicionarHorario = async ()=>{
    const val = document.getElementById('novoHorarioInput').value;
    if(!val){ return; }
    emp.horariosPorMes = emp.horariosPorMes || {};
    const lista = emp.horariosPorMes[mesHorario] || [];
    if(lista.includes(val)){ return; }
    const { error } = await supabaseClient.from('horarios_disponiveis').insert({
      empresa_id: emp.id, mes: mesHorario, hora: val
    });
    if(error){ console.error('Erro ao adicionar horário:', error); return; }
    lista.push(val);
    emp.horariosPorMes[mesHorario] = lista;
    draw();
  };
  window.removerHorario = async (h)=>{
    const { error } = await supabaseClient.from('horarios_disponiveis')
      .delete().eq('empresa_id', emp.id).eq('mes', mesHorario).eq('hora', h);
    if(error){ console.error('Erro ao remover horário:', error); return; }
    emp.horariosPorMes[mesHorario] = (emp.horariosPorMes[mesHorario]||[]).filter(x=>x!==h);
    draw();
  };

  // ── PERSONALIZAR PÁGINA ──────────────────────────────────

  window.salvarInfoEmpresa = async ()=>{
    emp.nome               = document.getElementById('pNome').value.trim() || emp.nome;
    emp.descricao          = document.getElementById('pDescricao').value.trim();
    emp.textoDestaque      = document.getElementById('pTextoDestaque').value.trim();
    emp.corPrincipal       = document.getElementById('pCor').value;
    const { error } = await supabaseClient.from('empresas').update({
      nome:                  emp.nome,
      descricao:             emp.descricao             || null,
      cor_principal:         emp.corPrincipal,
      texto_destaque:        emp.textoDestaque         || null,
    }).eq('id', emp.id);
    if(error){ console.error('Erro ao salvar informações:', error); alert('Erro ao salvar. Verifique o console.'); return; }
    alert('Informações salvas!');
    draw();
  };

  window.iniciarNovoBotao  = ()=>{ novoBotaoState = {}; editandoBotaoId = null; draw(); };
  window.cancelarNovoBotao = ()=>{ novoBotaoState = null; draw(); };
  window.editarBotao       = (id)=>{ editandoBotaoId = id; novoBotaoState = null; draw(); };
  window.cancelarEdicaoBotao = ()=>{ editandoBotaoId = null; draw(); };
  window.salvarEdicaoBotao = async (id)=>{
    const nome    = document.getElementById('ebNome').value.trim();
    const tipo    = document.getElementById('ebTipo').value;
    const link    = document.getElementById('ebLink').value.trim();
    if(!nome){ alert('Preencha o nome do botão.'); return; }
    if(!link){ alert('Preencha o link do botão.'); return; }
    const { error } = await supabaseClient.from('botoes_empresa').update({
      nome, tipo, link, icone: ICONE_POR_TIPO[tipo] || '🔗', abrir_nova_aba: true
    }).eq('id', id);
    if(error){ console.error('Erro ao editar botão:', error); alert('Erro ao salvar.'); return; }
    const b = emp.botoes.find(x=>x.id===id);
    Object.assign(b, { nome, tipo, link, icone: ICONE_POR_TIPO[tipo] || '🔗', abrirNovaAba: true });
    editandoBotaoId = null;
    draw();
  };

  window.salvarNovoBotao = async ()=>{
    const nome    = document.getElementById('bNome').value.trim();
    const tipo    = document.getElementById('bTipo').value;
    const link    = document.getElementById('bLink').value.trim();
    if(!nome){ alert('Preencha o nome do botão.'); return; }
    if(!link){ alert('Preencha o link do botão.'); return; }
    const ordemMax = emp.botoes.length > 0 ? Math.max(...emp.botoes.map(b=>b.ordem)) + 1 : 0;
    const { data: row, error } = await supabaseClient.from('botoes_empresa').insert({
      empresa_id:    emp.id,
      nome, tipo, link,
      icone:         ICONE_POR_TIPO[tipo] || '🔗',
      ordem:         ordemMax,
      ativo:         true,
      abrir_nova_aba: true
    }).select().single();
    if(error){ console.error('Erro ao adicionar botão:', error); alert('Erro ao salvar. Verifique o console.'); return; }
    emp.botoes.push({ id:row.id, nome:row.nome, tipo:row.tipo, link:row.link,
      icone:row.icone, ordem:row.ordem, ativo:row.ativo, abrirNovaAba:row.abrir_nova_aba });
    emp.botoes.sort((a,b)=>a.ordem-b.ordem);
    novoBotaoState = null;
    draw();
  };

  window.removerBotao = async (id)=>{
    if(!confirm('Remover este botão?')) return;
    const { error } = await supabaseClient.from('botoes_empresa').delete().eq('id', id);
    if(error){ console.error('Erro ao remover botão:', error); return; }
    emp.botoes = emp.botoes.filter(b=>b.id!==id);
    draw();
  };

  let _dragFromId = null;
  window.dragBotaoStart = (e, id)=>{
    _dragFromId = id;
    e.currentTarget.style.opacity = '0.4';
    e.dataTransfer.effectAllowed = 'move';
  };
  window.dragBotaoOver = (e)=>{
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  };
  window.dragBotaoEnd = (e)=>{
    e.currentTarget.style.opacity = '';
  };
  window.dragBotaoDrop = async (e, toId)=>{
    e.preventDefault();
    if(!_dragFromId || _dragFromId === toId) return;
    const fromIdx = emp.botoes.findIndex(b=>b.id===_dragFromId);
    const toIdx   = emp.botoes.findIndex(b=>b.id===toId);
    if(fromIdx < 0 || toIdx < 0) return;
    const moved = emp.botoes.splice(fromIdx, 1)[0];
    emp.botoes.splice(toIdx, 0, moved);
    emp.botoes.forEach((b, i) => b.ordem = i);
    _dragFromId = null;
    await Promise.all(emp.botoes.map(b =>
      supabaseClient.from('botoes_empresa').update({ ordem: b.ordem }).eq('id', b.id)
    ));
    draw();
  };

  window.compartilharLink = async ()=>{
    const url = location.origin + '/app.html?empresa=' + emp.slug;
    if(navigator.share){
      try{ await navigator.share({ title: emp.nome, url }); } catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(url); alert('Link copiado!'); }
      catch(e){ prompt('Copie o link abaixo:', url); }
    }
  };

  draw();
  iniciarPolling(()=>{
    // Reaponta para o objeto novo criado pelo loadData()
    const atual = empresas.find(e => e.slug === emp.slug);
    if(atual) emp = atual;
    if(corner===null) draw();
  });
}

  renderMasterPanel();
}

window.tentarLoginMaster = async ()=>{
  const email = (document.getElementById('masterEmail').value || '').trim();
  const senha = document.getElementById('masterPass').value;
  if(!email || !senha){ alert("Preencha e-mail e senha."); return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){ alert("E-mail ou senha incorretos."); return; }

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
  if(!profile || profile.role !== 'master'){
    await supabaseClient.auth.signOut();
    alert("Essa conta não tem acesso ao painel master.");
    return;
  }

  currentUser    = data.user;
  currentProfile = profile;
  renderMasterPanel();
};

let editingSlug = null;
let masterShowForm = false;
let masterSearch = '';
function renderMasterPanel(){
  applyAccent('#1a1a1a');
  mostrarBannerPWA();
  function draw(){
    const editing = editingSlug ? empresas.find(e=>e.slug===editingSlug) : null;
    const form = editing ? `
      <div class="card" style="margin-bottom:24px;">
        <h3 class="display">Editar empresa</h3>
        <div class="field"><label>Nome</label><input value="${escapeAttr(editing.nome)}" onchange="masterUpd('nome',this.value)"/></div>
        <div class="field"><label>WhatsApp</label><input value="${escapeAttr(editing.whatsapp)}" onchange="masterUpd('whatsapp',this.value)"/></div>
        <div class="field">
          <label>Link público</label>
          <input readonly value="${escapeAttr(location.origin+'/app.html?empresa='+editing.slug)}" onclick="this.select()"/>
        </div>
        <div class="field">
          <label>E-mail do gestor</label>
          <input readonly value="${escapeAttr(editing.gestorEmail||'Não cadastrado')}" style="background:#f5f5f5;color:var(--ink-soft);" onclick="this.select()"/>
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="btn" onclick="editingSlug=null; drawMaster();">Salvar</button>
          <button class="btn ghost" onclick="masterToggleBloqueio()">${editing.bloqueada?'Desbloquear':'Bloquear'}</button>
        </div>
        <button class="btn ghost" style="width:100%;margin-top:10px;" onclick="masterRedefinirSenha()">Redefinir senha do gestor</button>
        <button class="btn danger" style="width:100%;margin-top:10px;" onclick="masterExcluir('${editing.slug}')">Excluir empresa</button>
      </div>
    ` : masterShowForm ? `
      <div class="card" style="margin-bottom:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <h3 class="display" style="margin:0;">Nova empresa</h3>
          <button class="icon-btn" style="font-size:22px;color:var(--ink-soft);" onclick="masterShowForm=false; drawMaster();">×</button>
        </div>
        <div class="field"><label>Nome da empresa</label><input id="novoNome" placeholder="Ex: Studio Bella"/></div>
        <div class="field"><label>WhatsApp (com DDD)</label><input id="novoWhats" placeholder="11912345678"/></div>
        <div class="field"><label>E-mail do gestor</label><input type="email" id="novoEmail" placeholder="gestor@email.com"/></div>
        <div class="field"><label>Senha temporária</label><input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres"/></div>
        <button class="btn" style="width:100%;" onclick="masterCriar()">Criar empresa</button>
      </div>
    ` : '';

    const listaFiltrada = masterSearch
      ? empresas.filter(e => e.nome.toLowerCase().includes(masterSearch.toLowerCase()))
      : empresas;

    const lista = listaFiltrada.length ? `<div style="display:flex;flex-direction:column;gap:10px;">${listaFiltrada.map(e=>{
      const link = location.origin + '/app.html?empresa=' + e.slug;
      return `
      <div style="background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;">
          <div style="min-width:0;flex:1;">
            <div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;">${escapeHtml(e.nome)}</div>
            <div style="font-size:12px;color:var(--ink-soft);word-break:break-all;">${escapeHtml(link)}</div>
          </div>
          <span class="chip ${e.bloqueada?'blocked':'ok'}" style="flex-shrink:0;">${e.bloqueada?'Bloqueada':'Ativa'}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="goto({empresa:'${e.slug}'})">Visualizar</button>
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="goto({empresa:'${e.slug}', page:'gestao'})">Ver gestão</button>
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="navigator.clipboard.writeText('${escapeAttr(link)}').then(()=>alert('Link copiado!'))">Copiar link</button>
          <button class="btn ghost" style="padding:0 12px;font-size:13px;height:40px;" onclick="editingSlug='${e.slug}'; drawMaster();">Editar</button>
        </div>
      </div>`;
    }).join('')}</div>` : `<p class="muted">${masterSearch ? 'Nenhuma empresa encontrada.' : 'Nenhuma empresa cadastrada ainda.'}</p>`;

    render(`
      <div class="topbar" style="background:#1a1a1a;color:#fff;"><div class="brand">Agenda+ · Master</div><button class="icon-btn" style="color:#fff;" onclick="masterLogout()">Sair</button></div>
      <div class="container wide">
        ${form}
        <div class="card">
          ${!editing ? `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
              <div>
                <h3 class="display" style="margin:0;">Empresas cadastradas</h3>
                <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">${empresas.length} ${empresas.length === 1 ? 'empresa' : 'empresas'}</div>
              </div>
              ${!masterShowForm ? `<button class="btn" style="white-space:nowrap;" onclick="masterShowForm=true; drawMaster();">+ Cadastrar nova empresa</button>` : ''}
            </div>
            <div class="field" style="margin-bottom:20px;">
              <input placeholder="Buscar empresa..." value="${escapeAttr(masterSearch)}" oninput="masterSearch=this.value; drawMaster()" style="background:#f5f5f5;border-color:#e0e0e0;"/>
            </div>
            ${lista}
          ` : lista}
        </div>
      </div>
    `);
  }
  window.drawMaster = draw;
  window.masterCriar = async ()=>{
    const nome  = document.getElementById('novoNome').value.trim();
    const email = document.getElementById('novoEmail').value.trim();
    const senha = document.getElementById('novaSenha').value;
    if(!nome){ alert("Digite o nome da empresa."); return; }
    if(!email){ alert("Digite o e-mail do gestor."); return; }
    if(senha.length < 6){ alert("A senha deve ter pelo menos 6 caracteres."); return; }

    // 1. Cria a empresa no banco
    let slug = slugify(nome);
    let s2 = slug, n=1;
    while(empresas.some(e=>e.slug===s2)){ s2 = slug+"-"+(++n); }
    const nova = defaultEmpresa();
    nova.slug = s2; nova.nome = nome;
    nova.whatsapp = document.getElementById('novoWhats').value.trim();
    empresas.push(nova);
    await saveEmpresas();

    const empCriada = empresas.find(e=>e.slug===s2);
    if(!empCriada?.id){
      // A gravação falhou: remove a empresa que só existia na tela,
      // senão ela ficaria aparecendo na lista até recarregar a página.
      empresas = empresas.filter(e=>e.slug!==s2);

      masterShowForm = false; draw(); return;
    }

    // 2. Cria o usuário gestor via API segura
    const { data: { session } } = await supabaseClient.auth.getSession();
    let apiOk = false;
    try {
      const resp = await fetch('/api/create-user', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token
        },
        body: JSON.stringify({ email, password: senha, nome, empresa_id: empCriada.id })
      });
      if(!resp.ok){
        const err = await resp.json();
        alert("Empresa criada, mas erro ao criar usuário: " + (err.error || 'Erro desconhecido') +
              "\n\nVocê pode criar o usuário manualmente no Supabase.");
      } else {
        apiOk = true;
      }
    } catch(e) {
      alert("Empresa criada, mas não foi possível contatar a API de criação de usuário.\n\nCrie o usuário manualmente no Supabase.");
    }

    masterShowForm = false;
    if(apiOk){
      alert(`Empresa "${nome}" criada com sucesso!\n\nCredenciais do gestor:\nE-mail: ${email}\nSenha: ${senha}\n\nGuarde essas informações e compartilhe com o gestor.`);
    }
    draw();
  };
  window.masterUpd = async (field,val)=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e[field] = val; await saveEmpresas();
  };
  window.masterToggleBloqueio = async ()=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e.bloqueada = !e.bloqueada; await saveEmpresas(); draw();
  };
  window.masterExcluir = async (slug)=>{
    const e = empresas.find(x=>x.slug===slug);
    if(!confirm(`Excluir "${e.nome}" definitivamente? Isso também apaga os agendamentos dela. Essa ação não pode ser desfeita.`)) return;
    if(e.id){
      const { error } = await supabaseClient.from('empresas').delete().eq('id', e.id);
      if(error){ console.error('Erro ao excluir empresa:', error); return; }
    }
    empresas = empresas.filter(x=>x.slug!==slug);
    agendamentos = agendamentos.filter(a=>a.slug!==slug);
    await excluirImagensEmpresa(slug);
    editingSlug = null;
    draw();
  };
  draw();
  iniciarPolling(()=>{ if(!editingSlug) draw(); });
}

// ── UPLOAD DE IMAGENS ────────────────────────────────────────
let _cropInstance = null;
let _cropCallback = null;
let _cropTipo = null;
let _cropSlug = null;

function validarArquivo(file){
  const tipos = ['image/jpeg','image/png','image/webp'];
  if(!tipos.includes(file.type)) return 'Formato inválido. Use JPG, PNG ou WEBP.';
  if(file.size > 5 * 1024 * 1024) return 'Arquivo muito grande. Máximo 5 MB.';
  return null;
}

function abrirCrop(tipo, slug, callback){
  _cropTipo = tipo; _cropSlug = slug; _cropCallback = callback;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/jpeg,image/png,image/webp';
  input.onchange = (ev)=>{
    const file = ev.target.files[0]; if(!file) return;
    const err = validarArquivo(file); if(err){ alert(err); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const modal = document.getElementById('cropModal');
      const img   = document.getElementById('cropImg');
      img.src = e.target.result;
      modal.style.display = 'flex';
      if(_cropInstance){ _cropInstance.destroy(); _cropInstance = null; }
      const ratio = tipo==='logo' ? 1 : 16/9;
      _cropInstance = new Cropper(img, { aspectRatio: ratio, viewMode: 1, autoCropArea: 0.9, movable: true, zoomable: true, rotatable: false, scalable: false });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function confirmarCrop(){
  if(!_cropInstance) return;
  const btn = document.getElementById('btnConfirmarCrop');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const isLogo = _cropTipo === 'logo';
  const w = isLogo ? 540 : 1280, h = isLogo ? 540 : 720;
  const canvas = _cropInstance.getCroppedCanvas({ width: w, height: h, imageSmoothingQuality: 'high' });
  canvas.toBlob(async (blob)=>{
    const bucket = isLogo ? 'logos' : 'backgrounds';
    const path   = `${_cropSlug}/${isLogo ? 'logo' : 'background'}.jpg`;
    const { error: upErr } = await supabaseClient.storage.from(bucket).upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if(upErr){ alert('Erro ao enviar imagem: ' + upErr.message); btn.disabled=false; btn.textContent='Confirmar recorte'; return; }
    const { data } = supabaseClient.storage.from(bucket).getPublicUrl(path);
    const url = data.publicUrl + '?t=' + Date.now();
    const col = isLogo ? 'logo' : 'foto_url';
    const emp = empresas.find(x=>x.slug===_cropSlug);
    if(emp && emp.id){
      await supabaseClient.from('empresas').update({ [col]: url }).eq('id', emp.id);
    }
    const cb = _cropCallback;
    fecharCrop();
    if(cb) cb(url);
  }, 'image/jpeg', 0.92);
}

function cancelarCrop(){ fecharCrop(); }

function fecharCrop(){
  document.getElementById('cropModal').style.display = 'none';
  if(_cropInstance){ _cropInstance.destroy(); _cropInstance = null; }
  const btn = document.getElementById('btnConfirmarCrop');
  btn.disabled = false; btn.textContent = 'Confirmar recorte';
  _cropCallback = null; _cropTipo = null; _cropSlug = null;
}

async function excluirImagensEmpresa(slug){
  await supabaseClient.storage.from('logos').remove([`${slug}/logo.jpg`]);
  await supabaseClient.storage.from('backgrounds').remove([`${slug}/background.jpg`]);
}
// ─────────────────────────────────────────────────────────────

function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// Bloqueia links do tipo "javascript:" salvos nos botões da empresa,
// que executariam código na página pública.
function linkSeguro(url){
  const u = String(url||"").trim();
  return /^(https?:|tel:|mailto:)/i.test(u) ? u : '#';
}
function checkCapsLock(e, id){ const el=document.getElementById(id); if(el) el.style.display=e.getModifierState('CapsLock')?'flex':'none'; }
function applyAccent(cor){ document.documentElement.style.setProperty('--accent', cor || '#3d1f3a'); }

init();
