<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Agenda+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1620;
    --ink-soft:#4a4350;
    --paper:#f7f5f8;
    --card:#ffffff;
    --line:#e6e1ea;
    --plum:#3d1f3a;
    --plum-deep:#2a1428;
    --accent:#3d1f3a;
    --gold:#b8935f;
    --gold-soft:#e9dcc7;
    --danger:#a3423a;
    --ok:#3f6b4f;
    --radius:14px;
    --shadow:0 10px 30px -12px rgba(43,20,40,0.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:14px 26px;border-radius:999px;
    font-size:15px;font-weight:600;letter-spacing:.02em;transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(0.88);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.gold{background:var(--gold);color:var(--plum-deep);filter:none;}
  .btn.gold:hover{background:#a67e4c;filter:none;}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line);filter:none;}
  .btn.ghost:hover{border-color:var(--accent);filter:none;}
  .btn.danger{background:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  input,select,textarea{
    font-family:'Inter',sans-serif;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;width:100%;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
  label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
  .field{margin-bottom:18px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;}
  .container{max-width:520px;margin:0 auto;padding:32px 20px 80px;}
  .container.wide{max-width:960px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px;}
  .top-plum{background:var(--accent);color:#fff;}
  .top-plum .eyebrow{color:var(--gold-soft);}
  .muted{color:var(--ink-soft);}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
  }
  .chip.ok{background:#e3ede6;color:var(--ok);}
  .chip.blocked{background:#f3e2e0;color:var(--danger);}
  .service-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;transition:.15s;
  }
  .service-opt:hover{border-color:var(--gold);}
  .service-opt.selected{border-color:var(--accent);background:#faf7fb;box-shadow:inset 0 0 0 1px var(--accent);}
  .slot{
    padding:10px 6px;text-align:center;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:600;
  }
  .slot.free{cursor:pointer;}
  .slot.free:hover{border-color:var(--gold);}
  .slot.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .slot.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed;}
  .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
  .hero{
    position:relative;min-height:100vh;display:flex;align-items:flex-end;background-size:cover;background-position:center;
  }
  .hero::before{
    content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,10,20,0.15) 0%, rgba(20,10,20,0.75) 90%);
  }
  .hero-content{position:relative;z-index:1;padding:48px 28px 64px;color:#fff;width:100%;max-width:640px;margin:0 auto;text-align:center;}
  .hero-content h1{font-size:clamp(32px,7vw,52px);margin:0 0 10px;}
  .hero-content p{font-size:16px;opacity:.9;margin:0 0 28px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;}
  .topbar .brand{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-toggle{
    padding:10px;border-radius:10px;border:1.5px solid var(--line);text-align:center;font-weight:700;font-size:13px;cursor:pointer;background:#fff;
  }
  .day-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:24px;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;text-decoration:underline;padding:0;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);}

  /* ── MOBILE FOUNDATION ─────────────────────────────────── */
  html { -webkit-text-size-adjust:100%; }
  body { -webkit-font-smoothing:antialiased; }

  /* Inputs com 16px evitam zoom automático no iOS */
  input,select,textarea { font-size:16px !important; min-height:48px; }

  /* Botões com área de toque mínima */
  .btn { min-height:48px; display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

  /* Slots maiores para toque */
  .slot { min-height:52px; display:flex; align-items:center; justify-content:center; }

  /* Serviço com área maior */
  .service-opt { min-height:56px; }

  /* Tabs com scroll horizontal sem barra */
  .tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:6px;
          scrollbar-width:none; -ms-overflow-style:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { white-space:nowrap; flex-shrink:0; min-height:40px;
         display:inline-flex; align-items:center; justify-content:center; }

  @media (max-width:600px){
    /* Containers com safe-area para notch e barra do iOS */
    .container {
      padding: 20px 16px calc(80px + env(safe-area-inset-bottom, 0px));
    }
    .container.wide {
      padding: 20px 16px calc(80px + env(safe-area-inset-bottom, 0px));
      max-width: 100%;
    }

    /* Cards com menos padding lateral */
    .card { padding:20px 16px; border-radius:12px; }

    /* Topbar compacta */
    .topbar { padding:12px 16px; }
    .topbar .brand { font-size:17px; }

    /* Botões menores lateralmente mas mantendo altura */
    .btn { padding:12px 18px; font-size:14px; }

    /* Slots grid com colunas menores */
    .slots-grid { grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px; }

    /* Hero com safe-area no fundo */
    .hero-content {
      padding: 32px 20px calc(56px + env(safe-area-inset-bottom, 0px));
    }
    .hero-content h1 { font-size:clamp(28px,8vw,42px); }

    /* Rows empilham no mobile */
    .row { flex-direction:column; gap:0; }

    /* List-item com wrap para ações */
    .list-item { padding:14px 0; align-items:flex-start; flex-wrap:wrap; gap:8px; }
    .list-item > div:first-child { flex:1 1 100%; }

    /* Chip menor */
    .chip { font-size:11px; padding:4px 10px; }

    /* Topbar top-plum com safe-area no topo */
    .top-plum { padding-top:env(safe-area-inset-top, 0px); }

    /* Barra de aviso master */
    div[style*="gold-soft"] { padding:10px 16px; font-size:12px; }

    /* Eyebrow menor */
    .eyebrow { font-size:11px; }

    /* Field sem margin extra quando dentro de row */
    .row .field { margin-bottom:18px; }

    /* Botão de dias de agendamento */
    .dias-scroll {
      display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;
      scrollbar-width:none; -ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;
    }
    .dias-scroll::-webkit-scrollbar { display:none; }
    .dias-scroll .btn { flex-shrink:0; min-width:56px; padding:10px 8px; font-size:13px; }
  }

  @media (min-width:601px){
    .dias-scroll { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .dias-scroll .btn { flex:1; padding:10px 8px; font-size:13px; min-width:0; }
  }
</style>

const STORE_KEY  = "empresas";

// Ícones padrão por tipo de botão
const ICONE_POR_TIPO = {
  whatsapp: '💬', instagram: '📸', telefone: '📞',
  maps: '📍', site: '🌐', link: '🔗'
};

let empresas = [];
let agendamentos = [];
let loaded = false;

async function loadData(){
  try{
    const { data, error } = await supabaseClient.from('empresas').select('*');
    if(error) throw error;
    empresas = (data || []).map(e => ({
      id:                   e.id,
      slug:                 e.slug,
      nome:                 e.nome,
      fotoUrl:              e.foto_url              || '',
      whatsapp:             e.whatsapp              || '',
      senhaGestao:          e.senha_gestao,
      bloqueada:            e.bloqueada,
      // Campos de personalização (Fase 2)
      descricao:            e.descricao             || '',
      logo:                 e.logo                  || '',
      corPrincipal:         e.cor_principal         || '#3d1f3a',
      textoDestaque:        e.texto_destaque        || '',
      // Relações
      servicos:             [],
      horariosPorMes:       {},
      bloqueios:            [],
      botoes:               []
    }));
  }catch(e){ console.error('Erro ao carregar empresas:', e); empresas = []; }

  if(empresas.length > 0){
    const ids = empresas.map(e => e.id);

    try{
      const { data } = await supabaseClient.from('servicos').select('*').in('empresa_id', ids);
      (data || []).forEach(s => {
        const emp = empresas.find(e => e.id === s.empresa_id);
        if(emp) emp.servicos.push({ id: s.id, nome: s.nome, duracao: s.duracao, preco: Number(s.preco) });
      });
    }catch(e){ console.error('Erro ao carregar serviços:', e); }

    try{
      const { data } = await supabaseClient.from('horarios_disponiveis').select('*').in('empresa_id', ids);
      (data || []).forEach(h => {
        const emp = empresas.find(e => e.id === h.empresa_id);
        if(!emp) return;
        emp.horariosPorMes[h.mes] = emp.horariosPorMes[h.mes] || [];
        if(!emp.horariosPorMes[h.mes].includes(h.hora)) emp.horariosPorMes[h.mes].push(h.hora);
      });
    }catch(e){ console.error('Erro ao carregar horários:', e); }

    try{
      const { data } = await supabaseClient.from('bloqueios').select('*').in('empresa_id', ids);
      (data || []).forEach(b => {
        const emp = empresas.find(e => e.id === b.empresa_id);
        if(emp) emp.bloqueios.push({ id: b.id, data: b.data, hora: b.hora });
      });
    }catch(e){ console.error('Erro ao carregar bloqueios:', e); }

    try{
      const { data } = await supabaseClient.from('botoes_empresa').select('*').in('empresa_id', ids);
      (data || []).forEach(b => {
        const emp = empresas.find(e => e.id === b.empresa_id);
        if(emp) emp.botoes.push({
          id: b.id, nome: b.nome, tipo: b.tipo, link: b.link,
          icone: b.icone || '', ordem: b.ordem, ativo: b.ativo,
          abrirNovaAba: b.abrir_nova_aba
        });
      });
      empresas.forEach(e => e.botoes.sort((a, b) => a.ordem - b.ordem));
    }catch(e){ console.error('Erro ao carregar botões:', e); }

    try{
      const { data } = await supabaseClient.from('agendamentos').select('*').in('empresa_id', ids);
      agendamentos = (data || []).map(a => {
        const emp = empresas.find(e => e.id === a.empresa_id);
        return {
          id:          a.id,
          slug:        emp ? emp.slug : '',
          servicoId:   a.servico_id,
          servicoNome: a.servico_nome,
          data:        a.data,
          hora:        a.hora,
          nome:        a.nome_cliente,
          telefone:    a.telefone,
          criadoEm:    a.criado_em
        };
      });
    }catch(e){ console.error('Erro ao carregar agendamentos:', e); agendamentos = []; }
  } else {
    agendamentos = [];
  }

  loaded = true;
}

async function saveEmpresas(){
  const toRow = e => ({
    slug:                  e.slug,
    nome:                  e.nome,
    foto_url:              e.fotoUrl              || null,
    whatsapp:              e.whatsapp              || null,
    senha_gestao:          e.senhaGestao,
    bloqueada:             e.bloqueada,
    // Campos de personalização (Fase 2)
    descricao:             e.descricao             || null,
    logo:                  e.logo                  || null,
    cor_principal:         e.corPrincipal          || '#3d1f3a',
    texto_destaque:        e.textoDestaque         || null,
  });

  const novas     = empresas.filter(e => !e.id);
  const existentes = empresas.filter(e =>  e.id);

  if(novas.length > 0){
    const { data, error } = await supabaseClient
      .from('empresas').insert(novas.map(toRow)).select();
    if(error){ console.error('Erro ao criar empresa:', error); return; }
    (data || []).forEach(row => {
      const emp = empresas.find(e => e.slug === row.slug);
      if(emp) emp.id = row.id;
    });
  }

  if(existentes.length > 0){
    const { error } = await supabaseClient
      .from('empresas')
      .upsert(existentes.map(e => ({ id: e.id, ...toRow(e) })), { onConflict: 'id' });
    if(error) console.error('Erro ao atualizar empresa:', error);
  }
}

function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}
function uid(){ return Math.random().toString(36).slice(2,9); }

let currentRoute = { master:null, empresa:null, page:"" };

function getParams(){
  return currentRoute;
}
function goto(params){
  currentRoute = { master:null, empresa:null, page:"", ...params };
  route();
}

function defaultEmpresa(){
  return {
    slug:"", nome:"", fotoUrl:"", whatsapp:"", senhaGestao:"1234", bloqueada:false,
    servicos:[],
    horariosPorMes:{},
    bloqueios:[]
  };
}

function mesKey(d){ return d.toISOString().slice(0,7); }
function horariosDoMes(emp, key){
  const lista = (emp.horariosPorMes && emp.horariosPorMes[key]) || [];
  return [...lista].sort();
}
function proximosDiasComHorario(emp, qtd=21){
  const out = [];
  const hoje = new Date();
  for(let i=0;i<120 && out.length<qtd;i++){
    const d = new Date(hoje);
    d.setDate(hoje.getDate()+i);
    if(horariosDoMes(emp, mesKey(d)).length>0){
      out.push(d);
    }
  }
  return out;
}
function fmtData(d){
  return d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'});
}
function isoData(d){ return d.toISOString().slice(0,10); }

const root = document.getElementById('root');
function render(html){ root.innerHTML = html; }

// ---------- INIT ----------
async function init(){
  render(`<div class="loading">Carregando…</div>`);
  await loadData();
  const params = new URLSearchParams(location.search);
  if(params.get('empresa')) currentRoute.empresa = params.get('empresa');
  else if(params.get('master')) currentRoute.master = 1;
  route();
}

function route(){
  const {master, empresa, page} = getParams();
  if(master){
    renderMaster();
  } else if(empresa){
    const emp = empresas.find(e=>e.slug===empresa);
    if(!emp){ renderNotFound(); return; }
    if(page==="agendar") renderAgendar(emp);
    else if(page==="confirmacao") renderConfirmacao(emp);
    else if(page==="gestao") renderGestaoLogin(emp);
    else renderHome(emp);
  } else {
    renderLanding();
  }
}

// ---------- HOME DA EMPRESA ----------
function renderHome(emp){
  applyAccent(emp.corPrincipal);
  if(emp.bloqueada){
    render(`${barraVoltarMaster()}<div class="container"><div class="empty"><h2 class="display">Agendamentos temporariamente indisponíveis</h2><p>Entre em contato diretamente com ${escapeHtml(emp.nome)}.</p></div></div>`);
    return;
  }

  const bg  = emp.fotoUrl || 'https://images.unsplash.com/photo-1560066984-138dadb4c035?q=80&w=1600&auto=format&fit=crop';
  const cor = emp.corPrincipal || '#3d1f3a';
  const botoesAtivos = (emp.botoes || []).filter(b => b.ativo).sort((a,b) => a.ordem - b.ordem);

  const logoHtml = emp.logo
    ? `<img src="${escapeAttr(emp.logo)}" alt="Logo" style="width:180px;height:180px;border-radius:50%;border:4px solid #fff;object-fit:cover;box-shadow:0 4px 24px rgba(0,0,0,0.22);">`
    : `<div style="width:180px;height:180px;border-radius:50%;border:4px solid #fff;background:${cor};display:flex;align-items:center;justify-content:center;font-size:72px;font-family:'Fraunces',serif;font-weight:600;color:#fff;box-shadow:0 4px 24px rgba(0,0,0,0.22);">${escapeHtml(emp.nome.charAt(0).toUpperCase())}</div>`;

  const botoesHtml = botoesAtivos.map(b => {
    const target = b.abrirNovaAba ? 'target="_blank" rel="noopener noreferrer"' : '';
    return `<a href="${escapeAttr(b.link)}" ${target} style="text-decoration:none;display:block;width:100%;max-width:360px;margin:0 auto 10px;">
      <div style="background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 20px;font-size:15px;font-weight:600;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);color:var(--ink);">
        ${escapeHtml(b.nome)}
      </div>
    </a>`;
  }).join('');

  render(`
    ${barraVoltarMaster()}
    <div style="min-height:100vh;background:var(--paper);display:flex;flex-direction:column;">

      <!-- Imagem de fundo -->
      <div style="position:relative;height:200px;background-image:url('${escapeAttr(bg)}');background-size:cover;background-position:center;">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,20,0.1) 0%,rgba(20,10,20,0.55) 100%);"></div>
      </div>

      <!-- Perfil -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px;margin-top:-90px;position:relative;">

        ${logoHtml}

        <h1 style="font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:14px 0 4px;text-align:center;color:var(--ink);">${escapeHtml(emp.nome)}</h1>

// ---------- AGENDAMENTO ----------
let bookingState = {};
function renderAgendar(emp){
  applyAccent(emp.corPrincipal);
  bookingState = { servico:null, data:null, hora:null, nome:"", telefone:"" };

  function primeiros7Dias(emp){
    const out = [];
    const hoje = new Date();
    for(let i=0;i<120 && out.length<7;i++){
      const d = new Date(hoje);
      d.setDate(hoje.getDate()+i);
      const key = mesKey(d);
      const h = horariosDoMes(emp, key);
      if(h.length>0) out.push(d);
    }
    return out;
  }

  function draw(){
    const dias7 = primeiros7Dias(emp);

    const diasHtml = dias7.length ? dias7.map(d=>{
      const iso = isoData(d);
      const sel = bookingState.data===iso;
      const label = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      return `<button class="btn ${sel?'':'ghost'}" onclick="selectDia('${iso}')">${label}</button>`;
    }).join("") : `<p class="muted">Nenhuma data disponível.</p>`;

    // verifica se data selecionada não está nos 7 (veio do calendário)
    const dataForaDos7 = bookingState.data && !dias7.some(d=>isoData(d)===bookingState.data);
    const dataFmtOutra = bookingState.data && dataForaDos7
      ? new Date(bookingState.data+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
      : null;

    const slots = bookingState.data ? horariosDoMes(emp, bookingState.data.slice(0,7)) : [];
    const _agora = new Date();
    const _hojeIso = isoData(_agora);
    const slotsHtml = bookingState.data ? (slots.length ? slots.map(h=>{
      const taken = agendamentos.some(a=>a.slug===emp.slug && a.data===bookingState.data && a.hora===h);
      const bloqueado = (emp.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===h);
      const passado = bookingState.data === _hojeIso && (()=>{const [hh,mm]=h.split(':').map(Number); return hh*60+mm <= _agora.getHours()*60+_agora.getMinutes();})();
      const sel = bookingState.hora===h;
      if(taken || bloqueado || passado) return `<div class="slot taken">${h}</div>`;
      return `<div class="slot free ${sel?'selected':''}" onclick="selectHora('${h}')">${h}</div>`;
    }).join("") : `<p class="muted">Nenhum horário disponível nesta data.</p>`) : `<p class="muted">Escolha um dia primeiro.</p>`;

    const servicosHtml = emp.servicos.map(s=>{
      const sel = bookingState.servico===s.id;
      return `<div class="service-opt ${sel?'selected':''}" onclick="selectServico('${s.id}')">
        <strong>${escapeHtml(s.nome)}</strong>
      </div>`;
    }).join("");

    const telDigits = bookingState.telefone.replace(/\D/g,'');
    const telValido = telDigits.length === 12 && telDigits[0] === '0' && telDigits[3] === '9';
    const telErro   = telDigits.length > 0 && !telValido;
    const canSubmit = bookingState.servico && bookingState.data && bookingState.hora && bookingState.nome.trim() && telValido;

    render(`
      ${barraVoltarMaster()}
      <div class="topbar top-plum" style="display:grid;grid-template-columns:44px 1fr 44px;align-items:center;">
        <button class="icon-btn" style="color:#e9dcc7;font-size:22px;line-height:1;" onclick="goto({empresa:'${emp.slug}'})">←</button>
        <div class="brand" style="text-align:center;font-size:17px;">${escapeHtml(emp.nome)}</div>
        <div></div>
      </div>
      <div class="container">
        <div class="card">
          <div class="eyebrow">Passo 1</div>
          <h3 class="display">Escolha o serviço</h3>
          ${servicosHtml}

          <div class="eyebrow" style="margin-top:24px;">Passo 2</div>
          <h3 class="display">Escolha o dia</h3>
          <div class="dias-scroll">
            ${diasHtml}
            <button class="btn ${dataFmtOutra?'':'ghost'}" style="position:relative;flex-shrink:0;min-width:72px;" onclick="document.getElementById('calPicker').showPicker ? document.getElementById('calPicker').showPicker() : document.getElementById('calPicker').click()">
              ${dataFmtOutra ? dataFmtOutra : 'Outra data'}
              <input type="date" id="calPicker" value="${bookingState.data||''}" style="position:absolute;opacity:0;width:1px;height:1px;top:0;left:0;" onchange="selectDiaOutra(this.value)"/>
            </button>
          </div>

          <div class="eyebrow" style="margin-top:24px;">Passo 3</div>
          <h3 class="display">Escolha o horário</h3>
          <div class="slots-grid">${slotsHtml}</div>

          <div class="eyebrow" style="margin-top:24px;">Passo 4</div>
          <h3 class="display">Seus dados</h3>
          <div class="field"><label>Nome</label><input id="inpNome" value="${escapeAttr(bookingState.nome)}" oninput="bookingState.nome=this.value.toUpperCase();this.value=this.value.toUpperCase()" placeholder="SEU NOME" style="text-transform:uppercase;"/></div>
          <div class="field">
            <label>Telefone (WhatsApp)</label>
            <input id="inpTel" type="tel" inputmode="numeric" maxlength="12"
              value="${escapeAttr(bookingState.telefone)}"
              oninput="formatarTelefone(this)"
              placeholder="011912345678"/>
            <div id="telError" style="display:${telErro?'flex':'none'};align-items:flex-start;gap:6px;margin-top:8px;color:var(--danger);font-size:13px;line-height:1.4;">
              <span style="font-weight:700;font-size:15px;flex-shrink:0;">ⓘ</span>
              <span>Formato: 0 + DDD (2 dígitos) + 9 + número (8 dígitos). Ex: <strong>011912345678</strong></span>
            </div>
          </div>

          <button id="btnAgendar" class="btn" style="width:100%;margin-top:8px;" ${canSubmit?'':'disabled'} onclick="confirmarAgendamento('${emp.slug}')">Agendar</button>
        </div>
      </div>
    `);
  }
  window.selectServico = (id)=>{ bookingState.servico = id; draw(); };
  window.selectDia = (iso)=>{ bookingState.data = iso; bookingState.hora=null; draw(); };
  window.selectDiaOutra = (iso)=>{ if(iso){ bookingState.data = iso; bookingState.hora=null; draw(); } };
  window.selectHora = (h)=>{ bookingState.hora = h; draw(); };
  window.formatarTelefone = (input)=>{
    let v = input.value.replace(/\D/g,'');
    if(v.length > 0 && v[0] !== '0') v = '0' + v;
    v = v.slice(0, 12);
    input.value = v;
    bookingState.telefone = v;
    const digits = v;
    const valido = digits.length === 12 && digits[0] === '0' && digits[3] === '9';
    const erro = digits.length > 0 && !valido;
    const errEl = document.getElementById('telError');
    if(errEl) errEl.style.display = erro ? 'flex' : 'none';
    const btn = document.getElementById('btnAgendar');
    if(btn) btn.disabled = !(bookingState.servico && bookingState.data && bookingState.hora && bookingState.nome.trim() && valido);
  };
  draw();
}

async function confirmarAgendamento(slug){
  const emp = empresas.find(e=>e.slug===slug);
  const nomeInp = document.getElementById('inpNome');
  const telInp = document.getElementById('inpTel');
  bookingState.nome = nomeInp ? nomeInp.value : bookingState.nome;
  bookingState.telefone = telInp ? telInp.value : bookingState.telefone;
  const _digits = bookingState.telefone.replace(/\D/g,'');
  const _telOk = _digits.length === 12 && _digits[0] === '0' && _digits[3] === '9';
  if(!bookingState.servico || !bookingState.data || !bookingState.hora || !bookingState.nome.trim() || !_telOk) return;

  const jaOcupado = agendamentos.some(a=>a.slug===slug && a.data===bookingState.data && a.hora===bookingState.hora)
    || (emp.bloqueios||[]).some(b=>b.data===bookingState.data && b.hora===bookingState.hora);
  if(jaOcupado){ alert("Esse horário acabou de ser reservado ou bloqueado. Escolha outro."); renderAgendar(emp); return; }

  const servico = emp.servicos.find(s=>s.id===bookingState.servico);
  const { data: row, error } = await supabaseClient.from('agendamentos').insert({
    empresa_id:   emp.id,
    servico_id:   servico ? servico.id : null,
    servico_nome: servico ? servico.nome : '',
    data:         bookingState.data,
    hora:         bookingState.hora,
    nome_cliente: bookingState.nome.trim(),
    telefone:     bookingState.telefone.trim()
  }).select().single();
  if(error){
    if(error.code === '23505'){ alert("Esse horário acabou de ser reservado. Escolha outro."); renderAgendar(emp); return; }
    alert("Erro ao realizar agendamento. Tente novamente."); return;
  }
  const novo = {
    id: row.id, slug, servicoId: row.servico_id, servicoNome: row.servico_nome,
    data: row.data, hora: row.hora, nome: row.nome_cliente, telefone: row.telefone, criadoEm: row.criado_em
  };
  agendamentos.push(novo);
  lastBooking = novo;
  goto({empresa:slug, page:'confirmacao'});
}

        <div class="field"><label>Nome exibido</label><input id="bNome" placeholder="Ex: WhatsApp"/></div>
        <div class="field"><label>Tipo</label>
          <select id="bTipo">
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram</option>
            <option value="telefone">Telefone</option>
            <option value="maps">Google Maps</option>
            <option value="site">Site</option>
            <option value="link">Link personalizado</option>
          </select>
        </div>
        <div class="field"><label>Link</label><input id="bLink" placeholder="https://wa.me/5511999999999"/></div>
        <div class="field"><label>Ícone (deixe vazio para padrão)</label><input id="bIcone" placeholder=""/></div>
        <div class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
          <input type="checkbox" id="bNovaAba" checked style="width:20px;min-height:20px;margin:0;"/>
          <label style="margin:0;text-transform:none;font-size:14px;font-weight:500;letter-spacing:0;">Abrir em nova aba</label>
        </div>
        <div class="row">
          <button class="btn ghost" onclick="cancelarNovoBotao()">Cancelar</button>
          <button class="btn" onclick="salvarNovoBotao()">Adicionar</button>
        </div>
      </div>
    ` : `<button class="btn ghost" style="width:100%;margin-top:14px;" onclick="iniciarNovoBotao()">+ Adicionar botão</button>`;

    return `
      <div class="eyebrow" style="margin-bottom:16px;">Identidade visual</div>

      <div class="field"><label>Nome da empresa</label><input id="pNome" value="${escapeAttr(emp.nome)}"/></div>
      <div class="field"><label>Descrição curta</label><textarea id="pDescricao" rows="2" style="resize:vertical;min-height:80px;">${escapeHtml(emp.descricao||'')}</textarea></div>
      <div class="field"><label>Texto de destaque</label><input id="pTextoDestaque" value="${escapeAttr(emp.textoDestaque||'')}" placeholder="Ex: Atendimento premium"/></div>
      <div class="field"><label>Logo — URL da imagem</label><input id="pLogo" value="${escapeAttr(emp.logo||'')}" placeholder="https://..."/></div>
      <div class="field"><label>Imagem de fundo — URL</label><input id="pFotoUrl" value="${escapeAttr(emp.fotoUrl||'')}" placeholder="https://..."/></div>
      <div class="field">
        <label>Cor principal</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <input type="color" id="pCor" value="${escapeAttr(cor)}" style="padding:4px;height:48px;width:64px;border-radius:10px;cursor:pointer;"/>
          <span class="muted" style="font-size:13px;">Usada nos botões e destaques da página</span>
        </div>
      </div>

      <button class="btn" style="width:100%;" onclick="salvarInfoEmpresa()">Salvar informações</button>
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost" style="flex:1;" onclick="goto({empresa:'${emp.slug}'})">Ver página</button>
        <button class="btn ghost" style="flex:1;" onclick="compartilharLink()">Compartilhar link</button>
      </div>

      <div class="eyebrow" style="margin-top:36px;margin-bottom:4px;">Botões da página</div>
      <p class="muted" style="font-size:13px;margin:0 0 16px;">Aparecem na página pública abaixo do botão de agendamento.</p>
      ${botoesHtml}
      ${formNovoBotao}
    `;
  }

  function draw(){
    const body = corner==='configurar'   ? configurarBody()
               : corner==='personalizar' ? personalizarBody()
               : agendamentosBody();
    render(`
      <div style="position:sticky;top:0;z-index:100;background:var(--paper);">
        ${barraVoltarMaster()}
        <div class="topbar top-plum"><div class="brand">${escapeHtml(emp.nome)} · Gestão</div><button class="icon-btn" style="color:#e9dcc7;" onclick="goto({empresa:'${emp.slug}'})">Sair</button></div>
        <div class="tabs" style="padding:8px 16px 0;border-bottom:1.5px solid var(--line);margin:0;gap:0;background:var(--paper);">
          <div class="tab ${!corner?'active':''}" style="flex:1;text-align:center;padding:10px 6px;font-size:14px;" onclick="setCorner(null)">Agendamentos</div>
          <div class="tab ${corner==='configurar'?'active':''}" style="flex:1;text-align:center;padding:10px 6px;font-size:14px;" onclick="setCorner('configurar')">Configurar</div>
          <div class="tab ${corner==='personalizar'?'active':''}" style="flex:1;text-align:center;padding:10px 6px;font-size:14px;" onclick="setCorner('personalizar')">Personalizar</div>
        </div>
      </div>
      <div class="container wide">
        <div class="card" style="${corner==='configurar'?'background:none;box-shadow:none;padding:0;':''}">${body}</div>
      </div>
    `);
  }

  window.setCorner = (c)=>{ corner=c; editandoId=null; draw(); };
  window.selecionarDiaGestao = (iso)=>{ diaSelecionado=iso; editandoId=null; draw(); };

  window.bloquearDiaTodo = async ()=>{
    const horarios = horariosDoMes(emp, diaSelecionado.slice(0,7));
    if(!horarios.length){ alert("Nenhum horário configurado para este dia."); return; }
    const livres = horarios.filter(h => !((emp.bloqueios||[]).some(b=>b.data===diaSelecionado && b.hora===h)));
    if(!livres.length){ alert("Todos os horários deste dia já estão bloqueados."); return; }
    const dataFmtConf = new Date(diaSelecionado+"T00:00:00").toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(!confirm(`Bloquear todos os ${livres.length} horários de ${dataFmtConf}?`)) return;
    const rows = livres.map(h=>({ slug: emp.slug, data: diaSelecionado, hora: h }));
    const { data, error } = await supabaseClient.from('bloqueios').insert(rows).select();
    if(error){ alert("Erro ao bloquear: " + error.message); return; }
    if(data) data.forEach(r=>{ (emp.bloqueios=emp.bloqueios||[]).push({id:r.id, data:r.data, hora:r.hora}); });
    draw();
  };

  window.editarAgendamento = (id)=>{ editandoId=id; draw(); };
  window.cancelarEdicaoAgendamento = ()=>{ editandoId=null; draw(); };
  window.salvarEdicaoAgendamento = async (id)=>{
    const ag = agendamentos.find(a=>a.id===id);
    const nome = document.getElementById('editNome').value.trim();
    const tel = document.getElementById('editTel').value.trim();
    const servicoId = document.getElementById('editServico').value;
    const hora = document.getElementById('editHora').value;
    if(!nome || !tel){ alert("Preencha nome e telefone."); return; }
    if(hora !== ag.hora){
      const ocupado = agendamentos.some(a=>a.id!==ag.id && a.slug===emp.slug && a.data===ag.data && a.hora===hora);
      if(ocupado){ alert("Esse horário já está ocupado."); return; }
    }
    const servico = emp.servicos.find(s=>s.id===servicoId);
    const { error } = await supabaseClient.from('agendamentos').update({
      nome_cliente: nome,
      telefone:     tel,
      servico_id:   servicoId,
      servico_nome: servico ? servico.nome : ag.servicoNome,
      hora:         hora
    }).eq('id', id);
    if(error){ console.error('Erro ao editar agendamento:', error); return; }
    ag.nome = nome; ag.telefone = tel; ag.servicoId = servicoId; ag.servicoNome = servico?servico.nome:ag.servicoNome; ag.hora = hora;
    editandoId = null; draw();
  };
  window.cancelarAgendamento = async (id)=>{
    const { error } = await supabaseClient.from('agendamentos').delete().eq('id', id);
    if(error){ console.error('Erro ao cancelar agendamento:', error); return; }
    agendamentos = agendamentos.filter(a=>a.id!==id);
    draw();
  };
  window.bloquearHorario = async (data,hora)=>{
    const { data: row, error } = await supabaseClient.from('bloqueios').insert({
      empresa_id: emp.id, data, hora
    }).select().single();
    if(error){ console.error('Erro ao bloquear horário:', error); return; }
    emp.bloqueios = emp.bloqueios || [];
    emp.bloqueios.push({ id: row.id, data, hora });
    draw();
  };
  window.desbloquearHorario = async (data,hora)=>{
    const { error } = await supabaseClient.from('bloqueios')
      .delete().eq('empresa_id', emp.id).eq('data', data).eq('hora', hora);
    if(error){ console.error('Erro ao desbloquear horário:', error); return; }
    emp.bloqueios = (emp.bloqueios||[]).filter(b=>!(b.data===data && b.hora===hora));
    draw();
  };

  window.adicionarServico = async ()=>{
    const inp = document.getElementById('novoServicoInput');
    const nome = inp ? inp.value.trim() : '';
    if(!nome){ alert("Digite o nome do serviço."); return; }
    const { data: row, error } = await supabaseClient.from('servicos').insert({
      empresa_id: emp.id, nome, duracao: 60, preco: 0
    }).select().single();
    if(error){ console.error('Erro ao adicionar serviço:', error); return; }
    emp.servicos.push({ id: row.id, nome: row.nome, duracao: row.duracao, preco: Number(row.preco) });
    draw();
  };
  window.removeServico = async (i)=>{
    const s = emp.servicos[i];
    const { error } = await supabaseClient.from('servicos').delete().eq('id', s.id);
    if(error){ console.error('Erro ao remover serviço:', error); return; }
    emp.servicos.splice(i,1);
    draw();
  };
  window.updServico = async (i,field,val)=>{
    const s = emp.servicos[i];
    const dbVal = (field==='duracao'||field==='preco') ? Number(val) : val;
    s[field] = dbVal;
    const { error } = await supabaseClient.from('servicos').update({ [field]: dbVal }).eq('id', s.id);
    if(error) console.error('Erro ao atualizar serviço:', error);
  };

  window.mudarMesHorario = (val)=>{ mesHorario = val; draw(); };
  window.adicionarHorario = async ()=>{
    const val = document.getElementById('novoHorarioInput').value;
    if(!val){ return; }
    emp.horariosPorMes = emp.horariosPorMes || {};
    const lista = emp.horariosPorMes[mesHorario] || [];
    if(lista.includes(val)){ return; }
    const { error } = await supabaseClient.from('horarios_disponiveis').insert({
      empresa_id: emp.id, mes: mesHorario, hora: val
    });
    if(error){ console.error('Erro ao adicionar horário:', error); return; }
    lista.push(val);
    emp.horariosPorMes[mesHorario] = lista;
    draw();
  };
  window.removerHorario = async (h)=>{
    const { error } = await supabaseClient.from('horarios_disponiveis')
      .delete().eq('empresa_id', emp.id).eq('mes', mesHorario).eq('hora', h);
    if(error){ console.error('Erro ao remover horário:', error); return; }
    emp.horariosPorMes[mesHorario] = (emp.horariosPorMes[mesHorario]||[]).filter(x=>x!==h);
    draw();
  };

  // ── PERSONALIZAR PÁGINA ──────────────────────────────────

  window.salvarInfoEmpresa = async ()=>{
    emp.nome               = document.getElementById('pNome').value.trim() || emp.nome;
    emp.descricao          = document.getElementById('pDescricao').value.trim();
    emp.textoDestaque      = document.getElementById('pTextoDestaque').value.trim();
    emp.logo               = document.getElementById('pLogo').value.trim();
    emp.fotoUrl            = document.getElementById('pFotoUrl').value.trim();
    emp.corPrincipal       = document.getElementById('pCor').value;
    const { error } = await supabaseClient.from('empresas').update({
      nome:                  emp.nome,
      descricao:             emp.descricao             || null,
      logo:                  emp.logo                  || null,
      foto_url:              emp.fotoUrl               || null,
      cor_principal:         emp.corPrincipal,
      texto_destaque:        emp.textoDestaque         || null,
    }).eq('id', emp.id);
    if(error){ console.error('Erro ao salvar informações:', error); alert('Erro ao salvar. Verifique o console.'); return; }
    alert('Informações salvas!');
    draw();
  };

  window.iniciarNovoBotao  = ()=>{ novoBotaoState = {}; draw(); };
  window.cancelarNovoBotao = ()=>{ novoBotaoState = null; draw(); };

  window.salvarNovoBotao = async ()=>{
    const nome    = document.getElementById('bNome').value.trim();
    const tipo    = document.getElementById('bTipo').value;
    const link    = document.getElementById('bLink').value.trim();
    const icone   = document.getElementById('bIcone').value.trim();
    const novaAba = document.getElementById('bNovaAba').checked;
    if(!nome){ alert('Preencha o nome do botão.'); return; }
    if(!link){ alert('Preencha o link do botão.'); return; }
    const ordemMax = emp.botoes.length > 0 ? Math.max(...emp.botoes.map(b=>b.ordem)) + 1 : 0;
    const { data: row, error } = await supabaseClient.from('botoes_empresa').insert({
      empresa_id:    emp.id,
      nome, tipo, link,
      icone:         icone || ICONE_POR_TIPO[tipo] || '🔗',
      ordem:         ordemMax,
      ativo:         true,
      abrir_nova_aba: novaAba
    }).select().single();
    if(error){ console.error('Erro ao adicionar botão:', error); alert('Erro ao salvar. Verifique o console.'); return; }
    emp.botoes.push({ id:row.id, nome:row.nome, tipo:row.tipo, link:row.link,
      icone:row.icone, ordem:row.ordem, ativo:row.ativo, abrirNovaAba:row.abrir_nova_aba });
    emp.botoes.sort((a,b)=>a.ordem-b.ordem);
    novoBotaoState = null;
    draw();
  };

  window.removerBotao = async (id)=>{
    if(!confirm('Remover este botão?')) return;
    const { error } = await supabaseClient.from('botoes_empresa').delete().eq('id', id);
    if(error){ console.error('Erro ao remover botão:', error); return; }
    emp.botoes = emp.botoes.filter(b=>b.id!==id);
    draw();
  };

  window.toggleBotao = async (id)=>{
    const b = emp.botoes.find(x=>x.id===id);
    const novoAtivo = !b.ativo;
    const { error } = await supabaseClient.from('botoes_empresa').update({ ativo: novoAtivo }).eq('id', id);
    if(error){ console.error('Erro ao atualizar botão:', error); return; }
    b.ativo = novoAtivo;
    draw();
  };

  window.subirBotao = async (id)=>{
    const idx = emp.botoes.findIndex(b=>b.id===id);
    if(idx <= 0) return;
    const curr = emp.botoes[idx], prev = emp.botoes[idx-1];
    [curr.ordem, prev.ordem] = [prev.ordem, curr.ordem];
    await supabaseClient.from('botoes_empresa').update({ ordem: curr.ordem }).eq('id', curr.id);
    await supabaseClient.from('botoes_empresa').update({ ordem: prev.ordem }).eq('id', prev.id);
    emp.botoes.sort((a,b)=>a.ordem-b.ordem);
    draw();
  };

  window.descerBotao = async (id)=>{
    const idx = emp.botoes.findIndex(b=>b.id===id);
    if(idx >= emp.botoes.length-1) return;
    const curr = emp.botoes[idx], next = emp.botoes[idx+1];
    [curr.ordem, next.ordem] = [next.ordem, curr.ordem];
    await supabaseClient.from('botoes_empresa').update({ ordem: curr.ordem }).eq('id', curr.id);
    await supabaseClient.from('botoes_empresa').update({ ordem: next.ordem }).eq('id', next.id);
    emp.botoes.sort((a,b)=>a.ordem-b.ordem);
    draw();
  };

  window.compartilharLink = async ()=>{
    const url = location.origin + location.pathname + '?empresa=' + emp.slug;
    if(navigator.share){
      try{ await navigator.share({ title: emp.nome, url }); } catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(url); alert('Link copiado!'); }
      catch(e){ prompt('Copie o link abaixo:', url); }
    }
  };

  draw();
}

// ---------- PAINEL MASTER ----------
function renderMaster(){
  const authed = sessionStorage_getMaster();
  if(!authed){ renderMasterLogin(); return; }
  renderMasterPanel();
}
// (usamos variável em memória em vez de sessionStorage do navegador, que não é permitido)
let masterAuthed = false;
function sessionStorage_getMaster(){ return masterAuthed; }

function renderMasterLogin(){
  applyAccent('#1a1a1a');
  render(`
    <div class="topbar top-plum"><div class="brand" style="text-align:center;width:100%;">Agenda+</div></div>
    <div class="container">
      <div class="card">
        <div class="eyebrow">Painel master</div>
        <h2 class="display">Entrar</h2>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="masterPass" placeholder="Senha master" onkeyup="checkCapsLock(event,'cL2')"/>
          <div id="cL2" style="display:none;align-items:center;gap:5px;color:var(--danger);font-size:12px;margin-top:6px;"><strong>!</strong> Caps Lock ativado</div>
        </div>
        <button class="btn" style="width:100%;" onclick="tentarLoginMaster()">Entrar</button>
      </div>
    </div>
  `);
}
window.tentarLoginMaster = ()=>{
  const val = document.getElementById('masterPass').value;
  if(val === MASTER_PASS){ masterAuthed = true; renderMasterPanel(); }
  else alert("Senha incorreta.");
};

let editingSlug = null;
function renderMasterPanel(){
  applyAccent('#1a1a1a');
  function draw(){
    const editing = editingSlug ? empresas.find(e=>e.slug===editingSlug) : null;
    const form = editing ? `
      <div class="card" style="margin-bottom:24px;">
        <h3 class="display">Editar empresa</h3>
        <div class="field"><label>Nome</label><input value="${escapeAttr(editing.nome)}" onchange="masterUpd('nome',this.value)"/></div>
        <div class="field"><label>Foto de fundo (URL)</label><input value="${escapeAttr(editing.fotoUrl)}" onchange="masterUpd('fotoUrl',this.value)"/></div>
        <div class="field"><label>WhatsApp</label><input value="${escapeAttr(editing.whatsapp)}" onchange="masterUpd('whatsapp',this.value)"/></div>
        <div class="field"><label>Senha de gestão da empresa</label><input value="${escapeAttr(editing.senhaGestao)}" onchange="masterUpd('senhaGestao',this.value)"/></div>
        <div class="field"><label>Link público (quando publicado)</label>
          <input readonly value="${escapeAttr(location.origin+location.pathname+'?empresa='+editing.slug)}" onclick="this.select()"/>
        </div>
        <div class="row">
          <button class="btn ghost" onclick="goto({empresa:'${editing.slug}'})">Ver página inicial</button>
          <button class="btn ghost" onclick="goto({empresa:'${editing.slug}', page:'agendar'})">Ver agendamento</button>
        </div>
        <div class="row" style="margin-top:12px;">
          <button class="btn ghost" onclick="editingSlug=null; drawMaster();">Fechar</button>
          <button class="btn ${editing.bloqueada?'':'danger'}" onclick="masterToggleBloqueio()">${editing.bloqueada?'Desbloquear':'Bloquear'}</button>
        </div>
        <button class="btn danger" style="width:100%;margin-top:12px;" onclick="masterExcluir('${editing.slug}')">Excluir empresa</button>
      </div>
    ` : `
      <div class="card" style="margin-bottom:24px;">
        <h3 class="display">Nova empresa</h3>
        <div class="field"><label>Nome</label><input id="novoNome" placeholder="Ex: Studio Bella"/></div>
        <div class="field"><label>Foto de fundo (URL)</label><input id="novaFoto" placeholder="https://..."/></div>
        <div class="field"><label>WhatsApp (com DDD)</label><input id="novoWhats" placeholder="11912345678"/></div>
        <div class="field"><label>Senha de gestão da empresa</label><input id="novaSenha" placeholder="Ex: minha123"/></div>
        <button class="btn" onclick="masterCriar()">Criar empresa</button>
      </div>
    `;
    const lista = empresas.map(e=>{
      const link = location.origin + location.pathname + "?empresa=" + e.slug;      return `
      <div class="list-item">
        <div style="flex:1;">
          <strong>${escapeHtml(e.nome)}</strong>
          <span class="chip ${e.bloqueada?'blocked':'ok'}" style="margin-left:8px;">${e.bloqueada?'Bloqueada':'Ativa'}</span>
          <div class="muted" style="font-size:12px;margin-top:6px;">Link (quando publicado): <input readonly value="${escapeAttr(link)}" style="font-size:12px;padding:6px 8px;" onclick="this.select()"/></div>
          <div class="row" style="margin-top:10px;flex-wrap:wrap;">
            <button class="btn ghost" style="flex:0 0 auto;" onclick="goto({empresa:'${e.slug}'})">Ver página inicial</button>
            <button class="btn ghost" style="flex:0 0 auto;" onclick="goto({empresa:'${e.slug}', page:'agendar'})">Ver agendamento</button>
            <button class="btn ghost" style="flex:0 0 auto;" onclick="goto({empresa:'${e.slug}', page:'gestao'})">Ver gestão</button>
          </div>
        </div>
        <button class="btn ghost" style="margin-left:12px;" onclick="editingSlug='${e.slug}'; drawMaster();">Editar</button>
      </div>
    `;}).join("") || `<p class="muted">Nenhuma empresa cadastrada ainda.</p>`;

    render(`
      <div class="topbar top-plum"><div class="brand">Agenda+ · Master</div><button class="icon-btn" style="color:#e9dcc7;" onclick="masterAuthed=false; renderMaster();">Sair</button></div>
      <div class="container wide">
        ${form}
        <div class="card">
          <h3 class="display">Empresas cadastradas</h3>
          ${lista}
        </div>
      </div>
    `);
  }
  window.drawMaster = draw;
  window.masterCriar = async ()=>{
    const nome = document.getElementById('novoNome').value.trim();
    if(!nome){ alert("Digite o nome da empresa."); return; }
    const senha = document.getElementById('novaSenha').value.trim();
    if(!senha){ alert("Defina uma senha de gestão para a empresa."); return; }
    let slug = slugify(nome);
    let s2 = slug, n=1;
    while(empresas.some(e=>e.slug===s2)){ s2 = slug+"-"+(++n); }
    const nova = defaultEmpresa();
    nova.slug = s2; nova.nome = nome;
    nova.fotoUrl = document.getElementById('novaFoto').value.trim();
    nova.whatsapp = document.getElementById('novoWhats').value.trim();
    nova.senhaGestao = senha;
    empresas.push(nova);
    await saveEmpresas();
    goto({empresa: s2});
  };
  window.masterUpd = async (field,val)=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e[field] = val; await saveEmpresas();
  };
  window.masterToggleBloqueio = async ()=>{
    const e = empresas.find(x=>x.slug===editingSlug);
    e.bloqueada = !e.bloqueada; await saveEmpresas(); draw();
  };
  window.masterExcluir = async (slug)=>{
    const e = empresas.find(x=>x.slug===slug);
    if(!confirm(`Excluir "${e.nome}" definitivamente? Isso também apaga os agendamentos dela. Essa ação não pode ser desfeita.`)) return;
    if(e.id){
      const { error } = await supabaseClient.from('empresas').delete().eq('id', e.id);
      if(error){ console.error('Erro ao excluir empresa:', error); return; }
    }
    empresas = empresas.filter(x=>x.slug!==slug);
    agendamentos = agendamentos.filter(a=>a.slug!==slug);
    await saveAgendamentos();
    editingSlug = null;
    draw();
  };
  draw();
}

function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function checkCapsLock(e, id){ const el=document.getElementById(id); if(el) el.style.display=e.getModifierState('CapsLock')?'flex':'none'; }
function applyAccent(cor){ document.documentElement.style.setProperty('--accent', cor || '#3d1f3a'); }

init();
</script>
